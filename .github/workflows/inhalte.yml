name: Buchinhalte holen

# Holt Handlungs-/Klappentexte zu den Büchern nach tools/quellen/inhalte/,
# damit daraus Quizfragen geschrieben werden können.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inhalte_holen.py'
      - '.github/workflows/inhalte.yml'

permissions:
  contents: write

concurrency:
  group: inhalte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Texte laden
        run: python -u tools/inhalte_holen.py --minuten 270
      - name: Ins Repo übernehmen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/quellen/inhalte
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "Bücherwurm: Buchinhalte für Quizfragen [skip ci]"
          for i in 1 2 3; do git pull --no-rebase && git push && break; sleep 5; done
