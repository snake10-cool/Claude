name: RIS holen

# Lädt die Fischerei-Verordnungen der Bundesländer aus dem RIS ins Repo
# (tools/quellen/ris). Von Hand starten oder bei Änderung des Skripts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ris_holen.py'
      - '.github/workflows/ris.yml'

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RIS laden
        run: python tools/ris_holen.py
      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/quellen
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "RIS: Fischerei-Verordnungen aktualisiert"
          git pull --rebase
          git push
