name: Apps bauen

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'installer/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:
    inputs:
      plattform:
        description: 'Was soll gebaut werden?'
        type: choice
        options: [handy, pc, beide]
        default: handy

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  # Standard (bei jedem Push) ist nur die Handy-Version (APK). PC auf Wunsch:
  # Actions → Apps bauen → Run workflow → "pc" oder "beide".
  # Gemeinsame Pakete einzeln prüfen.
  pakete:
    if: github.event_name != 'workflow_dispatch' || inputs.plattform != 'pc'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paket: [app_basis, app_kauf]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: ${{ matrix.paket }} prüfen
        working-directory: packages/${{ matrix.paket }}
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # Standard (bei jedem Push) ist nur die Handy-Version (APK). PC auf Wunsch:
  # Actions → Apps bauen → Run workflow → "pc" oder "beide".
  # Neue App: eine Zeile in der Matrix ergänzen.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.plattform != 'pc'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ordner: austro_angler, datei: AustroAngler }
          - { ordner: lernapp, datei: Lernfuchs }
          - { ordner: druckkasse, datei: Druckkasse }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: ${{ matrix.datei }} prüfen und bauen
        working-directory: apps/${{ matrix.ordner }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          mkdir -p ../../ausgabe
          cp build/app/outputs/flutter-apk/app-release.apk ../../ausgabe/${{ matrix.datei }}.apk

      # Play-Store-Paket (AAB), signiert mit dem Upload-Schlüssel. Läuft nur,
      # wenn die Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORT
      # angelegt sind (siehe apps/austro_angler/docs/play-store.md). Die
      # Test-APK oben bleibt mit dem Debug-Schlüssel signiert, damit Updates
      # darüber weiter klappen.
      - name: ${{ matrix.datei }} AAB für Google Play
        if: matrix.ordner != 'lernapp'
        working-directory: apps/${{ matrix.ordner }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORT" ]; then
            echo "Keine Signier-Secrets – AAB wird übersprungen."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$PASSWORT" "$PASSWORT" > android/key.properties
          flutter build appbundle --release
          rm android/key.properties android/upload.jks
          cp build/app/outputs/bundle/release/app-release.aab ../../ausgabe/${{ matrix.datei }}-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.ordner }}
          path: ausgabe/*

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.plattform != 'handy'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Austro Angler für Windows bauen
        working-directory: apps/austro_angler
        run: |
          flutter pub get
          flutter build windows --release

      - name: Austro Angler prüfen
        working-directory: apps/austro_angler
        run: |
          flutter analyze
          flutter test

      - name: Setup-Dateien und ZIPs erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ausgabe | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $apps = @(
            @{ Ordner = 'austro_angler'; Name = 'Austro Angler'; Exe = 'AustroAngler'; Version = '1.0.0';
               Id = '93e17986-f912-479c-bb0f-e9f15600a317' }
            # Lernfuchs ist pausiert. Zum Wiederaufnehmen: Build-Schritt oben
            # ergänzen und diese Zeile einfügen:
            # @{ Ordner = 'lernapp'; Name = 'Lernfuchs'; Exe = 'Lernfuchs'; Version = '0.1.0';
            #    Id = 'dd53bab1-fa0c-40ea-a1da-3d66c0849b2a' }
          )
          foreach ($a in $apps) {
            $quelle = "apps\$($a.Ordner)\build\windows\x64\runner\Release"
            # Visual-C++-Laufzeit mitliefern, damit die App auf jedem PC startet.
            foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
              Copy-Item "C:\Windows\System32\$dll" $quelle -ErrorAction SilentlyContinue
            }
            Compress-Archive -Path "$quelle\*" -DestinationPath "ausgabe\$($a.Exe)-Windows.zip" -Force
            iscc "/DAppName=$($a.Name)" "/DAppExe=$($a.Exe).exe" "/DAppId=$($a.Id)" `
              "/DSourceDir=..\$quelle" "/DOutputName=$($a.Exe)-Setup" "/DAppVersion=$($a.Version)" `
              installer\setup.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem ausgabe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ausgabe/*

  release:
    needs: [android, windows]
    # Läuft, sobald mindestens eine Plattform gebaut und keine fehlgeschlagen ist.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ausgabe
          merge-multiple: true

      # Ein Release lässt sich viel leichter herunterladen als ein Artefakt
      # (keine ZIP-Hülle, kein Login nötig bei öffentlichem Repo).
      - name: Test-Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la ausgabe
          NOTIZ="Zuletzt aktualisiert aus ${GITHUB_SHA::7}.

          📱 Handy: AustroAngler.apk, Druckkasse.apk usw. antippen und installieren.
          💻 PC: AustroAngler-Setup.exe herunterladen und starten. Bei der Windows-Warnung auf \"Weitere Informationen\" → \"Trotzdem ausführen\" klicken. Ohne Installation: AustroAngler-Windows.zip entpacken und AustroAngler.exe starten."
          # Vorhandene Dateien der anderen Plattform bleiben erhalten, nur die
          # neu gebauten werden ersetzt.
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build ausgabe/* --clobber
            gh release edit test-build --notes "$NOTIZ" --title "Testversion (${GITHUB_REF_NAME})"
          else
            gh release create test-build ausgabe/* --prerelease --target "$GITHUB_SHA" \
              --title "Testversion (${GITHUB_REF_NAME})" --notes "$NOTIZ"
          fi
