name: Apps bauen

on:
  push:
    paths:
      - 'apps/**'
      - 'installer/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:
    inputs:
      android:
        description: 'Auch die Android-Version (APK) bauen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  # Android wird im Moment nur auf Wunsch gebaut (Actions → Run workflow →
  # Häkchen bei "android"). Standard ist nur die PC-Version.
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Austro Angler prüfen und bauen
        working-directory: apps/austro_angler
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

      - name: Lernfuchs prüfen und bauen
        working-directory: apps/lernapp
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

      - name: APKs einsammeln
        run: |
          mkdir -p ausgabe
          cp apps/austro_angler/build/app/outputs/flutter-apk/app-release.apk ausgabe/AustroAngler.apk
          cp apps/lernapp/build/app/outputs/flutter-apk/app-release.apk ausgabe/Lernfuchs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ausgabe/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Austro Angler für Windows bauen
        working-directory: apps/austro_angler
        run: |
          flutter pub get
          flutter build windows --release

      - name: Austro Angler prüfen
        working-directory: apps/austro_angler
        run: |
          flutter analyze
          flutter test

      - name: Setup-Dateien und ZIPs erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ausgabe | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $apps = @(
            @{ Ordner = 'austro_angler'; Name = 'Austro Angler'; Exe = 'AustroAngler'; Version = '0.3.0';
               Id = '93e17986-f912-479c-bb0f-e9f15600a317' }
            # Lernfuchs ist pausiert. Zum Wiederaufnehmen: Build-Schritt oben
            # ergänzen und diese Zeile einfügen:
            # @{ Ordner = 'lernapp'; Name = 'Lernfuchs'; Exe = 'Lernfuchs'; Version = '0.1.0';
            #    Id = 'dd53bab1-fa0c-40ea-a1da-3d66c0849b2a' }
          )
          foreach ($a in $apps) {
            $quelle = "apps\$($a.Ordner)\build\windows\x64\runner\Release"
            # Visual-C++-Laufzeit mitliefern, damit die App auf jedem PC startet.
            foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
              Copy-Item "C:\Windows\System32\$dll" $quelle -ErrorAction SilentlyContinue
            }
            Compress-Archive -Path "$quelle\*" -DestinationPath "ausgabe\$($a.Exe)-Windows.zip" -Force
            iscc "/DAppName=$($a.Name)" "/DAppExe=$($a.Exe).exe" "/DAppId=$($a.Id)" `
              "/DSourceDir=..\$quelle" "/DOutputName=$($a.Exe)-Setup" "/DAppVersion=$($a.Version)" `
              installer\setup.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem ausgabe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ausgabe/*

  release:
    needs: [android, windows]
    # Läuft auch, wenn Android übersprungen wurde.
    if: always() && needs.windows.result == 'success' && needs.android.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ausgabe
          merge-multiple: true

      # Ein Release lässt sich viel leichter herunterladen als ein Artefakt
      # (keine ZIP-Hülle, kein Login nötig bei öffentlichem Repo).
      - name: Test-Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la ausgabe
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build ausgabe/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Testversion (${GITHUB_REF_NAME})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}.

          💻 PC: AustroAngler-Setup.exe herunterladen und starten. Bei der Windows-Warnung auf \"Weitere Informationen\" → \"Trotzdem ausführen\" klicken. Ohne Installation: AustroAngler-Windows.zip entpacken und AustroAngler.exe starten."
