name: Bücher holen

# Holt Buchdaten (Titel, Autor, Jahr, Seiten, Cover) für Bücherwurm von der
# Deutschen Nationalbibliothek und Open Library und legt sie als
# apps/buecherwurm/lib/data/katalog_extra.dart ins Repo.
# Von Hand starten (Actions → Bücher holen → Run workflow) oder automatisch,
# wenn sich die Wunschliste oder das Skript ändert.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/buecher_holen.py'
      - 'tools/quellen/buecherwurm_liste.json'
      - '.github/workflows/buecher.yml'

permissions:
  contents: write

concurrency:
  group: buecher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bücher laden
        run: python tools/buecher_holen.py

      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/buecherwurm/lib/data/katalog_extra.dart apps/buecherwurm/lib/data/katalog_cover.dart tools/quellen/buecher_bericht.txt
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "Bücherwurm: Buchdaten aus der Nationalbibliothek aktualisiert [skip ci]"
          git pull --rebase
          git push
