name: Quiz-Recherche

# Holt Hintergrundtexte (Wikipedia, Fan-Wikis) zu Buchreihen nach
# tools/quellen/recherche/, damit Quizfragen mit Quellen geprüft werden können.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/recherche.py'
      - '.github/workflows/recherche.yml'

permissions:
  contents: write

concurrency:
  group: recherche-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Texte laden
        run: python tools/recherche.py fluesterwald meisterdiebe windwalkers
      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/quellen/recherche
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "Bücherwurm: Recherchetexte für Quizfragen [skip ci]"
          for i in 1 2 3; do git pull --no-rebase && git push && break; sleep 5; done
