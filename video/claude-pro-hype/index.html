<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Claude Pro – Hype Edit</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
//  „Claude Pro – Hype Edit“: schneller Zickzack-Schnitt, 150 BPM.
//  Alles hängt am Beat-Raster: 1 Schlag = 0,4 s, 1 Takt = 1,6 s.
// =====================================================================
const W = 1920, H = 1080, B = .4, BAR = 1.6;
const bt = (bar, beat = 0) => +(bar * BAR + beat * B).toFixed(4);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { bg: '#0E0C0B', ink: '#0B0908', coral: '#E0784F', coralLight: '#F4A27F', yellow: '#FFD23F', white: '#FFF8F0', dim: '#9C918A', green: '#6FE08A', blue: '#69C3FF', pink: '#FF5E8A' };
const DISPLAY = '"Inter Display", Inter, sans-serif', MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace', EMOJI = '"Noto Color Emoji"';

// ---------- Zeitplan
const S = { intro: 0, skills: bt(4), speed: bt(12), meme: bt(18), build: bt(22), reasons: bt(25), price: bt(37), outro: bt(41), end: bt(48) };
const END = S.end;
const MUSIC = [
  [0, bt(3, 3), 'intro'], [bt(3, 3), bt(4), 'silence'], [bt(4), bt(12), 'drop'], [bt(12), bt(18), 'groove'], [bt(18), bt(22), 'meme'],
  [bt(22), bt(24, 3), 'build'], [bt(24, 3), bt(25), 'silence'], [bt(25), bt(37), 'drop2'], [bt(37), bt(38), 'silence'], [bt(38), bt(41), 'groove'],
  [bt(41), bt(43), 'build'], [bt(43), bt(46), 'drop2'], [bt(46), END, 'end'],
].map(([t0, t1, mode]) => ({ t0, t1, mode }));
const VOICE = [
  [1, .4, 'Hallo!', 'nocap'], [2, 1.7, 'Ich bin Claude, ein KI-Assistent von Anthropic.'],
  [19, 24.2, 'Ein paar Sekunden später kannst du es schon ausprobieren.'],
  [37, 35.3, 'Und jetzt die große Frage: Warum solltest du dir Claude Pro holen?', 'nocap'],
  [38, 40.15, 'Erstens: Viel mehr Nutzung.', 'nocap'],
  [52, 59.25, 'Und das alles kostet 20 Dollar im Monat.'], [54, 62.2, 'Das sind ungefähr 67 Cent am Tag.', 'nocap'],
  [55, 65.45, 'Also, worauf wartest du?', 'nocap'], [56, 67.55, 'Probier es aus.', 'nocap'], [58, 69.0, 'Claude Pro.', 'nocap'], [59, 70.4, 'Mehr Claude, mehr Möglichkeiten.', 'nocap'],
].map(([n, t0, text, flag]) => ({ file: `../claude-pro-lang/sprecher/${String(n).padStart(2, '0')}.mp3`, t0, text, cap: flag !== 'nocap', dur: text.length / 15 }));

const SKILLS = [
  ['✍️', 'SCHREIBEN', 'E-Mails, Referate, Bewerbungen'], ['💻', 'CODEN', 'Apps, Websites, Games'], ['🔎', 'RECHERCHIEREN', 'mit Quellen zum Nachprüfen'],
  ['📄', 'PDFs CHECKEN', 'in Sekunden zusammengefasst'], ['🧠', 'ERKLÄREN', 'so einfach, wie du willst'], ['📊', 'ANALYSIEREN', 'Zahlen → Diagramme'],
  ['🌍', 'ÜBERSETZEN', 'in richtig viele Sprachen'], ['🎬', 'VIDEOS BAUEN', 'so wie dieses hier 👀'],
];
const REASONS = [
  ['MEHR NUTZUNG', 'ungefähr 5× so viel wie Free'], ['CLAUDE CODE', 'inklusive – programmier mit mir'], ['COWORK', 'ich erledige ganze Aufgaben'],
  ['MEHR MODELLE', 'das richtige für jeden Job'], ['RESEARCH', 'richtig gründlich recherchiert'], ['NEUES ZUERST', 'du bist immer früher dran'],
];
const CODE = ['const fische = [];', 'let punkte = 0;', 'function neuerFisch() {', '  fische.push({ x: -50, y: zufall(80, 520) });', '}', 'canvas.onclick = (e) => {', '  for (const f of fische)', '    if (treffer(e, f)) punkte++;', '};', 'setInterval(neuerFisch, 900);', 'starteSpiel();', '// fertig ✅'];

// ---------- Soundeffekte
const SFX = [];
const fx = (type, t, p = {}) => SFX.push({ type, t: +t.toFixed(4), ...p });
fx('static', 0, { dur: .4 }); fx('boom', .4); fx('boom', 1.6, { big: 1 }); fx('whoosh', 1.5);
['UND', 'ICH', 'KANN'].forEach((_, i) => fx('pop', bt(2, i), { f: 500 + i * 120 }));
fx('glitch', bt(2, 3)); [0, 1, 2].forEach(i => fx('beep', bt(3, i), { f: i < 2 ? 880 : 880 })); fx('riser', bt(2), { dur: 2 * BAR - B });
fx('hit', S.skills, { big: 1 });
SKILLS.forEach((_, i) => { if (i) fx('whoosh', bt(4 + i) - .12); fx('hit', bt(4 + i)); fx('pop', bt(4 + i, 2), { f: 700 + (i % 4) * 90 }); });
fx('zig', S.speed - .2); fx('hit', S.speed, { big: 1 }); fx('shutter', bt(12, 1));
CODE.forEach((_, i) => fx('type', bt(12, 2) + i * .2, { v: i }));
fx('chime', bt(15), { big: 1 }); fx('stamp', bt(15));
for (let k = 0; k < 8; k++) fx('coin', bt(15, 2) + k * .8, { v: k });
fx('zig', S.meme - .2); fx('scratch', S.meme); fx('sad', S.meme + .2); fx('hit', bt(19), { big: 1 }); fx('boom', bt(19, 1)); fx('pop', bt(20), { f: 600 }); fx('pop', bt(21), { f: 900 });
fx('zig', S.build - .2); fx('snareroll', bt(22, 2), { dur: bt(24, 3) - bt(22, 2) }); fx('riser', bt(23), { dur: bt(24, 3) - bt(23), big: 1 });
fx('hit', S.reasons, { big: 1 }); fx('boom', S.reasons + .05, { big: 1 });
REASONS.forEach((_, i) => { const r = S.reasons + i * 2 * BAR; if (i) { fx('whoosh', r - .15); fx('hit', r); } fx('stamp', r + B * 2); });
fx('sweep', S.reasons + B * 3, { dur: 1.2 });
fx('scratch', S.price); for (let k = 0; k < 4; k++) fx('clock', bt(37, k));
fx('hit', bt(38), { big: 1 }); fx('cash', bt(38) + .02); fx('pop', bt(39), { f: 800 }); fx('pop', bt(40), { f: 500 });
fx('zig', S.outro - .2); for (let k = 0; k < 7; k++) fx('pop', bt(41) + k * B, { f: 440 * Math.pow(2, k / 7) });
fx('hit', bt(43), { big: 1 }); fx('boom', bt(43) + .05, { big: 1 }); fx('chime', bt(44, 2)); fx('hit', bt(46), { big: 2 }); fx('chime', bt(46) + .1, { big: 1 });
window.SFX = SFX;

// ---------- Helfer
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const popIn = (t, t0, d = .35) => easeBack(prog(t, t0, d));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const modeAt = t => (MUSIC.find(m => t >= m.t0 && t < m.t1) || { mode: 'end' }).mode;
const isDrop = t => ['drop', 'drop2', 'meme'].includes(modeAt(t));

function sticker(str, x, y, size, o = {}) {
  const { rot = 0, fill = C.white, shadow = C.coral, align = 'center', skew = -.12, alpha = 1, scale = 1 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale); ctx.transform(1, 0, skew, 1, 0, 0);
  ctx.font = `900 ${size}px ${DISPLAY}`; ctx.letterSpacing = `${-size * .02}px`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const sw = Math.max(6, size * .15);
  ctx.lineWidth = sw; ctx.strokeStyle = shadow; ctx.fillStyle = shadow; ctx.strokeText(str, size * .07, size * .09); ctx.fillText(str, size * .07, size * .09);
  ctx.strokeStyle = C.ink; ctx.strokeText(str, 0, 0); ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function label(str, x, y, size, o = {}) {
  const { color = C.white, align = 'center', weight = 800, alpha = 1, font = DISPLAY, rot = 0, outline = true } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = '0px';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = size * .18; ctx.strokeStyle = C.ink; if (outline) ctx.strokeText(str, 0, 0); ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
// Farb-Emojis werden von Chrome über ~256 px nicht mehr gezeichnet -> einmal klein rendern, dann als Bild skalieren
const EMO = {};
function emojiImg(e) {
  if (!EMO[e]) { const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'); g.font = `128px ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 80, 88); EMO[e] = c; }
  return EMO[e];
}
function emoji(e, x, y, size, rot = 0, scale = 1) {
  if (scale <= 0) return;
  const s = size / 128 * 160;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(emojiImg(e), -s / 2, -s / 2, s, s); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); }
function panel(x, y, w, h, fill = '#1C1815', edge = C.ink) { ctx.save(); ctx.fillStyle = C.ink; rr(x + 12, y + 14, w, h, 26); ctx.fill(); rr(x, y, w, h, 26); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = edge; ctx.stroke(); ctx.restore(); }
function zigzagPath(x0, y0, x1, amp, period, phase = 0) {
  ctx.beginPath(); let up = true;
  for (let x = x0 - ((phase % period) + period) % period; x <= x1 + period; x += period / 2) { ctx.lineTo(x, y0 + (up ? -amp : amp)); up = !up; }
}
const RAYS = (() => { const r = rng(7); return Array.from({ length: 12 }, (_, i) => ({ a: i / 12 * Math.PI * 2 + (r() - .5) * .12, l: .78 + r() * .22 })); })();
function starburst(cx, cy, R, rot = 0, col = C.coral, outline = true) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.lineCap = 'round';
  for (const pass of outline ? [0, 1] : [1]) {
    ctx.strokeStyle = pass ? col : C.ink; ctx.lineWidth = R * .2 + (pass ? 0 : 14);
    RAYS.forEach(ray => { ctx.beginPath(); ctx.moveTo(Math.cos(ray.a) * R * .08, Math.sin(ray.a) * R * .08); ctx.lineTo(Math.cos(ray.a) * R * ray.l, Math.sin(ray.a) * R * ray.l); ctx.stroke(); });
  }
  ctx.restore();
}

// ---------- Kamera & Hintergrund
function beatPulse(t) { // 1 direkt auf dem Schlag, fällt schnell ab
  const k = (t % B + B) % B; return Math.exp(-k * 14);
}
function camera(t) {
  let zoom = 1, rot = 0, dx = 0, dy = 0;
  if (isDrop(t)) {
    const bar = Math.floor(t / BAR), down = (t % BAR) < B;
    zoom += beatPulse(t) * (down ? .07 : .035);
    const dir = bar % 2 ? 1 : -1, snap = easeOut(prog(t % BAR, 0, .25));
    rot = dir * .028 * snap + -dir * .028 * (1 - snap);
  }
  for (const s of SFX) if (s.type === 'hit' || s.type === 'boom') {
    const k = t - s.t; if (k < 0 || k > .5) continue;
    const a = Math.exp(-k * 10) * (s.big ? 28 : 12); dx += Math.sin(k * 95 + s.t) * a; dy += Math.cos(k * 77 + s.t) * a;
  }
  if (modeAt(t) === 'build') { const k = clamp((t % 4.8) / 4.8); dx += Math.sin(t * 70) * 6 * k; dy += Math.cos(t * 63) * 6 * k; zoom += .04 * k; }
  return { zoom, rot, dx, dy };
}
const ZIGS = Array.from({ length: 9 }, (_, i) => ({ y: 60 + i * 120, sp: (i % 2 ? 1 : -1) * (60 + i * 9), amp: 18 + (i % 3) * 8 }));
function background(t) {
  const m = modeAt(t);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100);
  g.addColorStop(0, m === 'meme' ? 'rgba(255,210,63,.10)' : 'rgba(224,120,79,.20)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.lineWidth = 5; ctx.lineJoin = 'miter';
  ZIGS.forEach((z, i) => { ctx.strokeStyle = i % 3 === 0 ? 'rgba(255,210,63,.07)' : 'rgba(224,120,79,.08)'; zigzagPath(-100, z.y, W + 100, z.amp, 120, t * z.sp * (isDrop(t) ? 2.2 : 1)); ctx.stroke(); });
  ctx.restore();
  if (isDrop(t)) { const down = (t % BAR) < B, a = beatPulse(t) * (down ? .22 : .08); ctx.fillStyle = `rgba(224,120,79,${a})`; ctx.fillRect(0, 0, W, H); }
}
function vignette() { const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
// Zickzack-Wischer zwischen Abschnitten
const WIPES = SFX.filter(s => s.type === 'zig').map(s => s.t + .2);
function wipes(t) {
  for (const T of WIPES) {
    const p = prog(t, T - .3, .6); if (p <= 0 || p >= 1) continue;
    [[C.yellow, 0], [C.coral, .12], [C.ink, .22]].forEach(([col, lag]) => {
      const q = easeInOut(clamp((p - lag) / (1 - .22))), x = lerp(-W * 1.3, W * 1.3, q);
      ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - W * .6, -50);
      for (let y = -50, k = 0; y <= H + 100; y += 90, k++) ctx.lineTo(x + (k % 2 ? 80 : -80), y);
      for (let y = H + 100, k = 0; y >= -50; y -= 90, k++) ctx.lineTo(x - W * .6 + (k % 2 ? 80 : -80), y);
      ctx.closePath(); ctx.fill(); ctx.restore();
    });
  }
}
function flashes(t) {
  let a = 0; for (const s of SFX) if (s.type === 'hit' && s.big) { const k = t - s.t; if (k >= 0 && k < .6) a += Math.exp(-k * 9) * .7; }
  if (a > .004) { ctx.fillStyle = `rgba(255,248,240,${Math.min(.8, a)})`; ctx.fillRect(0, 0, W, H); }
}
function glitch(t, amount) { // Streifen des Bildes seitlich versetzen
  if (amount <= 0) return; const r = rng(Math.floor(t * 30) * 7919 + 13);
  for (let i = 0; i < 9; i++) { const y = r() * H, h = 10 + r() * 70, off = (r() - .5) * 140 * amount; ctx.drawImage(cv, 0, y, W, h, off, y, W, h); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,40,80,${.12 * amount})`; ctx.fillRect(0, r() * H, W, 6 + r() * 30); ctx.fillStyle = `rgba(60,200,255,${.12 * amount})`; ctx.fillRect(0, r() * H, W, 6 + r() * 30); ctx.restore();
}
function noiseScreen(t, a) {
  const r = rng(Math.floor(t * 30) + 1); ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 260; i++) { const g = Math.floor(r() * 255); ctx.fillStyle = `rgb(${g},${g},${g})`; ctx.fillRect(r() * W, r() * H, 8 + r() * 120, 4 + r() * 8); }
  ctx.restore();
}

// =================== Abschnitte ===================
function secIntro(t) {
  if (t < .4) { noiseScreen(t, .55); return; }
  // HALLO!
  if (t < 1.6) { const s = popIn(t, .4, .3); emoji('👋', W / 2 - 430, 470, 200, Math.sin(t * 14) * .3, s); sticker('HALLO!', W / 2 + 90, 500, 260, { rot: -.05, scale: s, fill: C.yellow }); return; }
  if (t < bt(2)) {
    const s = popIn(t, 1.6, .3); starburst(520, 520, 230 * s, t * 1.5);
    sticker('ICH BIN', 1180, 380, 130, { rot: .06, scale: popIn(t, 1.62, .3), shadow: C.yellow });
    sticker('CLAUDE', 1180, 600, 230, { rot: -.05, scale: popIn(t, 2.0, .3), fill: C.coral, shadow: C.yellow });
    return;
  }
  if (t < bt(3)) {
    ['UND', 'ICH', 'KANN'].forEach((w, i) => sticker(w, 520 + i * 440, 470 + (i % 2 ? 90 : -40), 200, { rot: i % 2 ? .07 : -.07, scale: popIn(t, bt(2, i), .25), fill: i === 2 ? C.yellow : C.white }));
    sticker('…', 1650, 760, 160, { scale: popIn(t, bt(2, 3), .25) });
    return;
  }
  const k = Math.floor((t - bt(3)) / B);
  if (k < 3) { const s = 1.6 - .6 * easeOut(prog((t - bt(3)) % B, 0, .3)); sticker(String(3 - k), W / 2, 520, 520, { scale: s, fill: [C.white, C.yellow, C.coral][k], rot: (k % 2 ? .08 : -.08) }); }
}

function secSkills(t) {
  const lt = t - S.skills, i = clamp(Math.floor(lt / BAR), 0, SKILLS.length - 1);
  // Kamera wandert im Zickzack von Skill zu Skill
  const pos = k => [k * 1500, k % 2 ? 230 : -230];
  const from = pos(Math.max(0, i - 1)), to = pos(i), m = i === 0 ? 1 : easeInOut(prog(lt - i * BAR, -.12, .32));
  const cx = lerp(from[0], to[0], m), cy = lerp(from[1], to[1], m);
  ctx.save(); ctx.translate(W / 2 - cx, H / 2 - cy);
  // Verbindungslinie im Zickzack
  ctx.save(); ctx.lineWidth = 22; ctx.lineJoin = 'miter'; ctx.strokeStyle = C.ink; ctx.beginPath(); SKILLS.forEach((_, k) => { const [x, y] = pos(k); ctx.lineTo(x, y); }); ctx.stroke();
  ctx.lineWidth = 10; ctx.strokeStyle = C.yellow; ctx.setLineDash([40, 26]); ctx.lineDashOffset = -t * 300; ctx.stroke(); ctx.restore();
  SKILLS.forEach(([e, w, sub], k) => {
    const t0 = S.skills + k * BAR; if (t < t0 - .2) return;
    const [x, y] = pos(k), s = popIn(t, t0, .32), side = k % 2 ? 1 : -1;
    emoji(e, x, y - 150, 230, side * .12 + Math.sin(t * 6 + k) * .06, s);
    sticker(w, x, y + 70, w.length > 11 ? 130 : 160, { rot: side * -.04, scale: s, fill: k % 3 === 1 ? C.yellow : C.white });
    const s2 = popIn(t, t0 + B * 2, .3);
    if (s2 > 0) { ctx.save(); ctx.translate(x, y + 190); ctx.rotate(side * .03); ctx.scale(s2, s2); ctx.font = `800 46px ${DISPLAY}`; const tw = ctx.measureText(sub).width + 60; rr(-tw / 2, -38, tw, 76, 38); ctx.fillStyle = C.ink; ctx.fill(); ctx.restore(); label(sub, x, y + 190, 46, { color: C.coralLight, rot: side * .03, alpha: clamp(s2) }); }
  });
  ctx.restore();
  // Kopfzeile
  sticker('CLAUDE KANN:', 330, 110, 76, { rot: -.04, fill: C.coral, shadow: C.ink, scale: popIn(t, S.skills, .3) });
  label(`${i + 1}/${SKILLS.length}`, W - 150, 110, 54, { color: C.yellow });
}

const FISH = (() => { const r = rng(5); return Array.from({ length: 14 }, (_, k) => ({ spawn: bt(15) - 1.4 + k * .55, v: 160 + r() * 140, y: 90 + r() * 420, hue: k % 3 })); })();
function fish(x, y, hue) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = [C.coral, C.yellow, C.blue][hue]; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, 36, 20, 0, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-56, -18); ctx.lineTo(-56, 18); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(18, -5, 5, 0, 6.283); ctx.fill(); ctx.restore(); }
function secSpeed(t) {
  const lt = t - S.speed;
  sticker('SPEEDRUN', 560, 120, 120, { rot: -.05, fill: C.yellow, scale: popIn(t, S.speed, .3) }); emoji('🏁', 990, 110, 110, .2, popIn(t, S.speed + .1, .3));
  label('Aufgabe: ein Spiel bauen', 560, 215, 40, { color: C.dim, alpha: prog(lt, .3, .3) });
  // Timer
  const run = clamp(t - bt(12, 1), 0, bt(15) - bt(12, 1)), sec = Math.floor(run), cs = Math.floor((run % 1) * 100), done = t >= bt(15);
  panel(1330, 60, 470, 130, done ? '#173322' : '#1C1815', done ? C.green : C.ink);
  label(`00:0${sec}.${String(cs).padStart(2, '0')}`, 1565, 128, 76, { color: done ? C.green : C.white, font: MONO, weight: 800 });
  // Editor mit Code, der im Zickzack reinfliegt
  panel(110, 280, 860, 640, '#13110F');
  CODE.forEach((line, k) => {
    const t0 = bt(12, 2) + k * .2, p = easeOut(prog(t, t0, .18)); if (p <= 0) return;
    const y = 335 + k * 48, from = k % 2 ? 900 : -500;
    ctx.save(); ctx.globalAlpha = clamp(p * 2); ctx.font = `600 27px ${MONO}`; ctx.textBaseline = 'middle';
    ctx.fillStyle = line.startsWith('//') ? C.green : (/^(const|let|function|canvas|setInterval|starteSpiel)/.test(line.trim()) ? C.coralLight : C.white);
    ctx.fillText(line, lerp(from, 150, p), y); ctx.restore();
  });
  const pr = prog(t, bt(12, 2), bt(15) - bt(12, 2));
  rr(150, 880, 780, 22, 11); ctx.fillStyle = '#2B2622'; ctx.fill(); rr(150, 880, 780 * pr, 22, 11); ctx.fillStyle = done ? C.green : C.coral; ctx.fill();
  // Spiel
  panel(1030, 280, 780, 640, '#0E2734');
  ctx.save(); rr(1036, 286, 768, 628, 22); ctx.clip();
  if (!done) { label('lädt …', 1420, 600, 54, { color: C.dim, alpha: .6 + .4 * Math.sin(t * 8) }); }
  else {
    let score = 0;
    FISH.forEach((f, k) => { const age = t - f.spawn; if (age < 0) return; const x = 1000 + age * f.v, y = 300 + f.y + Math.sin(age * 4 + k) * 16;
      const caught = k < 8 && t >= bt(15, 2) + k * .8; if (caught) { score++; const kk = t - (bt(15, 2) + k * .8); if (kk < .5) { sticker('+1', 1040 + ((bt(15, 2) + k * .8 - f.spawn) * f.v), y - 50 - kk * 120, 60, { fill: C.yellow, alpha: 1 - kk * 2 }); } return; }
      if (x < 1860) fish(x, y, f.hue); });
    label(`PUNKTE: ${score}`, 1200, 340, 40, { color: C.yellow });
  }
  ctx.restore();
  if (done) sticker('FERTIG ✓', 1420, 600, 150, { rot: -.1, fill: C.green, shadow: C.ink, scale: popIn(t, bt(15), .3), alpha: 1 - prog(t, bt(15, 2), .3) });
}

function stick(x, y, s, mood, t) { // Strichmännchen
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = C.white; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 130); ctx.moveTo(0, 40); ctx.lineTo(mood ? -60 : -45, mood ? 0 : 90); ctx.moveTo(0, 40); ctx.lineTo(mood ? 60 : 45, mood ? 0 : 90);
  ctx.moveTo(0, 130); ctx.lineTo(-40, 220); ctx.moveTo(0, 130); ctx.lineTo(40, 220); ctx.stroke(); ctx.restore();
  emoji(mood ? '😎' : '😩', x, y - 55 * s, 120 * s, mood ? Math.sin(t * 6) * .1 : 0);
}
function secMeme(t) {
  const lt = t - S.meme, seam = W / 2, show2 = t >= bt(19);
  // Linke Seite (grau)
  ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(seam, 0); for (let y = 0, k = 0; y <= H; y += 90, k++) ctx.lineTo(seam + (k % 2 ? 40 : -40), y); ctx.lineTo(0, H); ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#1A1A1A'; ctx.fillRect(0, 0, W, H);
  const p1 = popIn(t, S.meme, .35);
  sticker('OHNE CLAUDE', 480, 140, 100, { rot: -.04, fill: '#BDBDBD', shadow: '#444', scale: p1 });
  const stack = Math.min(14, Math.floor(lt * 5));
  for (let k = 0; k < stack; k++) { ctx.fillStyle = k % 2 ? '#E8E2DA' : '#D4CDC4'; ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.save(); ctx.translate(250, 840 - k * 26); ctx.rotate((k % 3 - 1) * .05); ctx.fillRect(-110, -12, 220, 24); ctx.strokeRect(-110, -12, 220, 24); ctx.restore(); }
  stick(520, 560, 1.15 * p1, false, t);
  label(Math.floor(t * 2) % 2 ? '03:47' : '03 47', 760, 330, 70, { color: '#FF6B6B', font: MONO, alpha: clamp(p1) });
  label('Hausaufgabe seit 4 Std. …', 480, 960, 44, { color: '#BDBDBD', alpha: clamp(p1) });
  ctx.restore();
  // Rechte Seite (bunt)
  if (show2) {
    const p2 = popIn(t, bt(19), .35);
    ctx.save(); ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(seam, 0); for (let y = 0, k = 0; y <= H; y += 90, k++) ctx.lineTo(seam + (k % 2 ? 40 : -40), y); ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
    const g = ctx.createLinearGradient(seam, 0, W, H); g.addColorStop(0, '#3A1F14'); g.addColorStop(1, '#5A3A10'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    sticker('MIT CLAUDE', 1440, 140, 100, { rot: .04, fill: C.yellow, scale: p2 });
    stick(1440, 560, 1.15 * p2, true, t);
    const r = rng(9); for (let k = 0; k < 12; k++) { const x = 1050 + r() * 800, sp = 200 + r() * 200, y = ((t - bt(19)) * sp + r() * H) % (H + 100) - 50; emoji('✅', x, y, 54, 0, clamp(p2)); }
    label('fertig in 5 Minuten', 1440, 960, 48, { color: C.yellow, alpha: clamp(p2) });
    ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = C.yellow; ctx.lineWidth = 12; ctx.lineJoin = 'miter'; ctx.beginPath(); for (let y = 0, k = 0; y <= H; y += 90, k++) ctx.lineTo(seam + (k % 2 ? 40 : -40), y); ctx.stroke(); ctx.restore();
  if (show2) { const v = popIn(t, bt(19), .3); ctx.save(); ctx.translate(seam, 520); ctx.scale(v, v); ctx.fillStyle = C.coral; ctx.strokeStyle = C.ink; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 0, 110, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.restore(); sticker('VS', seam, 520, 120, { scale: v, shadow: C.ink }); }
  sticker('SEI NICHT LINKS.', 480, 700, 74, { rot: -.12, fill: C.white, shadow: '#555', scale: popIn(t, bt(20), .3) });
  sticker('SEI RECHTS. 😎', 1440, 760, 74, { rot: .1, fill: C.yellow, scale: popIn(t, bt(21), .3) });
}

function secBuild(t) {
  const lt = t - S.build, k = clamp(lt / (bt(24, 3) - S.build));
  if (t >= bt(24, 3)) { label('…', W / 2, 520, 120, { color: C.dim }); return; }
  ctx.save(); ctx.translate(W / 2, 520);
  for (let i = 0; i < 6; i++) { const r = ((1 - ((lt * (.5 + k)) + i / 6) % 1)) * 900; ctx.save(); ctx.rotate(i * .5 + lt); ctx.strokeStyle = `rgba(224,120,79,${.5 * (1 - r / 900)})`; ctx.lineWidth = 8; ctx.beginPath();
    for (let a = 0; a <= 6.3; a += .2) { const rr2 = r + (Math.round(a / .2) % 2 ? 26 : -26); ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } ctx.closePath(); ctx.stroke(); ctx.restore(); }
  ctx.restore();
  starburst(W / 2, 520, 90 + 140 * k, lt * (2 + 10 * k));
  sticker('UND JETZT…', W / 2, 190, 90, { rot: -.04, scale: popIn(t, S.build + .1, .3), alpha: 1 - prog(t, bt(23, 2), .2) });
  sticker('DIE GROSSE FRAGE:', W / 2, 190, 100, { rot: .03, fill: C.yellow, scale: popIn(t, bt(23, 2), .3) });
  if (t >= bt(24)) sticker('WARUM CLAUDE PRO?', W / 2, 860, 120 + 22 * prog(t, bt(24), 1.2), { rot: Math.sin(t * 40) * .02, fill: C.coral, shadow: C.yellow, scale: popIn(t, bt(24), .3) });
}

function secReasons(t) {
  const lt = t - S.reasons, i = clamp(Math.floor(lt / (2 * BAR)), 0, 5), rt = lt - i * 2 * BAR, side = i % 2 ? -1 : 1;
  const enter = easeOut(prog(rt, 0, .28)), off = (1 - enter) * W * side;
  ctx.save(); ctx.translate(off, 0);
  // Bewegungsstreifen beim Reinfliegen
  if (enter < 1) { ctx.save(); ctx.globalAlpha = 1 - enter; ctx.fillStyle = C.coralLight; for (let k = 0; k < 14; k++) ctx.fillRect(side > 0 ? 0 : 0, 80 + k * 70, W, 4); ctx.restore(); }
  const [title, sub] = REASONS[i], tx = side > 0 ? 560 : 1360, vx = side > 0 ? 1380 : 540;
  sticker(`GRUND #${i + 1}`, tx, 250, 70, { rot: -side * .05, fill: C.yellow, shadow: C.ink, scale: popIn(rt, .05, .3) });
  sticker(title, tx, 430, title.length > 10 ? 120 : 150, { rot: side * .04, fill: C.white, scale: popIn(rt, .12, .3) });
  const sp = popIn(rt, B * 2, .3);
  if (sp > 0) { ctx.save(); ctx.translate(tx, 590); ctx.rotate(-side * .03); ctx.scale(sp, sp); ctx.font = `800 46px ${DISPLAY}`; const tw = ctx.measureText(sub).width + 70; rr(-tw / 2, -42, tw, 84, 42); ctx.fillStyle = C.ink; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.coral; ctx.stroke(); ctx.restore(); label(sub, tx, 590, 46, { color: C.coralLight, rot: -side * .03, alpha: clamp(sp), outline: false }); }
  // Visual je Grund
  const vp = popIn(rt, .2, .4);
  ctx.save(); ctx.translate(vx, 520); ctx.scale(vp, vp); ctx.rotate(side * -.05);
  if (i === 0) {
    panel(-330, -300, 660, 600);
    const f = easeOut(prog(rt, .4, .4)), p = easeOut(prog(rt, .6, 1.0));
    label('FREE', -150, 230, 44, { color: C.dim }); label('PRO', 150, 230, 44, { color: C.yellow });
    rr(-210, 190 - 90 * f, 120, 90 * f, 14); ctx.fillStyle = '#6E665E'; ctx.fill();
    rr(90, 190 - 450 * p, 120, 450 * p, 14); ctx.fillStyle = C.coral; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.stroke();
    if (p > .9) sticker('≈ 5×', 20, -150, 150, { rot: .1, fill: C.yellow, scale: popIn(rt, 1.5, .3) });
  } else if (i === 1) {
    panel(-380, -260, 760, 520, '#0B0A09');
    const lines = ['$ claude', '✳ Claude Code', '> mach mir eine App', '● plane …', '● schreibe Code …', '✓ fertig!'];
    lines.forEach((l, k) => { const p = prog(rt, .3 + k * .28, .1); if (p <= 0) return; ctx.font = `700 34px ${MONO}`; ctx.textBaseline = 'middle'; ctx.fillStyle = k === 5 ? C.green : k === 1 ? C.coral : C.white; ctx.fillText(l.slice(0, Math.ceil(l.length * p)), -330, -190 + k * 70); });
  } else if (i === 2) {
    emoji('📁', 0, 0, 300, 0, 1);
    for (let k = 0; k < 6; k++) { const p = easeOut(prog(rt, .3 + k * .25, .4)); if (p <= 0) continue; const a = k * 1.05; emoji(['📄', '📊', '🖼️', '📄', '📝', '📊'][k], lerp(Math.cos(a) * 420, 0, p), lerp(Math.sin(a) * 300, 0, p), 90, 0, 1 - p * .6); }
    if (rt > 2.2) sticker('ERLEDIGT ✓', 0, 230, 90, { fill: C.green, shadow: C.ink, scale: popIn(rt, 2.2, .3), rot: -.08 });
  } else if (i === 3) {
    ['⚡', '🧠', '🚀'].forEach((e, k) => { const a = (k - 1) * .35 * easeOut(prog(rt, .4, .5)); ctx.save(); ctx.rotate(a); ctx.translate(0, -40); panel(-150, -230, 300, 400, ['#2A1F14', '#20202E', '#2E1A22'][k], C.ink); emoji(e, 0, -60, 150); label(['schnell', 'schlau', 'stark'][k], 0, 90, 44, { color: C.yellow }); ctx.restore(); });
  } else if (i === 4) {
    emoji('🔎', -40, -20, 260, Math.sin(rt * 5) * .15);
    ['Quelle 1', 'Quelle 2', 'Quelle 3'].forEach((q, k) => { const p = popIn(rt, .5 + k * .3, .3); ctx.save(); ctx.translate([-260, 230, 0][k], [-220, -160, 230][k]); ctx.rotate([-.1, .12, -.05][k]); ctx.scale(p, p); panel(-130, -40, 260, 80, C.blue); label(q, 0, 0, 38, { color: C.ink, outline: false }); ctx.restore(); });
  } else {
    const p = easeInOut(prog(rt, .2, 2.6)), zx = lerp(-380, 380, p), zy = (Math.floor(p * 6) % 2 ? -1 : 1) * ((p * 6) % 1 - .5) * 260;
    ctx.save(); ctx.strokeStyle = C.yellow; ctx.lineWidth = 10; ctx.setLineDash([24, 18]); ctx.beginPath(); for (let q = 0; q <= p; q += .01) { const x = lerp(-380, 380, q), y = (Math.floor(q * 6) % 2 ? -1 : 1) * ((q * 6) % 1 - .5) * 260; ctx.lineTo(x, y); } ctx.stroke(); ctx.restore();
    emoji('🚀', zx, zy, 200, .6);
  }
  ctx.restore();
  ctx.restore();
}

const COINS = (() => { const r = rng(11); return Array.from({ length: 40 }, () => ({ x: r() * W, v: 500 + r() * 600, d: r() * .6, s: .7 + r() * .6 })); })();
function secPrice(t) {
  if (t < bt(38)) {
    const k = Math.floor((t - S.price) / B);
    sticker('UND DAS KOSTET…', W / 2, 400, 130, { rot: -.03, scale: popIn(t, S.price, .3) });
    emoji('🥁', W / 2, 660, 200, Math.sin(t * 30) * .15, 1);
    label('·'.repeat(k + 1), W / 2, 820, 120, { color: C.yellow });
    return;
  }
  COINS.forEach(c => { const k = t - bt(38) - c.d; if (k < 0) return; const y = -60 + k * c.v; if (y < H + 60) emoji('🪙', c.x, y, 70 * c.s, k * 6); });
  sticker('20 $', W / 2 - 120, 420, 340, { rot: -.06, fill: C.yellow, scale: popIn(t, bt(38), .3) });
  sticker('/ MONAT', W / 2 + 460, 520, 90, { rot: .08, scale: popIn(t, bt(38, 1), .3) });
  sticker('≈ 67 CENT AM TAG', W / 2 - 60, 760, 110, { rot: .04, fill: C.coral, shadow: C.yellow, scale: popIn(t, bt(39), .3) });
  emoji('🤯', W / 2 + 640, 740, 150, .2, popIn(t, bt(39, 1), .3));
  label('(17 $ pro Monat im Jahresabo, zzgl. Steuern)', W / 2, 930, 42, { color: C.white, alpha: prog(t, bt(40), .3) });
}

function secOutro(t) {
  if (t < bt(43)) {
    const words = ['WORAUF', 'WARTEST', 'DU?'];
    words.forEach((w, k) => sticker(w, 480 + k * 520, 420 + (k % 2 ? 110 : -30) + Math.sin(t * 10 + k) * 10, 170, { rot: (k % 2 ? .07 : -.07), fill: k === 2 ? C.yellow : C.white, scale: popIn(t, bt(41) + k * B, .3) }));
    sticker('PROBIER’S AUS!', W / 2, 820, 140, { rot: -.03, fill: C.coral, shadow: C.yellow, scale: popIn(t, bt(42, 1), .3) });
    return;
  }
  const lt = t - bt(43), freeze = t >= bt(46);
  starburst(W / 2, 330, 190 * popIn(t, bt(43), .35) * (1 + beatPulse(t) * (freeze ? 0 : .12)), freeze ? bt(46) * .8 : t * .8);
  sticker('CLAUDE PRO', W / 2, 640, 230, { rot: -.03, fill: C.white, shadow: C.coral, scale: popIn(t, bt(43, 1), .3) });
  sticker('MEHR CLAUDE. MEHR MÖGLICHKEITEN.', W / 2, 800, 64, { rot: .02, fill: C.yellow, shadow: C.ink, scale: popIn(t, bt(44), .3) });
  const bp = popIn(t, bt(44, 2), .3) * (1 + beatPulse(t) * .06 * (freeze ? 0 : 1));
  if (bp > 0) { ctx.save(); ctx.translate(W / 2, 935); ctx.scale(bp, bp); panel(-220, -52, 440, 104, C.coral); label('claude.ai', 0, 0, 60, { color: C.ink, weight: 900, outline: false }); ctx.restore(); }
  if (freeze) label('100 % aus Code gemacht – von Claude', W / 2, 1040, 30, { color: C.dim, alpha: prog(t, bt(46, 1), .4) });
}

// ---------- Untertitel (Wort für Wort)
function captions(t) {
  const v = VOICE.find(v => v.cap && t >= v.t0 && t < v.t0 + v.dur + .15); if (!v) return;
  const words = v.text.split(' '), lens = words.map(w => w.length + 1), tot = lens.reduce((a, b) => a + b, 0);
  let acc = 0, cur = 0; for (let k = 0; k < words.length; k++) { if ((t - v.t0) / v.dur >= acc / tot) cur = k; acc += lens[k]; }
  const start = Math.floor(cur / 3) * 3, chunk = words.slice(start, start + 3);
  ctx.save(); ctx.font = `900 64px ${DISPLAY}`; ctx.letterSpacing = '0px';
  const ws = chunk.map(w => ctx.measureText(w).width), total = ws.reduce((a, b) => a + b, 0) + (chunk.length - 1) * 24; ctx.restore();
  let x = W / 2 - total / 2;
  chunk.forEach((w, k) => { const on = start + k === cur, s = on ? 1 + .12 * (1 - prog(t, v.t0 + v.dur * (words.slice(0, start + k).join(' ').length / v.text.length), .15)) : 1;
    ctx.save(); ctx.translate(x + ws[k] / 2, 1000); ctx.scale(s, s); ctx.font = `900 64px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = C.ink; ctx.strokeText(w, 0, 0); ctx.fillStyle = on ? C.yellow : C.white; ctx.fillText(w, 0, 0); ctx.restore();
    x += ws[k] + 24; });
}
function progressZig(t) {
  const p = clamp(t / END); ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.beginPath();
  for (let x = 0, k = 0; x <= W; x += 24, k++) ctx.lineTo(x, H - 10 + (k % 2 ? -5 : 5)); ctx.stroke();
  ctx.strokeStyle = C.yellow; ctx.beginPath(); for (let x = 0, k = 0; x <= W * p; x += 24, k++) ctx.lineTo(x, H - 10 + (k % 2 ? -5 : 5)); ctx.stroke(); ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  background(t);
  const cam = camera(t);
  ctx.save(); ctx.translate(W / 2 + cam.dx, H / 2 + cam.dy); ctx.scale(cam.zoom, cam.zoom); ctx.rotate(cam.rot); ctx.translate(-W / 2, -H / 2);
  if (t < S.skills) secIntro(t);
  else if (t < S.speed) secSkills(t);
  else if (t < S.meme) secSpeed(t);
  else if (t < S.build) secMeme(t);
  else if (t < S.reasons) secBuild(t);
  else if (t < S.price) secReasons(t);
  else if (t < S.outro) secPrice(t);
  else secOutro(t);
  ctx.restore();
  // Glitch an markanten Stellen
  let gl = 0; for (const s of SFX) if (s.type === 'glitch' || s.type === 'scratch' || (s.type === 'hit' && s.big)) { const k = t - s.t; if (k >= 0 && k < .25) gl = Math.max(gl, 1 - k / .25); }
  if (t < .4) gl = .8;
  glitch(t, gl);
  flashes(t); wipes(t); vignette(); captions(t); progressZig(t);
  const k = Math.max(1 - prog(t, 0, .15), prog(t, END - 1.2, 1.2)); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); }
}
window.draw = draw;
window.timeline = () => ({ end: END, sfx: SFX, music: MUSIC, voice: VOICE.map(v => ({ file: v.file, t0: v.t0 })) });
window.setVoiceDurs = d => VOICE.forEach((v, i) => { if (d[i]) v.dur = d[i]; });
window.ready = Promise.all([document.fonts.load(`900 100px "Inter Display"`), document.fonts.load(`800 40px "Inter Display"`), document.fonts.load(`700 30px "JetBrains Mono"`), document.fonts.load(`100px "Noto Color Emoji"`, '👋✅🚀')]).then(() => document.fonts.ready);
if (!location.search.includes('render')) { const s0 = performance.now(); window.ready.then(function loop() { draw(((performance.now() - s0) / 1000) % END); requestAnimationFrame(loop); }); }
</script>
