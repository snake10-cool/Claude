<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Claude Pro – Lange Version</title>
<style>
  html, body { margin: 0; background: #0d0c0b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
//  „Claude Pro“ – lange Version (~6 Minuten) mit Sprecherstimme.
//  Szenen-Dauern richten sich nach der Länge der gesprochenen Sätze:
//    1. voiceTexts()  -> alle Sätze (render.mjs lässt sie von tts.py sprechen)
//    2. build(durs)   -> Zeitplan, Untertitel, Soundeffekte, Musik-Abschnitte
//    3. draw(t)       -> Bild zum Zeitpunkt t
// =====================================================================
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = {
  bg: '#12100e', coral: '#D97757', coralLight: '#F0A585', amber: '#E8C07D',
  text: '#F4EFE9', dim: '#A79E95', faint: '#6E665E', card: '#1E1B18', cardEdge: '#3A332D',
  green: '#7BC47F', red: '#E0705F', blue: '#7FB2E5', purple: '#B9A2E0', code: '#0B0A09',
};
const SANS = 'Inter, "Inter Display", system-ui, sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

// ------------------------------------------------------------- Helfer
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function text(str, x, y, { size = 40, weight = 600, color = C.text, align = 'left', alpha = 1, font = SANS, spacing = 0 } = {}) {
  if (alpha <= 0 || !str) return;
  ctx.save(); ctx.globalAlpha *= Math.min(1, alpha);
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = spacing + 'px';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y); ctx.restore();
}
function measure(str, size, weight = 600, font = SANS, spacing = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); }
function wrap(str, maxW, size, weight = 500, font = SANS) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = '0px';
  const out = [];
  for (const para of str.split('\n')) {
    const words = para.split(' '); let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    out.push(cur);
  }
  ctx.restore(); return out;
}
// Mehrzeiliger Text, der Zeichen für Zeichen erscheint
function typeBlock(str, n, x, y, maxW, size, lh, opts = {}) {
  const lines = wrap(str, maxW, size, opts.weight || 500);
  let left = n, yy = y, lastX = x, lastY = y;
  for (const l of lines) {
    if (left <= 0) break;
    const part = l.slice(0, left); left -= l.length + 1;
    text(part, x, yy, { size, weight: 500, ...opts });
    lastX = x + measure(part, size, opts.weight || 500); lastY = yy; yy += lh;
  }
  return [lastX, lastY, lines.length];
}
function card(x, y, w, h, r = 24, fill = C.card, edge = C.cardEdge) {
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = edge; ctx.stroke();
}
function windowFrame(x, y, w, h, title, { shadow = true } = {}) {
  ctx.save();
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; }
  rr(x, y, w, h, 22); ctx.fillStyle = '#191715'; ctx.fill(); ctx.restore();
  ctx.save(); rr(x, y, w, h, 22); ctx.clip(); ctx.fillStyle = '#221F1C'; ctx.fillRect(x, y, w, 54); ctx.restore();
  rr(x, y, w, h, 22); ctx.lineWidth = 2; ctx.strokeStyle = C.cardEdge; ctx.stroke();
  ['#E06C5D', '#E8B04F', '#6CC070'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 30 + i * 24, y + 27, 7, 0, 6.283); ctx.fill(); });
  text(title, x + w / 2, y + 35, { size: 22, weight: 600, color: C.dim, align: 'center' });
}
function pop(lt, t0, d = .5) { return easeBack(prog(lt, t0, d)); }
function fadeUp(lt, t0, d = .5) { return easeOut(prog(lt, t0, d)); }
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function scaled(cx, cy, s, fn) { if (s <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }

// ------------------------------------------------------------- Logo
const RAYS = (() => { const r = rng(7); return Array.from({ length: 12 }, (_, i) => ({ a: i / 12 * Math.PI * 2 + (r() - .5) * .12, l: .78 + r() * .22 })); })();
function starburst(cx, cy, R, grow = 1, rot = 0, glow = 1) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  if (glow > 0) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.2);
    g.addColorStop(0, `rgba(217,119,87,${.35 * glow})`); g.addColorStop(1, 'rgba(217,119,87,0)');
    ctx.fillStyle = g; ctx.fillRect(-R * 2.2, -R * 2.2, R * 4.4, R * 4.4);
  }
  ctx.strokeStyle = C.coral; ctx.lineCap = 'round'; ctx.lineWidth = R * .2;
  RAYS.forEach((ray, i) => {
    const g = easeOut(clamp(grow * 1.6 - i * .05)); if (g <= 0) return;
    const L = R * ray.l * g;
    ctx.beginPath(); ctx.moveTo(Math.cos(ray.a) * R * .08, Math.sin(ray.a) * R * .08); ctx.lineTo(Math.cos(ray.a) * L, Math.sin(ray.a) * L); ctx.stroke();
  });
  ctx.restore();
}
function ring(cx, cy, lt, t0, maxR, col = '217,119,87', d = .9) {
  const p = prog(lt, t0, d); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = `rgba(${col},${(1 - p) * .8})`; ctx.lineWidth = 6 * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(cx, cy, maxR * easeOut(p), 0, 6.283); ctx.stroke(); ctx.restore();
}

// ------------------------------------------------------------- Icons
function icon(kind, x, y, s, color = C.coral) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 48, s / 48);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (kind) {
    case 'pen': ctx.moveTo(10, 38); ctx.lineTo(13, 28); ctx.lineTo(32, 9); ctx.lineTo(39, 16); ctx.lineTo(20, 35); ctx.closePath(); ctx.moveTo(28, 13); ctx.lineTo(35, 20); ctx.stroke(); break;
    case 'code': ctx.moveTo(16, 14); ctx.lineTo(6, 24); ctx.lineTo(16, 34); ctx.moveTo(32, 14); ctx.lineTo(42, 24); ctx.lineTo(32, 34); ctx.moveTo(27, 10); ctx.lineTo(21, 38); ctx.stroke(); break;
    case 'search': ctx.arc(21, 21, 12, 0, 6.283); ctx.moveTo(30, 30); ctx.lineTo(41, 41); ctx.stroke(); break;
    case 'doc': ctx.moveTo(12, 6); ctx.lineTo(28, 6); ctx.lineTo(37, 15); ctx.lineTo(37, 42); ctx.lineTo(12, 42); ctx.closePath(); ctx.moveTo(28, 6); ctx.lineTo(28, 15); ctx.lineTo(37, 15); ctx.moveTo(18, 24); ctx.lineTo(31, 24); ctx.moveTo(18, 31); ctx.lineTo(31, 31); ctx.stroke(); break;
    case 'bulb': ctx.arc(24, 19, 12, Math.PI * .8, Math.PI * 2.2); ctx.lineTo(29, 34); ctx.lineTo(19, 34); ctx.closePath(); ctx.moveTo(19, 40); ctx.lineTo(29, 40); ctx.stroke(); break;
    case 'chart': ctx.moveTo(6, 42); ctx.lineTo(42, 42); ctx.stroke(); for (const [bx, bh] of [[10, 12], [21, 22], [32, 30]]) { rr(bx, 40 - bh, 7, bh, 2); ctx.fill(); } break;
    case 'check': ctx.moveTo(13, 25); ctx.lineTo(21, 33); ctx.lineTo(36, 16); ctx.stroke(); break;
    case 'cross': ctx.moveTo(16, 16); ctx.lineTo(32, 32); ctx.moveTo(32, 16); ctx.lineTo(16, 32); ctx.stroke(); break;
    case 'image': rr(6, 10, 36, 28, 4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8, 34); ctx.lineTo(19, 22); ctx.lineTo(27, 30); ctx.lineTo(32, 25); ctx.lineTo(40, 33); ctx.stroke(); ctx.beginPath(); ctx.arc(32, 17, 3, 0, 6.283); ctx.fill(); break;
    case 'folder': ctx.moveTo(6, 14); ctx.lineTo(18, 14); ctx.lineTo(22, 19); ctx.lineTo(42, 19); ctx.lineTo(42, 38); ctx.lineTo(6, 38); ctx.closePath(); ctx.stroke(); break;
    case 'layers': ctx.moveTo(24, 8); ctx.lineTo(42, 17); ctx.lineTo(24, 26); ctx.lineTo(6, 17); ctx.closePath(); ctx.moveTo(6, 25); ctx.lineTo(24, 34); ctx.lineTo(42, 25); ctx.moveTo(6, 33); ctx.lineTo(24, 42); ctx.lineTo(42, 33); ctx.stroke(); break;
    case 'hand': ctx.arc(24, 24, 15, 0, 6.283); ctx.moveTo(18, 22); ctx.lineTo(18, 22.1); ctx.moveTo(30, 22); ctx.lineTo(30, 22.1); ctx.moveTo(17, 29); ctx.quadraticCurveTo(24, 35, 31, 29); ctx.stroke(); break;
    case 'globe': ctx.arc(24, 24, 16, 0, 6.283); ctx.moveTo(8, 24); ctx.lineTo(40, 24); ctx.moveTo(24, 8); ctx.bezierCurveTo(14, 16, 14, 32, 24, 40); ctx.moveTo(24, 8); ctx.bezierCurveTo(34, 16, 34, 32, 24, 40); ctx.stroke(); break;
    case 'star': for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 8 : 18; ctx.lineTo(24 + Math.cos(a) * r, 25 + Math.sin(a) * r); } ctx.closePath(); ctx.stroke(); break;
    case 'bolt': ctx.moveTo(27, 5); ctx.lineTo(12, 27); ctx.lineTo(23, 27); ctx.lineTo(20, 43); ctx.lineTo(36, 20); ctx.lineTo(25, 20); ctx.closePath(); ctx.stroke(); break;
  }
  ctx.restore();
}

// ------------------------------------------------------------- Code-Färbung
function codeTokens(line) {
  const KW = /^(class|extends|final|return|for|in|of|const|let|function|if|this|new|true|false)$/;
  const out = [];
  for (const m of line.matchAll(/(\s+|@?[A-Za-z_äöüÄÖÜß]+|\d+|.)/g)) {
    const s = m[0]; let c = '#CFC7BE';
    if (KW.test(s)) c = C.coral; else if (/^\d+$/.test(s)) c = '#9CD3A8';
    else if (/^[A-Z]/.test(s)) c = C.amber; else if (/^[{}()\[\];<>,.=+]$/.test(s)) c = '#8C847C';
    out.push([s, c]);
  }
  return out;
}
function codeLine(str, x, y, size = 22) {
  ctx.save(); ctx.font = `400 ${size}px ${MONO}`; ctx.letterSpacing = '0px'; ctx.textAlign = 'left';
  let xx = x;
  for (const [s, c] of codeTokens(str)) { ctx.fillStyle = c; ctx.fillText(s, xx, y); xx += ctx.measureText(s).width; }
  ctx.restore(); return xx;
}

// ------------------------------------------------------------- Hintergrund
const PARTS = (() => { const r = rng(42); return Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H, s: .6 + r() * 2.2, v: 8 + r() * 30, p: r() * 6.28, a: .15 + r() * .45 })); })();
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  for (const [bx, by, br, col, sp] of [[.25, .35, 900, 'rgba(217,119,87,0.15)', .11], [.78, .7, 1000, 'rgba(232,192,125,0.08)', .07], [.6, .15, 700, 'rgba(185,120,90,0.10)', .13]]) {
    const x = W * bx + Math.sin(t * sp * 2 + bx * 9) * 160, y = H * by + Math.cos(t * sp * 1.6 + by * 7) * 110;
    const g = ctx.createRadialGradient(x, y, 0, x, y, br); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.save(); ctx.globalAlpha = .04; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  const off = (t * 12) % 80; ctx.beginPath();
  for (let x = -off; x < W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -off; y < H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
  for (const p of PARTS) {
    const y = ((p.y - t * p.v) % H + H) % H, x = p.x + Math.sin(t * .5 + p.p) * 20;
    ctx.globalAlpha = p.a * (.6 + .4 * Math.sin(t * 2 + p.p)); ctx.fillStyle = p.s > 2 ? C.coralLight : '#fff';
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// =====================================================================
//  Szenen
// =====================================================================
const CHAPTERS = ['Wer bin ich?', 'Schreiben', 'Programmieren', 'Dateien & Recherche', 'Lernen', 'Daten', 'Warum Claude Pro?'];
const SCENES = [];
const scene = o => SCENES.push(o);
// Startzeit des i-ten Satzes / Sprech-Abschnitts innerhalb der Szene (Fallback, falls noch nicht berechnet)
const clipAt = (s, i, fb) => (s.clips && s.clips[i]) ? s.clips[i].lt0 : fb;
const entryAt = (s, i, fb) => (s.entries && s.entries[i] != null) ? s.entries[i] : fb;

// ---------- Intro
const HELLO = 'Hallo, ich bin Claude.';
scene({
  id: 'intro', music: 'intro', min: 12,
  voice: [[3.7, 'Hallo! Ich bin Claude, ein KI-Assistent von Anthropic. In den nächsten Minuten zeige ich dir, was ich alles kann. Und am Ende erfährst du, warum sich Claude Pro für dich lohnt.']],
  sfx: () => [['riser', 0, { dur: 1.4 }], ['impact', 1.4, { big: 0 }], ...[...HELLO].map((c, i) => c !== ' ' && ['type', 1.6 + i / 14, { v: i }]).filter(Boolean), ['pop', 3.3, { f: 660 }]],
  draw(lt, D) {
    const g = prog(lt, .15, 1.25), pulse = lt > 1.4 ? 1 + Math.exp(-(lt - 1.4) * 6) * .18 : 1;
    starburst(W / 2, 360, 140 * pulse, g, lt * .25, g); ring(W / 2, 360, lt, 1.4, 520);
    const n = Math.floor(clamp((lt - 1.6) * 14, 0, HELLO.length)), fullW = measure(HELLO, 104, 700, SANS, -2);
    text(HELLO.slice(0, n), W / 2 - fullW / 2, 650, { size: 104, weight: 700, spacing: -2 });
    if (lt > 1.3 && (n < HELLO.length || Math.floor(lt * 2.5) % 2 === 0) && lt < 6) { ctx.fillStyle = C.coral; ctx.fillRect(W / 2 - fullW / 2 + measure(HELLO.slice(0, n), 104, 700, SANS, -2) + 8, 568, 8, 100); }
    const s = fadeUp(lt, 3.3, .6);
    text('Dein KI-Assistent von Anthropic', W / 2, 750 + (1 - s) * 30, { size: 44, weight: 500, color: C.dim, align: 'center', alpha: s, spacing: 1 });
  },
});

// ---------- Agenda
scene({
  id: 'agenda', music: 'chill', min: 12,
  voice: [[.6, 'Das erwartet dich: Wer ich bin, wie ich schreibe und programmiere, wie ich Dateien lese und recherchiere, wie ich dir beim Lernen helfe und Daten auswerte. Und zum Schluss: Warum sich Claude Pro lohnt.']],
  sfx: () => CHAPTERS.map((_, i) => ['pop', 1 + i * .45, { f: 440 * Math.pow(2, [0, 2, 4, 5, 7, 9, 12][i] / 12) }]),
  draw(lt, D, s) {
    const tp = fadeUp(lt, .1, .6);
    text('Das erwartet dich', 160 - (1 - tp) * 100, 230, { size: 84, weight: 800, alpha: tp, spacing: -2 });
    ctx.fillStyle = C.coral; ctx.fillRect(162, 258, 230 * fadeUp(lt, .4, .6), 7);
    // Hervorhebung wandert mit der Stimme mit
    const cl = s.clips && s.clips[0], hlP = cl ? clamp((lt - cl.lt0) / (cl.t1 - cl.t0)) : 0;
    CHAPTERS.forEach((c, i) => {
      const p = prog(lt, 1 + i * .45, .5); if (p <= 0) return;
      const col = i < 4 ? 0 : 1, row = i < 4 ? i : i - 4, x = 160 + col * 820, y = 330 + row * 130;
      const hl = clamp(1 - Math.abs(hlP * 7.6 - i - .5) * 1.2);
      withAlpha(clamp(p * 3), () => {
        ctx.save(); ctx.translate((1 - easeBack(p)) * -120, 0);
        if (hl > 0) { ctx.shadowColor = 'rgba(217,119,87,.6)'; ctx.shadowBlur = 40 * hl; }
        card(x, y, 760, 104, 26, C.card, hl > .1 ? `rgba(217,119,87,${.35 + .65 * hl})` : C.cardEdge); ctx.shadowBlur = 0;
        ctx.fillStyle = i === 6 ? C.coral : 'rgba(217,119,87,.16)'; ctx.beginPath(); ctx.arc(x + 58, y + 52, 32, 0, 6.283); ctx.fill();
        text(String(i + 1), x + 58, y + 64, { size: 32, weight: 800, color: i === 6 ? '#1A1310' : C.coralLight, align: 'center' });
        text(c, x + 112, y + 66, { size: 40, weight: 700 });
        ctx.restore();
      });
    });
  },
});

// ---------- Kapitel-Trenner
function bumper(n) {
  scene({
    id: 'bumper' + n, chapter: n, bumper: true, music: n === 3 || n === 6 ? 'groove' : 'chill', min: 3.6,
    sfx: () => [['impact', .3, { big: 3 }], ['pop', .7, { f: 880 }]],
    draw(lt, D) {
      const p = easeOut(prog(lt, 0, .8)), out = easeInOut(prog(lt, D - .5, .5));
      ctx.save(); ctx.globalAlpha *= .14 * p;
      ctx.font = `900 520px ${SANS}`; ctx.letterSpacing = '-20px'; ctx.textAlign = 'right';
      ctx.lineWidth = 6; ctx.strokeStyle = C.coral; ctx.strokeText('0' + n, W - 80 + (1 - p) * 300 - out * 200, 760); ctx.restore();
      ctx.fillStyle = C.coral; ctx.fillRect(160, 470, 380 * easeOut(prog(lt, .3, .6)), 8);
      text(`KAPITEL ${n}`, 160 - (1 - p) * 80, 440, { size: 34, weight: 700, color: C.coralLight, spacing: 8, alpha: p });
      const tp = easeOut(prog(lt, .35, .6));
      text(CHAPTERS[n - 1], 160 - (1 - tp) * 140 - out * 120, 600, { size: 128, weight: 800, spacing: -4, alpha: tp });
    },
  });
}

// ---------- Kapitel 1: Wer bin ich?
const LANGS = ['Hallo', 'Hello', 'Hola', 'Bonjour', 'Ciao', 'Merhaba', 'Olá', 'Cześć', 'Hej', 'Ahoj', 'Szia', 'Zdravo'];
bumper(1);
scene({
  id: 'who', chapter: 1, music: 'chill', min: 24,
  voice: [
    [.8, 'Mit mir kannst du ganz normal schreiben, so wie mit einem Freund. Ich verstehe Texte, Code, Bilder und ganze Dokumente.'],
    [9, 'Ich antworte in vielen Sprachen, egal ob Deutsch, Englisch, Spanisch oder Türkisch.'],
    [15, 'Und ganz ehrlich: Ich bin eine KI und kann mich auch mal irren. Wichtiges also lieber kurz gegenprüfen.'],
  ],
  sfx: s => [...[0, 1, 2, 3].map(i => ['pop', clipAt(s, 1, 4) + .2 + i * .45, { f: 523 * Math.pow(2, [0, 4, 7, 12][i] / 12) }]), ['whoosh', entryAt(s, 1, 9) - .2, { soft: 1 }], ['chime', entryAt(s, 2, 15) + .3, {}]],
  draw(lt, D, s) {
    const cx = W / 2, cy = 430;
    starburst(cx, cy, 90, prog(lt, .1, .9), lt * .3, 1);
    const items = [['Texte', 'pen'], ['Code', 'code'], ['Bilder', 'image'], ['Dokumente', 'doc']];
    const t0 = clipAt(s, 1, 4) + .2;
    items.forEach(([lab, ic], i) => {
      const p = pop(lt, t0 + i * .45); if (p <= 0) return;
      const a = -Math.PI / 2 + i * Math.PI / 2 + lt * .18, x = cx + Math.cos(a) * 420, y = cy + Math.sin(a) * 210;
      scaled(x, y, p, () => {
        card(x - 150, y - 50, 300, 100, 50, '#221E1A', 'rgba(217,119,87,.5)');
        icon(ic, x - 122, y - 22, 44); text(lab, x - 64, y + 13, { size: 36, weight: 700 });
      });
      ctx.save(); ctx.globalAlpha = .25 * clamp(p); ctx.strokeStyle = C.coral; ctx.setLineDash([6, 10]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 110, cy + Math.sin(a) * 60); ctx.lineTo(x - Math.cos(a) * 160, y - Math.sin(a) * 55); ctx.stroke(); ctx.restore();
    });
    // Sprachen-Laufband
    const lp = fadeUp(lt, entryAt(s, 1, 9) - .2, .6);
    if (lp > 0) withAlpha(lp, () => {
      const y = 760; ctx.save(); rr(80, y - 50, W - 160, 96, 48); ctx.clip(); ctx.fillStyle = 'rgba(30,27,24,.85)'; ctx.fillRect(0, 0, W, H);
      let x = -((lt * 140) % 2400);
      for (let k = 0; k < 3; k++) for (const w of LANGS) { text(w, x, y + 14, { size: 40, weight: 700, color: k % 2 ? C.text : C.coralLight }); x += measure(w, 40, 700) + 70; ctx.fillStyle = C.coral; ctx.beginPath(); ctx.arc(x - 35, y, 5, 0, 6.283); ctx.fill(); }
      ctx.restore();
    });
    // Ehrlichkeits-Hinweis
    const np = pop(lt, entryAt(s, 2, 15) + .2, .6);

    [...'Bau mir ein Video über Claude Pro'].forEach((c, i) => c !== ' ' && out.push(['type', 3.0 + i / 18, { v: i + 9 }]));
    [5.6, 6.6, 7.6, 8.6, 9.6].forEach((t, i) => out.push(['tick', t, { v: i, hi: 1 }]));
    out.push(['sweep', 9.8, { dur: 2.6 }], ['chime', 12.6, { big: 1 }]);
    return out;
  },
  draw(lt) {
    reasonTitle(2, 'Claude Code inklusive', lt);
    const x = 300, y = 290, w = 1320, h = 600;
    windowFrame(x, y, w, h, 'Terminal');
    ctx.save(); rr(x + 2, y + 54, w - 4, h - 56, 20); ctx.clip(); ctx.fillStyle = '#0B0A09'; ctx.fillRect(x, y + 54, w, h); ctx.restore();
    let yy = y + 110;
    for (const [pre, str, t0, kind] of TERM) {
      if (lt < t0) break;
      if (kind === 'banner') {
        withAlpha(fadeUp(lt, t0, .3), () => { rr(x + 40, yy - 34, 420, 56, 12); ctx.strokeStyle = C.coral; ctx.lineWidth = 2; ctx.stroke(); text(str, x + 60, yy + 4, { size: 26, weight: 700, color: C.coral, font: MONO }); });
        yy += 70; continue;
      }
      const cps = kind === 'cmd' ? (str === 'claude' ? 14 : 18) : 200;
      const n = Math.floor(clamp((lt - t0) * cps, 0, str.length));
      const col = kind === 'done' ? C.green : kind === 'cmd' ? C.text : C.dim;
      const pc = kind === 'done' ? C.green : kind === 'cmd' ? C.coral : (lt - t0 < 1 && kind !== 'prog' ? C.amber : C.green);
      text(pre, x + 40, yy, { size: 26, weight: 700, color: pc, font: MONO });
      text(str.slice(0, n), x + 40 + measure(pre, 26, 700, MONO), yy, { size: 26, weight: kind === 'done' ? 700 : 400, color: col, font: MONO });
      if (kind === 'prog') {
        const p = prog(lt, t0 + .2, 2.8), bx = x + 480, bw2 = 560;
        rr(bx, yy - 20, bw2, 22, 11); ctx.fillStyle = '#2A2622'; ctx.fill();
        rr(bx, yy - 20, Math.max(22, bw2 * p), 22, 11); ctx.fillStyle = C.coral; ctx.fill();
        text(`${Math.round(p * 11000).toLocaleString('de-DE')} / 11.000`, bx + bw2 + 20, yy, { size: 22, weight: 600, color: C.dim, font: MONO });
      }
      yy += 50;
    }
    if (Math.floor(lt * 2.5) % 2 === 0) { ctx.fillStyle = C.coral; ctx.fillRect(x + 40, yy - 24, 14, 30); }
  },
});

const FEATS = [['Claude Cowork', 'Ganze Aufgaben mit deinen Dateien', 'folder'], ['Mehr Modelle', 'Das passende Modell für jede Aufgabe', 'layers'], ['Projekte', 'Alle Unterlagen an einem Ort', 'doc'], ['Research', 'Richtig gründliche Recherchen', 'search']];
scene({
  id: 'feats', chapter: 7, music: 'big', min: 16,
  voice: [
    [.5, 'Drittens: Es gibt noch viel mehr. Claude Cowork, mit dem ich ganze Aufgaben mit deinen Dateien erledige. Mehr Modelle zur Auswahl. Projekte für deine Unterlagen. Und Research für richtig gründliche Recherchen.'],
    [14, 'Neue Funktionen bekommst du außerdem früher als alle anderen.'],
  ],
  sfx: s => [...FEATS.map((_, i) => ['pop', clipAt(s, i + 1, 3 + i * 2.5), { f: 523 * Math.pow(2, [0, 4, 7, 12][i] / 12) }]), ['chime', entryAt(s, 1, 14), { big: 1 }]],
  draw(lt, D, s) {
    reasonTitle(3, 'Noch mehr dabei', lt);
    FEATS.forEach(([h, sub, ic], i) => {
      const t0 = clipAt(s, i + 1, 3 + i * 2.5), p = pop(lt, t0, .55); if (p <= 0) return;

      const active = s.clips && s.clips[i + 1] && lt >= s.clips[i + 1].lt0 && lt < s.clips[i + 1].lt0 + (s.clips[i + 1].t1 - s.clips[i + 1].t0);
      scaled(x + 360, y + 105, p, () => {
        ctx.save(); if (active) { ctx.shadowColor = 'rgba(217,119,87,.6)'; ctx.shadowBlur = 40; }
        card(x, y, 740, 210, 30, C.card, active ? C.coral : C.cardEdge); ctx.restore();
        rr(x + 40, y + 50, 110, 110, 28); ctx.fillStyle = 'rgba(217,119,87,.15)'; ctx.fill(); icon(ic, x + 60, y + 70, 70);
        text(h, x + 190, y + 100, { size: 46, weight: 800 }); text(sub, x + 190, y + 150, { size: 28, weight: 500, color: C.dim });
      });
    });
    const bp = pop(lt, entryAt(s, 1, 14), .5);
    if (bp > 0) scaled(W / 2, 860, bp, () => {
      rr(W / 2 - 460, 815, 920, 90, 45); const g = ctx.createLinearGradient(W / 2 - 460, 0, W / 2 + 460, 0); g.addColorStop(0, C.coral); g.addColorStop(1, C.amber); ctx.fillStyle = g; ctx.fill();
      icon('star', W / 2 - 420, 836, 48, '#1A1310'); text('Neue Features zuerst', W / 2 + 20, 875, { size: 44, weight: 800, color: '#1A1310', align: 'center' });
    });
  },
});

const COMPARE = [['Chatten, Schreiben, Code', 1, 1], ['Nutzung', 'Basis', '≈ 5× mehr'], ['Claude Code', 0, 1], ['Claude Cowork', 0, 1], ['Research', 0, 1], ['Neue Features zuerst', 0, 1]];
scene({
  id: 'compare', chapter: 7, music: 'big', min: 12,
  voice: [[.5, 'Hier nochmal alles auf einen Blick.']],
  sfx: () => COMPARE.map((_, i) => ['pop', 1 + i * .5, { f: 523 * Math.pow(2, i / 6) }]),
  draw(lt) {
    const tp = fadeUp(lt, .1, .5);
    text('Free vs. Pro', W / 2, 200, { size: 80, weight: 800, align: 'center', spacing: -2, alpha: tp });
    const x0 = 360, cw1 = 620, cw = 300, y0 = 260;

    withAlpha(tp, () => {
      ctx.save(); ctx.shadowColor = 'rgba(217,119,87,.5)'; ctx.shadowBlur = 50;

      text('Free', x0 + cw1 + cw / 2, y0 + 68, { size: 40, weight: 800, align: 'center', color: C.dim });

      const a = pop(lt, 1 + i * .5); if (a <= 0) return;
      const y = y0 + 110 + i * 92;
      withAlpha(clamp(a), () => {
        ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x0, y, cw1 + cw * 2, 1);
        text(lab, x0 + 20, y + 58, { size: 34, weight: 600 });
        [[f, x0 + cw1 + cw / 2, false], [p, x0 + cw1 + cw * 1.5, true]].forEach(([v, cx, pro]) => {
          if (typeof v === 'string') text(v, cx, y + 58, { size: 32, weight: 800, align: 'center', color: pro ? C.coralLight : C.dim });
          else icon(v ? 'check' : 'cross', cx - 26, y + 20, 52, v ? (pro ? C.green : C.dim) : '#5A524B');
        });
      });
    });
  },
});

scene({
  id: 'price', chapter: 7, music: 'big', min: 14,
  voice: [
    [.4, 'Und das alles kostet zwanzig Dollar im Monat.'],
    [4.5, 'Im Jahresabo sind es sogar nur siebzehn. Das sind ungefähr siebenundsechzig Cent am Tag.'],
  ],
  sfx: s => { const out = []; for (let i = 1; i <= 20; i++) out.push(['tick', 1.0 + (1 - Math.pow(1 - i / 20, 1 / 3)) * 1.2, { v: i, hi: 1 }]); out.push(['chime', 2.2, { big: 1 }], ['pop', entryAt(s, 1, 4.5), { f: 600 }], ['pop', clipAt(s, 2, 7), { f: 800 }]); return out; },
  draw(lt, D, s) {
    const p1 = fadeUp(lt, .1, .6);
    text('Das alles für', W / 2, 260 + (1 - p1) * 30, { size: 52, weight: 600, color: C.dim, align: 'center', alpha: p1 });

    if (lt >= .9) scaled(W / 2, 540, pz, () => {
      const num = `${val} $`, nw = measure(num, 300, 800, SANS, -8), mw = measure(' / Monat', 64, 600), x0 = W / 2 - (nw + mw) / 2;
      ctx.save(); const g = ctx.createLinearGradient(x0, 300, x0 + nw, 540); g.addColorStop(0, C.coralLight); g.addColorStop(1, C.coral);
      ctx.shadowColor = 'rgba(217,119,87,.5)'; ctx.shadowBlur = 60; ctx.font = `800 300px ${SANS}`; ctx.letterSpacing = '-8px'; ctx.fillStyle = g; ctx.fillText(num, x0, 600); ctx.restore();
      text(' / Monat', x0 + nw, 600, { size: 64, weight: 600, color: C.dim });
    });
    ring(W / 2, 480, lt, 2.2, 700);
    const p2 = fadeUp(lt, entryAt(s, 1, 4.5), .5);
    text('oder 17 $ pro Monat im Jahresabo · zzgl. Steuern', W / 2, 720 + (1 - p2) * 20, { size: 38, weight: 500, color: C.dim, align: 'center', alpha: p2 });
    const p3 = pop(lt, clipAt(s, 2, 7), .55);
    if (p3 > 0) scaled(W / 2, 830, p3, () => { rr(W / 2 - 330, 780, 660, 100, 50); ctx.fillStyle = 'rgba(217,119,87,.15)'; ctx.fill(); ctx.strokeStyle = C.coral; ctx.lineWidth = 2; ctx.stroke(); text('≈ 67 Cent pro Tag', W / 2, 846, { size: 46, weight: 800, color: C.coralLight, align: 'center' }); });
  },
});

// ---------- Outro
scene({
  id: 'outro', music: 'outro', min: 16,
  voice: [
    [1.2, 'Also, worauf wartest du? Probier es aus. Ich freu mich auf dich!'],
    [6.5, 'Claude Pro. Mehr Claude, mehr Möglichkeiten.'],
  ],
  sfx: s => [['impact', .2, { big: 2 }], ['pop', entryAt(s, 1, 6.5) + 1.2, { f: 660 }], ['chime', entryAt(s, 1, 6.5) + 2.2, {}]],
  draw(lt, D, s) {
    const g = prog(lt, 0, .5);
    starburst(W / 2, 330, 130 * (lt > .2 ? 1 + Math.exp(-(lt - .2) * 6) * .2 : 1), g, lt * .2, 1); ring(W / 2, 330, lt, .2, 700);
    const p1 = easeOut(prog(lt, .2, .6));
    scaled(W / 2, 600, lerp(1.3, 1, p1), () => {
      ctx.save(); ctx.font = `800 140px ${SANS}`; ctx.letterSpacing = '-4px';
      const w1 = ctx.measureText('Claude ').width, w2 = ctx.measureText('Pro').width, x0 = W / 2 - (w1 + w2) / 2; ctx.restore();
      text('Claude ', x0, 620, { size: 140, weight: 800, spacing: -4, alpha: p1 });
      ctx.save(); const gr = ctx.createLinearGradient(x0 + w1, 520, x0 + w1 + w2, 620); gr.addColorStop(0, C.coral); gr.addColorStop(1, C.amber);
      ctx.globalAlpha *= p1; ctx.font = `800 140px ${SANS}`; ctx.letterSpacing = '-4px'; ctx.fillStyle = gr; ctx.fillText('Pro', x0 + w1, 620); ctx.restore();
    });
    const e1 = entryAt(s, 1, 6.5), p2 = fadeUp(lt, e1 + 1.2, .6);
    text('Mehr Claude. Mehr Möglichkeiten.', W / 2, 710 + (1 - p2) * 20, { size: 48, weight: 500, color: C.dim, align: 'center', alpha: p2 });
    const p3 = pop(lt, e1 + 2.2, .5);
    if (p3 > 0) scaled(W / 2, 830, p3 * (1 + Math.sin((lt - e1) * 4) * .02), () => {
      ctx.save(); ctx.shadowColor = 'rgba(217,119,87,.6)'; ctx.shadowBlur = 40; rr(W / 2 - 220, 782, 440, 96, 48); ctx.fillStyle = C.coral; ctx.fill(); ctx.restore();
      text('claude.ai', W / 2, 846, { size: 46, weight: 800, color: '#1A1310', align: 'center' });
    });
    text('Dieses Video wurde komplett aus Code erstellt – von Claude.', W / 2, 960, { size: 26, weight: 500, color: C.faint, align: 'center', alpha: fadeUp(lt, e1 + 3) });
    text('Preise: Stand November 2026, je nach Land unterschiedlich · claude.com/pricing', W / 2, 1000, { size: 20, weight: 500, color: '#5A524B', align: 'center', alpha: fadeUp(lt, e1 + 3) });
  },
});

// =====================================================================
//  Zeitplan bauen
// =====================================================================
const sentences = t => t.match(/[^.!?]+[.!?]+\s*/g).map(x => x.trim());
window.voiceTexts = () => {
  const out = [];
  SCENES.forEach((s, si) => (s.voice || []).forEach(([, txt], ei) => sentences(txt).forEach((sen, k) => out.push({ id: `${si}_${ei}_${k}`, text: sen }))));
  return out;
};
let CLIPS = [], SFX = [], MUSIC = [], END = 0;
window.build = (durs) => {
  CLIPS = []; SFX = []; MUSIC = []; let t = 0;
  SCENES.forEach((s, si) => {
    s.start = t; s.clips = []; s.entries = [];
    let cursor = 0;
    (s.voice || []).forEach(([at, txt], ei) => {
      cursor = Math.max(at, cursor + (ei ? .6 : 0)); s.entries[ei] = cursor;
      sentences(txt).forEach((sen, k) => {
        const id = `${si}_${ei}_${k}`, d = durs[id] ? durs[id].dur : sen.length / 15;
        if (k) cursor += .3;
        const c = { id, text: sen, t0: t + cursor, t1: t + cursor + d, lt0: cursor, file: durs[id] && durs[id].file };
        CLIPS.push(c); s.clips.push(c); cursor += d;
      });
    });
    let D = Math.max(s.min, cursor + (s.voice ? 1.4 : 0));
    D = Math.ceil(D / 2 - 1e-6) * 2; s.D = D;
    MUSIC.push({ t0: t, t1: t + D, mode: s.music });
    if (si) SFX.push({ type: 'whoosh', t: +(t - .1).toFixed(3), soft: s.bumper ? 0 : 1 });
    (s.sfx ? s.sfx(s) : []).forEach(([type, lt, p]) => SFX.push({ type, t: +(t + lt).toFixed(4), ...(p || {}) }));
    t += D;
  });
  END = t;
  return { end: END, clips: CLIPS.map(({ id, text, t0, t1, file }) => ({ id, text, t0, t1, file })), sfx: SFX, music: MUSIC, scenes: SCENES.map(s => ({ id: s.id, start: s.start, D: s.D })) };
};
window.build({});

// =====================================================================
//  Zeichnen
// =====================================================================
function hud(t, s) {
  if (!s.chapter) return;
  const a = s.bumper ? .0 : 1;
  withAlpha(a * .95, () => {
    starburst(70, 56, 16, 1, t * .3, 0);
    text('Claude Pro', 100, 66, { size: 26, weight: 800 });
    text('·  Das Video', 240, 66, { size: 26, weight: 500, color: C.faint });
    const lab = `Kapitel ${s.chapter}  ·  ${CHAPTERS[s.chapter - 1]}`, lw = measure(lab, 24, 700) + 48;
    rr(W - 60 - lw, 30, lw, 50, 25); ctx.fillStyle = 'rgba(30,27,24,.85)'; ctx.fill(); ctx.strokeStyle = C.cardEdge; ctx.lineWidth = 2; ctx.stroke();
    text(lab, W - 60 - lw / 2, 64, { size: 24, weight: 700, color: C.coralLight, align: 'center' });
  });
}
function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, H - 6, W, 6);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, C.coral); g.addColorStop(1, C.amber);
  ctx.fillStyle = g; ctx.fillRect(0, H - 6, W * clamp(t / END), 6);
  for (const s of SCENES) if (s.bumper) { ctx.fillStyle = '#12100e'; ctx.fillRect(W * s.start / END - 2, H - 6, 4, 6); }
}
function subtitles(t) {
  const c = CLIPS.find(c => t >= c.t0 - .05 && t < c.t1 + .3); if (!c) return;
  const a = Math.min(prog(t, c.t0 - .05, .15), 1 - prog(t, c.t1 + .15, .15));
  const lines = wrap(c.text, 1500, 36, 600), lw = Math.max(...lines.map(l => measure(l, 36, 600))) + 64, lh = 50, bh = lines.length * lh + 26;
  withAlpha(a, () => {
    rr(W / 2 - lw / 2, 1040 - bh, lw, bh, 20); ctx.fillStyle = 'rgba(10,9,8,.78)'; ctx.fill();
    lines.forEach((l, i) => text(l, W / 2, 1040 - bh + 50 + i * lh, { size: 36, weight: 600, align: 'center' }));
  });
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
  background(t);
  let cur = SCENES[0];
  SCENES.forEach(s => {
    const lt = t - s.start; if (lt < 0 || lt > s.D + .45) return;
    if (lt < s.D) cur = s;
    const a = Math.min(prog(lt, 0, .45), 1 - prog(lt, s.D - .05, .45)), out = prog(lt, s.D - .05, .45);
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(W / 2, H / 2); const z = 1 + easeInOut(out) * .06 - (1 - easeOut(prog(lt, 0, .45))) * .04; ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    s.draw(lt, s.D, s); ctx.restore();
  });
  hud(t, cur);
  vignette();
  subtitles(t);
  if (t > 1) progressBar(t);
  const k = Math.max(1 - prog(t, 0, .4), prog(t, END - 2.5, 2.4));
  if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); }
}
window.draw = draw;
window.ready = document.fonts.load('800 100px Inter').then(() => document.fonts.load('500 40px Inter')).then(() => document.fonts.load('400 20px "DejaVu Sans Mono"')).then(() => document.fonts.ready);
if (!location.search.includes('render')) {
  const start = performance.now();
  const loop = () => { draw(((performance.now() - start) / 1000) % END); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
