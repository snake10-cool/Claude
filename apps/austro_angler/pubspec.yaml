name: austro_angler
description: "Austro Angler – Angel-App für ganz Österreich."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bilder/fische/
    - assets/bilder/knoten/
