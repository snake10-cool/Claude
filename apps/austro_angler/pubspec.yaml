name: austro_angler
description: "Austro Angler – Angel-App für ganz Österreich."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  video_compress: ^3.1.4
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/bilder/fische/
    - assets/bilder/knoten/
    - assets/icon/app.png
    - assets/daten/gewaesser_at.json.gz

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1E6F5C"
  adaptive_icon_foreground: assets/icon/icon_vordergrund.png
  min_sdk_android: 23
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256

flutter_native_splash:
  color: "#1E6F5C"
  image: assets/icon/splash.png
  android_12:
    color: "#1E6F5C"
    image: assets/icon/splash.png
  ios: false
  web: false
