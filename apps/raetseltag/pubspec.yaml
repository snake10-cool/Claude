name: raetseltag
description: "Rätseltag – jeden Tag ein Worträtsel, ein Sudoku und ein Schiebepuzzle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_basis:
    path: ../../packages/app_basis
  app_kauf:
    path: ../../packages/app_kauf
  app_werbung:
    path: ../../packages/app_werbung
  intl: ^0.20.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/woerter/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/icon/icon_vordergrund.png
  min_sdk_android: 23
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
