name: codekarten
description: "Codekarten – Programmieren lernen mit Karteikarten und Snippets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_basis:
    path: ../../packages/app_basis
  app_kauf:
    path: ../../packages/app_kauf
  app_werbung:
    path: ../../packages/app_werbung
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4

# analyzer 14.5 passt nicht zu build_runner 2.16.1 (Code-Generierung für
# Drift). Entfernen, sobald build_runner aktualisiert ist.
dependency_overrides:
  analyzer: 14.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/stapel/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#6C4DE6"
  adaptive_icon_foreground: assets/icon/icon_vordergrund.png
  min_sdk_android: 23
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
