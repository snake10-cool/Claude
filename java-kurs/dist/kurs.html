    function visualHTML(v) {
      const at = (i, base, gap) => (base || 0.3) + i * (gap || 0.7);
      switch (v.kind) {
        case 'bullets': return `${v.title ? `<h4>${md(v.title)}</h4>` : ''}<ul class="bul">${v.items.map((it, i) => `<li data-s="${at(i, v.start, v.gap)}">${md(it)}</li>`).join('')}</ul>`;
        case 'big': return `<div class="big" data-s="0.2"><div class="big-main">${md(v.text)}</div>${v.sub ? `<div class="big-sub">${md(v.sub)}</div>` : ''}</div>`;
        case 'boxes': return `${v.title ? `<h4>${md(v.title)}</h4>` : ''}<div class="boxes">${v.vars.map((b, i) => `<div class="box" data-s="${b.s != null ? b.s : at(i, v.start, v.gap)}"><div class="box-type">${esc(b.type)}</div><div class="box-val ${b.cls || ''}">${esc(b.value)}</div><div class="box-name">${esc(b.name)}</div></div>`).join('')}</div>${v.note ? `<p class="vnote" data-s="${v.noteAt || 1.5}">${md(v.note)}</p>` : ''}`;
        case 'table': return `${v.title ? `<h4>${md(v.title)}</h4>` : ''}<table class="vt"><thead><tr>${v.head.map(h => `<th>${md(h)}</th>`).join('')}</tr></thead><tbody>${v.rows.map((r, i) => `<tr data-s="${at(i, v.start, v.gap || 0.5)}">${r.map(c => `<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        case 'flow': return `${v.title ? `<h4>${md(v.title)}</h4>` : ''}<div class="flow${v.dir === 'row' ? ' row' : ''}">${v.items.map((it, i) => `${i ? `<div class="arrow" data-s="${at(i, v.start, v.gap) - 0.25}">${v.dir === 'row' ? '→' : '↓'}</div>` : ''}<div class="fstep ${it.cls || ''}" data-s="${at(i, v.start, v.gap)}"><b>${md(it.h)}</b>${it.p ? `<span>${md(it.p)}</span>` : ''}</div>`).join('')}</div>`;
        case 'compare': return `<div class="cmp">${[v.left, v.right].map((c, i) => `<div class="cmp-col ${c.cls || ''}" data-s="${0.3 + i * 1.2}"><div class="cmp-h">${md(c.title)}</div><pre class="cmp-code">${hlJava(c.code)}</pre>${c.note ? `<div class="cmp-note">${md(c.note)}</div>` : ''}</div>`).join('')}</div>`;
        case 'code': return `${v.title ? `<h4>${md(v.title)}</h4>` : ''}<pre class="vcode" data-s="0.2">${hlJava(v.code)}</pre>${v.note ? `<p class="vnote" data-s="${v.noteAt || 1}">${md(v.note)}</p>` : ''}`;
        case 'html': return v.html;
      }
      return '';
    }
    function renderVisual(st, lt) {
      const vi = st.vis;
      if (vi !== R.visIdx) {
        R.visIdx = vi;
        E.visual.innerHTML = vi >= 0 ? `<div class="vis vis-${steps[vi].visual.kind || 'html'}">${visualHTML(steps[vi].visual)}</div>` : '';
        R.visEls = $$('[data-s]', E.visual).map(el => ({ el, s: parseFloat(el.dataset.s), on: false }));
      }
      if (vi < 0) return;
      const vlt = st.idx === vi ? lt : 1e9;
      for (const x of R.visEls) { const on = vlt >= x.s; if (on !== x.on) { x.on = on; x.el.classList.toggle('in', on); if (on && vlt < 1e8) sfx.pop(); } }
    }
    function renderSay(st, lt) {
      if (R.sayStep !== st.idx) {
        R.sayStep = st.idx;
        if (st.say) {
          const parts = st.say.split(/(`[^`]+`|\*\*[^*]+\*\*)/);
          const words = (txt, b) => txt.split(/(\s+)/).map(w => !w ? '' : /^\s+$/.test(w) ? (w.includes('\n') ? '<br>' : ' ') : `<span class="w">${b ? '<b>' + esc(w) + '</b>' : esc(w)}</span>`).join('');
          let html = '';
          for (const p of parts) {
            if (/^`[^`]+`$/.test(p)) html += `<span class="w"><code>${esc(p.slice(1, -1))}</code></span>`;
            else if (/^\*\*[^*]+\*\*$/.test(p)) html += words(p.slice(2, -2), true);
            else html += words(p, false);
          }
          E.say.innerHTML = html;
          R.words = $$('.w', E.say); R.sayWords = -1;
          E.narr.classList.remove('empty');
          if (st.idx !== 0 && player.playing) sfx.step();
        } else { E.say.innerHTML = ''; R.words = []; E.narr.classList.add('empty'); }
      }
      if (!R.words.length) return;
      const k = clamp(Math.floor(lt * 11) + 1, 0, R.words.length);
      if (k !== R.sayWords) { R.words.forEach((w, i) => w.classList.toggle('on', i < k)); R.sayWords = k; }
    }
    function renderTitle(st) {
      if (R.titleStep === st.idx) return; R.titleStep = st.idx;
      if (!st.t) return;
      E.kicker.textContent = st.t; E.h.innerHTML = md(st.h || ''); E.sub.innerHTML = md(st.sub || '');
      E.title.classList.remove('anim'); void E.title.offsetWidth; E.title.classList.add('anim');
      if (player.playing) sfx.whoosh();
    }
    function stepAt(t) { let lo = 0, hi = steps.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (steps[mid].start <= t) lo = mid; else hi = mid - 1; } return lo; }
    function render(t) {
      const st = steps[stepAt(t)], lt = t - st.start;
      if (st.lay !== R.lay) { stage.dataset.lay = st.lay; R.lay = st.lay; }
      renderTitle(st);
      if (st.lay !== 'title') { renderEditor(st, lt); renderConsole(st, lt); renderVisual(st, lt); }
      renderSay(st, lt);
      stage.classList.toggle('has-visual', st.vis >= 0 && ['split', 'visual', 'all'].includes(st.lay));
      ui.time.textContent = fmtTime(t) + ' / ' + fmtTime(TOTAL);
      ui.seek.value = String(Math.round(t * 10));
      ui.seek.style.setProperty('--p', (t / TOTAL * 100).toFixed(2) + '%');
      if (ui.curCh !== st.ci) { ui.curCh = st.ci; $$('.chap', ui.chapters).forEach((el, k) => el.classList.toggle('now', k === st.ci)); ui.chapLabel.textContent = 'Kapitel ' + (st.ci + 1) + ': ' + L.chapters[st.ci].title; }
    }

    // ---------------------------------------------------------------- Abspielen
    let alive = true;
    const player = {
      t: 0, playing: false, rate: 1, last: 0,
      play() {
        if (S.openTask) { syncLock(); return; }
        if (this.t >= TOTAL - 0.05) this.seek(0);
        const g = gates.find(g => !gateDone(g) && g.start >= this.t - 0.05);
        if (g && Math.abs(this.t - g.start - 0.35) < 0.06) { showGate(g); return; }
        JK.audio.ac(); if (audio.music) JK.audio.setMusic(true);
        this.playing = true; this.last = performance.now(); stage.classList.add('playing', 'started'); ui.play.innerHTML = '❚❚'; ui.play.setAttribute('aria-label', 'Pause');
        hideGate(); requestAnimationFrame(loop);
      },
      pause(save) {
        this.playing = false; stage.classList.remove('playing'); ui.play.innerHTML = '▶'; ui.play.setAttribute('aria-label', 'Abspielen');
        if (save !== false) { LS.t = this.t; ctx.persist(); }
      },
      toggle() { this.playing ? this.pause() : this.play(); },
      seek(t, silent) {
        const limit = firstOpenGateTime();
        if (t > limit) { t = limit; if (!silent) toast(gates.find(g => !gateDone(g)).task ? 'Erst die Aufgabe an dieser Stelle machen – dann geht’s weiter.' : 'Erst die Quizfrage an dieser Stelle beantworten.'); }
        this.t = clamp(t, 0, TOTAL);
        R.codeKey = ''; R.consKey = ''; R.sayStep = -1;
        hideGate();
        render(this.t);
      },
    };
    function loop(now) {
      if (!alive || !player.playing) return;
      const dt = Math.min(0.1, (now - player.last) / 1000) * player.rate; player.last = now;
      let nt = player.t + dt;
      const g = gates.find(g => !gateDone(g) && g.start + 0.35 > player.t && g.start + 0.35 <= nt);
      if (g) { nt = g.start + 0.35; player.t = nt; render(nt); player.pause(); showGate(g); return; }
      if (nt >= TOTAL) { player.t = TOTAL; render(TOTAL); player.pause(); finish(); return; }
      player.t = nt; render(nt);
      if (Math.floor(nt / 15) !== Math.floor((nt - dt) / 15)) { LS.t = nt; ctx.persist(); }
      requestAnimationFrame(loop);
    }

    // ---------------------------------------------------------------- Quiz, Aufgabe, Sperre
    function showGate(g) {
      if (g.task) { openTask(g.task); return; }
      const q = g.quiz;
      E.gate.hidden = false;
      E.gate.innerHTML = `<div class="quiz-card"><div class="quiz-kick">Kurz-Check</div><h3>${md(q.q)}</h3><div class="quiz-opts">${q.options.map((o, i) => `<button class="qopt" data-i="${i}">${md(o)}</button>`).join('')}</div><div class="quiz-fb" hidden></div></div>`;
      sfx.pop();
      $$('.qopt', E.gate).forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.i), ok = i === q.correct;
        $$('.qopt', E.gate).forEach((x, k) => { x.disabled = true; x.classList.toggle('right', k === q.correct); x.classList.toggle('wrong', k === i && !ok); });
        const fb = $('.quiz-fb', E.gate); fb.hidden = false;
        fb.innerHTML = `<p><b>${ok ? 'Richtig!' : 'Nicht ganz.'}</b> ${md(q.explain || '')}</p><button class="btn primary" data-act="quiz-next">Weiter ▶</button>`;
        ok ? sfx.good() : sfx.bad();
        S.quizzes[q.id] = { ok, at: Date.now() }; ctx.persist(); renderGates(); ctx.onChange();
        $('[data-act="quiz-next"]', fb).addEventListener('click', () => { hideGate(); player.play(); });
      }));
    }
    function hideGate() { E.gate.hidden = true; E.gate.innerHTML = ''; }
    const findTask = id => { const s = steps.find(s => s.task && s.task.id === id); return s ? s.task : null; };
    let panel = null;
    function openTask(task) {
      if (S.tasks[task.id]) return;
      S.openTask = { lesson: L.id, id: task.id, title: task.title, nr: L.nr };
      ctx.persist(); ctx.onChange();
      sfx.lock(); syncLock();
      setTimeout(() => alive && taskEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 350);
    }
    function mountTaskPanel(task) {
      if (panel && panel.id === task.id) return;
      if (panel) panel.destroy();
      taskEl.hidden = false;
      panel = JK.taskPanel(taskEl, task, ctx, {
        kicker: `Jetzt bist du dran! · Lektion ${L.nr}, Aufgabe ${task.nr || ''}`,
        note: 'Alle Videos im Kurs sind gesperrt, bis du abgibst. Ob alles stimmt, ist egal – du bekommst auf jeden Fall eine Note und Tipps. Teste vorher mit <b>▶ Ausführen</b>.',
        where: `Lektion ${L.nr}: ${L.title}`,
        continueLabel: 'Video weiter ansehen ▶',
        onSubmitted: () => { S.openTask = null; ctx.persist(); syncLock(); renderGates(); renderGrades(); ctx.onChange(); },
        onContinue: () => { $('#player', root).scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => player.play(), 400); },
      });
    }
    function syncLock() {
      const ot = S.openTask, locked = !!ot;
      stage.classList.toggle('locked', locked);
      E.lock.hidden = !locked;
      ui.seek.disabled = locked; ui.play.disabled = locked;
      if (!locked) return;
      if (player.playing) player.pause(false);
      hideGate();
      if (ot.lesson === L.id) {
        const tk = findTask(ot.id);
        E.lockTxt.textContent = `„${tk ? tk.title : ot.title}“ ist offen. Alle Videos im Kurs bleiben gesperrt, bis du deine Lösung abgegeben hast – auch nach dem Neuladen und auf anderen Geräten.`;
        E.lockBtn.textContent = 'Zur Aufgabe ↓';
        E.lockBtn.onclick = () => taskEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (tk) mountTaskPanel(tk);
      } else {
        E.lockTxt.textContent = `In Lektion ${ot.nr} ist die Aufgabe „${ot.title}“ offen. Solange sind alle Videos gesperrt – so kannst du nicht nachschauen.`;
        E.lockBtn.textContent = `Zur Aufgabe in Lektion ${ot.nr} →`;
        E.lockBtn.onclick = () => ctx.navigate('#lektion-' + ot.nr);
      }
    }

    // ---------------------------------------------------------------- Kapitel, Noten, Abschluss
    ui.seek.max = String(Math.round(TOTAL * 10));
    ui.marks.innerHTML = chapterStart.map(s => `<i class="cm" style="left:${(s / TOTAL * 100).toFixed(2)}%"></i>`).join('') + gates.map(g => `<i class="gm ${g.task ? 'task' : 'quiz'}" data-g="${g.task ? g.task.id : g.quiz.id}" style="left:${(g.start / TOTAL * 100).toFixed(2)}%"></i>`).join('');
    ui.chapters.innerHTML = L.chapters.map((c, i) => `<li><button class="chap" data-i="${i}"><span class="cn">${i + 1}</span><span class="ct">${md(c.title)}</span><span class="cd">${fmtTime(chapterStart[i])}</span></button></li>`).join('');
    $$('.chap', ui.chapters).forEach(b => b.addEventListener('click', () => {
      if (S.openTask) { syncLock(); toast('Erst die offene Aufgabe abgeben.'); return; }
      player.pause(false); player.seek(chapterStart[Number(b.dataset.i)]); player.play();
      $('#player', root).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
    function renderGates() { $$('.gm', ui.marks).forEach(m => m.classList.toggle('done', m.classList.contains('task') ? !!S.tasks[m.dataset.g] : !!S.quizzes[m.dataset.g])); }
    function renderGrades() {
      const tasks = steps.filter(s => s.task).map(s => s.task);
      $('#grades', root).innerHTML = tasks.map(t => { const r = S.tasks[t.id] && S.tasks[t.id].result; return `<div class="gr${r ? ' g' + r.note : ''}"><div class="gr-num">${r ? r.note : '–'}</div><div><b>${md(t.title)}</b><br><span class="muted">${r ? GRADE_WORD[r.note] + ' · ' + r.punkte + ' Punkte' : 'noch offen'}</span></div></div>`; }).join('');
      const done = tasks.filter(t => S.tasks[t.id]);
      const avg = done.length ? done.reduce((a, t) => a + S.tasks[t.id].result.note, 0) / done.length : null;
      $('#grade-avg', root).textContent = avg ? avg.toFixed(1).replace('.', ',') : '–';
    }
    function finish() {
      LS.done = true; ctx.persist(); ctx.onChange();
      E.gate.hidden = false;
      const tasks = steps.filter(s => s.task).map(s => s.task);
      E.gate.innerHTML = `<div class="quiz-card end"><div class="quiz-kick">Lektion ${L.nr} geschafft 🎉</div><h3>${md(L.title)}</h3><p>${md(L.outro || 'Super gemacht!')}</p>${tasks.length ? `<p class="muted">Deine Noten: ${tasks.map(t => S.tasks[t.id] ? S.tasks[t.id].result.note : '–').join(' · ')}</p>` : ''}<div class="row">${ctx.nextHash ? `<a class="btn primary" href="${ctx.nextHash}">Lektion ${L.nr + 1} →</a>` : `<a class="btn primary" href="#challenges">Zu den Challenges →</a>`}<button class="btn ghost" data-act="replay">Nochmal ansehen</button></div></div>`;
      sfx.good();
      $('[data-act="replay"]', E.gate).onclick = () => { hideGate(); player.seek(0); player.play(); };
    }

    // ---------------------------------------------------------------- Steuerung
    ui.play.addEventListener('click', () => player.toggle());
    E.bigplay.addEventListener('click', () => player.play());
    stage.addEventListener('click', e => { if (e.target.closest('button, a, .st-gate, .st-lock')) return; if (!S.openTask) player.toggle(); });
    ui.seek.addEventListener('input', () => { if (S.openTask) return; const was = player.playing; player.pause(false); player.seek(Number(ui.seek.value) / 10); if (was) player.play(); });
    ui.speed.addEventListener('change', () => { player.rate = Number(ui.speed.value); });
    const syncAudioBtns = () => { ui.sfxBtn.classList.toggle('off', !audio.sfx); ui.sfxBtn.setAttribute('aria-pressed', String(audio.sfx)); ui.musicBtn.classList.toggle('off', !audio.music); ui.musicBtn.setAttribute('aria-pressed', String(audio.music)); };
    ui.sfxBtn.addEventListener('click', () => { audio.sfx = !audio.sfx; JK.audio.save(); syncAudioBtns(); if (audio.sfx) { JK.audio.ac(); sfx.pop(); } });
    ui.musicBtn.addEventListener('click', () => { JK.audio.setMusic(!audio.music); syncAudioBtns(); });
    ui.fs.addEventListener('click', () => { const p = $('#player', root); try { if (document.fullscreenElement) document.exitFullscreen(); else p.requestFullscreen().catch(() => toast('Vollbild ist hier nicht verfügbar.')); } catch (e) { toast('Vollbild ist hier nicht verfügbar.'); } });
    const onKey = e => {
      if (e.target.closest('input, textarea, select')) return;
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); player.toggle(); }
      else if (e.key === 'ArrowRight') { if (!S.openTask) player.seek(player.t + 5); }
      else if (e.key === 'ArrowLeft') { if (!S.openTask) player.seek(player.t - 5); }
    };
    const onVis = () => { if (document.hidden && player.playing) player.pause(); };
    const onResize = () => { R.codeKey = ''; render(player.t); };
    document.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('resize', onResize);
    syncAudioBtns();

    // ---------------------------------------------------------------- Start
    player.t = Math.min(LS.t || 0, firstOpenGateTime());
    if (player.t > 0.5) stage.classList.add('started');
    render(player.t);
    renderGates(); renderGrades(); syncLock();
    S.last = L.id;

    const api = {
      player, steps, TOTAL, render,
      refresh() { // Zustand kam von einem anderen Gerät
        renderGates(); renderGrades(); syncLock();
        if (!S.openTask && !player.playing) { const lim = firstOpenGateTime(); if (LS.t > player.t + 1) player.seek(Math.min(LS.t, lim), true); }
      },
      destroy() {
        alive = false;
        if (player.playing) player.pause();
        if (panel) panel.destroy();
        document.removeEventListener('keydown', onKey);
        document.removeEventListener('visibilitychange', onVis);
        window.removeEventListener('resize', onResize);
      },
    };
    JK.active = api;
    return api;
  };
})();
</script>
<script>/* Java-Kurs – die ganze Kursseite: Navigation, gemeinsamer Speicher (Account über db, sonst Browser),
 * Startseite mit Lernpfad und Ziel, Lektionen, Challenges, Notenbuch und Spielplatz. */
(function () {
  'use strict';
  const JK = window.JK, C = window.COURSE;
  const { $, $$, esc, md, toast, GRADE_WORD, fmtTime } = JK.util;
  const LESSONS = C.lessons, CHAL = C.challenges;

  // ------------------------------------------------------------------ Zustand
  const KEY = 'javakurs:kurs';
  const S = { v: 1, lessons: {}, quizzes: {}, tasks: {}, openTask: null, last: null };
  try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) { /* kein Speicher */ }
  const store = { ref: null, writing: false, dirty: false, mode: 'local', note: 'Fortschritt wird nur in diesem Browser gespeichert.' };
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* egal */ }
    if (!store.ref) return;
    if (store.writing) { store.dirty = true; return; }
    store.writing = true;
    store.ref.set(JSON.parse(JSON.stringify(S))).catch(() => {}).finally(() => { store.writing = false; if (store.dirty) { store.dirty = false; persist(); } });
  }
  function merge(remote) {
    const before = JSON.stringify([S.tasks, S.quizzes, S.openTask, S.lessons]);
    S.tasks = Object.assign({}, remote.tasks || {}, S.tasks);
    S.quizzes = Object.assign({}, remote.quizzes || {}, S.quizzes);
    for (const [id, l] of Object.entries(remote.lessons || {})) { const mine = S.lessons[id] || (S.lessons[id] = { t: 0, done: false }); mine.t = Math.max(mine.t || 0, l.t || 0); mine.done = mine.done || !!l.done; }
    if (remote.openTask && !S.tasks[remote.openTask.id]) S.openTask = remote.openTask;
    if (S.openTask && S.tasks[S.openTask.id]) S.openTask = null;
    if (!S.last && remote.last) S.last = remote.last;
    return JSON.stringify([S.tasks, S.quizzes, S.openTask, S.lessons]) !== before;
  }
  async function initStore() {
    if (!window.claude || !window.claude.use) return;
    try {
      const user = await window.claude.use('user');
      const uid = user ? await user.id() : null;
      const db = uid ? await window.claude.use('db') : null;
      if (!db || !uid) return;
      store.ref = db.doc('data/users/' + uid + '/kurs'); store.mode = 'db';
      const timer = setTimeout(() => setNote('Dein Fortschritt kann gerade nicht geladen werden – er wird nachgeholt, sobald die Verbindung steht.'), 10000);
      let first = true;
      store.ref.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (snap.metadata.hasPendingWrites) return;
        let changed = false;
        if (snap.exists) changed = merge(snap.data());
        if (first) { first = false; persist(); }
        setNote('Fortschritt und Noten werden in deinem Account gespeichert – auf allen Geräten gleich.');
        if (changed) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* egal */ } refresh(); }
      }, () => { clearTimeout(timer); setNote('Fortschritt wird nur in diesem Browser gespeichert.'); });
    } catch (e) { /* lokal weiter */ }
  }
  function setNote(t) { store.note = t; $$('.store-note').forEach(el => (el.textContent = t)); }

  const ctx = {
    state: S, persist, count: LESSONS.length,
    ls: id => S.lessons[id] || (S.lessons[id] = { t: 0, done: false }),
    navigate: h => { if (location.hash === h) route(); else location.hash = h; },
    onChange: () => renderNav(),
  };

  // ------------------------------------------------------------------ Hilfen
  const allTasks = () => LESSONS.flatMap(L => JK.buildTimeline(L).steps.filter(s => s.task).map(s => ({ task: s.task, lesson: L })));
  const subOf = id => S.tasks[id] && S.tasks[id].result ? S.tasks[id] : null;
  const avgOf = ids => { const g = ids.map(subOf).filter(Boolean).map(s => s.result.note); return g.length ? g.reduce((a, b) => a + b, 0) / g.length : null; };
  const fmtAvg = a => a == null ? '–' : a.toFixed(1).replace('.', ',');
  function lessonProgress(L) {
    const { TOTAL } = JK.buildTimeline(L), ls = S.lessons[L.id];
    if (!ls) return 0;
    return ls.done ? 1 : Math.min(1, (ls.t || 0) / TOTAL);
  }

  // ------------------------------------------------------------------ Navigation
  const nav = $('#nav'), view = $('#view'), banner = $('#lockbar');
  function renderNav() {
    const h = location.hash || '#start';
    const tasks = allTasks().map(x => x.task.id).concat(CHAL.map(c => c.id));
    const avg = avgOf(tasks);
    nav.innerHTML = `
      <a class="brand" href="#start">☕ Java-Kurs</a>
      <div class="navlinks" role="list">
        <a role="listitem" href="#start" class="${h === '#start' ? 'on' : ''}">Start</a>
        ${LESSONS.map(L => { const p = lessonProgress(L); return `<a role="listitem" href="#lektion-${L.nr}" class="lpill ${h === '#lektion-' + L.nr ? 'on' : ''} ${p >= 1 ? 'done' : ''}" title="Lektion ${L.nr}: ${esc(L.title)}">${p >= 1 ? '✓' : L.nr}</a>`; }).join('')}
        <a role="listitem" href="#challenges" class="${/^#challenge/.test(h) ? 'on' : ''}">Challenges</a>
        <a role="listitem" href="#noten" class="${h === '#noten' ? 'on' : ''}">Notenbuch <b class="avgchip">${fmtAvg(avg)}</b></a>
        <a role="listitem" href="#spielplatz" class="${h === '#spielplatz' ? 'on' : ''}">Spielplatz</a>
      </div>`;
    const ot = S.openTask;
    banner.hidden = !ot || h === '#lektion-' + (ot && ot.nr);
    if (ot) banner.innerHTML = `<span>🔒 <b>Aufgabe offen:</b> „${esc(ot.title)}“ in Lektion ${ot.nr}. Alle Videos sind gesperrt, bis du abgibst.</span><a class="btn primary" href="#lektion-${ot.nr}">Zur Aufgabe</a>`;
  }

  // ------------------------------------------------------------------ Ansichten
  let active = null;
  function route() {
    if (active && active.destroy) active.destroy();
    active = null;
    const h = (location.hash || '#start').slice(1);
    let m;
    view.innerHTML = '';
    window.scrollTo(0, 0);
    if ((m = /^lektion-(\d+)$/.exec(h)) && LESSONS[Number(m[1]) - 1]) {
      const i = Number(m[1]) - 1, L = LESSONS[i];
      active = JK.mountLesson(view, L, Object.assign({}, ctx, { prevHash: i > 0 ? '#lektion-' + i : null, nextHash: i < LESSONS.length - 1 ? '#lektion-' + (i + 2) : null }));
      persist();
    } else if (h === 'noten') active = viewGrades();
    else if (h === 'challenges') active = viewChallenges();
    else if ((m = /^challenge-(c\d+)$/.exec(h)) && CHAL.find(c => c.id === m[1])) active = viewChallenge(CHAL.find(c => c.id === m[1]));
    else if (h === 'spielplatz') active = viewPlayground();
    else active = viewHome();
    renderNav();
  }
  function refresh() { renderNav(); if (active && active.refresh) active.refresh(); else if (!active || !active.player) route(); }

  // Startseite
  function viewHome() {
    const tasks = allTasks();
    const doneT = tasks.filter(x => subOf(x.task.id)).length, doneC = CHAL.filter(c => subOf(c.id)).length;
    const avg = avgOf(tasks.map(x => x.task.id).concat(CHAL.map(c => c.id)));
    const next = LESSONS.find(L => lessonProgress(L) < 1) || LESSONS[LESSONS.length - 1];
    const nextLs = S.lessons[next.id];
    view.innerHTML = `
      <header class="hero home">
        <div>
          <div class="kick">Java-Kurs · ${LESSONS.length} von ${C.plan.length} Lektionen verfügbar</div>
          <h1>Java lernen – Schritt für Schritt</h1>
          <p class="lead">Animierte Lektionen ohne Stimme, Java direkt im Browser und echte Aufgaben mit Noten von 1 bis 5. Ist eine Aufgabe offen, sind alle Videos gesperrt, bis du abgibst.</p>
          <div class="row"><a class="btn primary" href="#lektion-${next.nr}">${nextLs && nextLs.t > 1 ? `Weitermachen: Lektion ${next.nr} (bei ${fmtTime(nextLs.t)})` : `Starten: Lektion ${next.nr}`} →</a><a class="btn ghost" href="#challenges">Challenges</a></div>
        </div>
        <div class="stats">
          <div class="stat"><b>${LESSONS.filter(L => lessonProgress(L) >= 1).length}/${LESSONS.length}</b><span>Lektionen fertig</span></div>
          <div class="stat"><b>${doneT}/${tasks.length}</b><span>Aufgaben abgegeben</span></div>
          <div class="stat"><b>${doneC}/${CHAL.length}</b><span>Challenges gelöst</span></div>
          <div class="stat accent"><b>${fmtAvg(avg)}</b><span>Notenschnitt</span></div>
        </div>
      </header>
      <section class="path"><h2>Dein Lernpfad</h2>
        ${LESSONS.map(L => {
          const p = lessonProgress(L), ts = JK.buildTimeline(L).steps.filter(s => s.task).map(s => s.task);
          return `<a class="lesson" href="#lektion-${L.nr}"><div class="num ${p >= 1 ? 'ok' : ''}">${p >= 1 ? '✓' : L.nr}</div>
            <div><h3>${md(L.title)}</h3><p>${md(L.sub)}</p>
              <div class="bar" aria-label="Fortschritt ${Math.round(p * 100)} %"><i style="width:${Math.round(p * 100)}%"></i></div>
              <div class="tags">${ts.map(t => { const s = subOf(t.id); return `<span class="tag ${s ? 'g' + s.result.note : ''}">${esc(t.title)}: ${s ? s.result.note : 'offen'}</span>`; }).join('')}</div></div>
            <span class="go">${p >= 1 ? 'Wiederholen' : p > 0 ? 'Weiter' : 'Starten'} →</span></a>`;
        }).join('')}
        <a class="lesson chal" href="#challenges"><div class="num">★</div><div><h3>Transfer-Challenges</h3><p>${CHAL.length} Aufgaben, die so nie im Video vorkamen – lösbar mit dem, was du kannst.</p></div><span class="go">Los →</span></a>
        ${C.plan.slice(LESSONS.length).map(p => `<div class="lesson soon" aria-disabled="true"><div class="num">${p.nr}</div><div><h3>${esc(p.title)}</h3><p>${esc(p.what)}</p></div><span class="go muted">kommt noch</span></div>`).join('')}
      </section>
      <section class="goal">
        <h2>Das Ziel des Kurses</h2>
        <p>${md(C.goal)}</p>
        <div class="goalgrid">${C.canDo.map(x => `<div class="gcard"><b>${esc(x.h)}</b><span>${md(x.p)}</span></div>`).join('')}</div>
      </section>
      <section class="how"><h2>So läuft eine Lektion</h2>
        <ol>
          <li><span class="step">Schritt 1</span><b>Video ansehen</b><span>Code tippt sich selbst, Erklärtexte, Schaubilder. Pausieren und Tempo wählen geht jederzeit.</span></li>
          <li><span class="step">Schritt 2</span><b>Kurz-Checks</b><span>Zwischendurch kleine Quizfragen – nicht benotet, nur zum Merken.</span></li>
          <li><span class="step">Schritt 3</span><b>Aufgabe lösen</b><span>Alle Videos sperren sich. Du programmierst, testest mit „Ausführen“ und gibst ab.</span></li>
          <li><span class="step">Schritt 4</span><b>Note bekommen</b><span>Claude bewertet nach österreichischem System (1–5) mit Lob und Tipps.</span></li>
        </ol>
        <p class="muted small">Notengrenzen: ab 90 Punkten 1 · ab 78 → 2 · ab 64 → 3 · ab 50 → 4 · darunter 5. <span class="store-note">${esc(store.note)}</span></p>
      </section>`;
    return {};
  }

  // Notenbuch
  function viewGrades() {
    const rows = allTasks().map(x => ({ id: x.task.id, task: x.task, where: `Lektion ${x.lesson.nr}`, href: '#lektion-' + x.lesson.nr })).concat(CHAL.map(c => ({ id: c.id, task: c, where: 'Challenge', href: '#challenge-' + c.id })));
    const avgL = avgOf(rows.filter(r => r.where !== 'Challenge').map(r => r.id)), avgC = avgOf(CHAL.map(c => c.id)), avgAll = avgOf(rows.map(r => r.id));
    const locked = !!S.openTask;
    view.innerHTML = `
      <header class="lhead"><h1>Notenbuch</h1><p class="lead">Alle Abgaben aus Lektionen und Challenges an einem Ort. <span class="store-note">${esc(store.note)}</span></p></header>
      <div class="stats wide">
        <div class="stat accent"><b>${fmtAvg(avgAll)}</b><span>Gesamtschnitt</span></div>
        <div class="stat"><b>${fmtAvg(avgL)}</b><span>Schnitt Lektionen</span></div>
        <div class="stat"><b>${fmtAvg(avgC)}</b><span>Schnitt Challenges</span></div>
        <div class="stat"><b>${rows.filter(r => subOf(r.id)).length}/${rows.length}</b><span>abgegeben</span></div>
      </div>
      <div class="gbook">${rows.map(r => {
        const s = subOf(r.id);
        return `<details class="grow-row ${s ? 'g' + s.result.note : 'open'}" ${s ? '' : 'data-empty'}><summary><span class="gr-num">${s ? s.result.note : '–'}</span><span class="gtitle"><b>${md(r.task.title)}</b><span class="muted">${r.where}${s ? ' · ' + GRADE_WORD[s.result.note] + ' · ' + s.result.punkte + ' Punkte · ' + new Date(s.at).toLocaleDateString('de-AT') : ' · noch nicht abgegeben'}</span></span><a class="btn ghost small" href="${r.href}">${s ? 'Ansehen' : 'Zur Aufgabe'}</a></summary>
          ${s ? `<div class="gdetail">${JK.resultHTML(r.task, s, { hideSolution: locked })}${locked ? '' : `<h4>Deine Abgabe</h4><pre class="vcode">${JK.util.hlJava(s.code)}</pre>`}</div>` : ''}</details>`;
      }).join('')}</div>`;
    $$('details[data-empty] summary', view).forEach(sm => sm.addEventListener('click', e => { if (!e.target.closest('a')) e.preventDefault(); }));
    return { refresh: () => route() };
  }

  // Challenges
  function viewChallenges() {
    view.innerHTML = `
      <header class="lhead"><div class="crumbs"><span>Transfer-Challenges</span></div><h1>Kannst du’s auch anders?</h1>
        <p class="lead">Diese Aufgaben kamen so in keinem Video vor. Du hast aber alle Werkzeuge dafür – du musst sie nur neu kombinieren. Wenn du feststeckst, sagt dir jede Challenge, wo du nachschauen kannst.</p></header>
      <div class="chal-list">${CHAL.map(c => { const s = subOf(c.id); return `<a class="chal-card" href="#challenge-${c.id}"><div class="chal-top"><span class="lvl">${esc(c.level)}</span>${s ? `<span class="gpill g${s.result.note}">Note ${s.result.note}</span>` : ''}</div><h3>${md(c.title)}</h3><p>${md(c.teaser)}</p><div class="tags">${c.uses.map(u => `<span class="tag">${esc(u)}</span>`).join('')}</div></a>`; }).join('')}</div>`;
    return { refresh: () => route() };
  }
  function viewChallenge(c) {
    const i = CHAL.indexOf(c);
    view.innerHTML = `<div class="crumbs"><a href="#challenges">← Alle Challenges</a><span>Challenge ${i + 1} von ${CHAL.length}</span></div><section id="task" class="task"></section>
      <nav class="lnav">${i > 0 ? `<a class="btn ghost" href="#challenge-${CHAL[i - 1].id}">← ${esc(CHAL[i - 1].title)}</a>` : '<span></span>'}${i < CHAL.length - 1 ? `<a class="btn ghost" href="#challenge-${CHAL[i + 1].id}">${esc(CHAL[i + 1].title)} →</a>` : '<a class="btn ghost" href="#noten">Zum Notenbuch →</a>'}</nav>`;
    const panel = JK.taskPanel($('#task', view), c, ctx, {
      kicker: `Transfer-Challenge ${i + 1} · ${c.level}`,
      note: 'Kein Video, keine Sperre: Hier zeigst du, dass du das Gelernte neu kombinieren kannst. Auch diese Aufgabe wird benotet und landet im Notenbuch.',
      where: 'Transfer-Challenge nach Lektion 1–5 (Aufgabe so nie gezeigt, nur mit bekannten Mitteln lösbar)',
      continueLabel: i < CHAL.length - 1 ? 'Nächste Challenge →' : 'Zum Notenbuch →',
      onSubmitted: () => renderNav(),
      onContinue: () => ctx.navigate(i < CHAL.length - 1 ? '#challenge-' + CHAL[i + 1].id : '#noten'),
    });
    return { destroy: () => panel.destroy(), refresh: () => {} };
  }

  // Spielplatz
  function viewPlayground() {
    view.innerHTML = `<header class="lhead"><h1>Spielplatz</h1><p class="lead">Hier kannst du jederzeit Java ausprobieren – auch während eine Aufgabe offen ist. Dein Code bleibt in diesem Browser gespeichert.</p></header>
      <section class="card playground"><div id="pg-ed"></div><div class="task-btns"><button id="pg-run" class="btn">▶ Ausführen</button><button id="pg-stop" class="btn ghost" disabled>■ Stopp</button></div>
      <div class="task-con"><div class="pane-head">Konsole</div><div id="pg-con" class="con-live" role="log"><div class="cl"><span class="k-meta">Drück ▶ Ausführen.</span></div></div></div></section>`;
    let saved = C.playground;
    try { saved = localStorage.getItem('javakurs:playground') || saved; } catch (e) { /* egal */ }
    const ed = JK.makeEditor($('#pg-ed'), saved, v => { try { localStorage.setItem('javakurs:playground', v); } catch (e) { /* egal */ } });
    const runner = JK.makeRunner($('#pg-con'), () => ed.get(), { onState: on => { $('#pg-run').disabled = on; $('#pg-stop').disabled = !on; } });
    $('#pg-run').onclick = () => runner.start();
    $('#pg-stop').onclick = () => runner.stop();
    return { destroy: () => runner.stop() };
  }

  window.addEventListener('hashchange', route);
  route();
  initStore();
  JK.course = { S, route, persist };
})();
</script>
