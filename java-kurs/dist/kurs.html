 anzahl = sc.nextInt();\n        // Wuerfel w = new Wuerfel(seiten, 42);\n    }\n}\n","solution":"import java.util.Random;\nimport java.util.Scanner;\n\nclass Wuerfel {\n    int seiten;\n    Random zufall;\n\n    Wuerfel(int seiten, long seed) {\n        this.seiten = seiten;\n        this.zufall = new Random(seed);\n    }\n\n    int wuerfeln() {\n        return zufall.nextInt(seiten) + 1;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Seiten: \");\n        int seiten = sc.nextInt();\n        System.out.print(\"Würfe: \");\n        int anzahl = sc.nextInt();\n        Wuerfel w = new Wuerfel(seiten, 42);\n        int summe = 0, max = 0;\n        for (int i = 0; i < anzahl; i++) {\n            int wurf = w.wuerfeln();\n            System.out.print(wurf + \" \");\n            summe += wurf;\n            if (wurf > max) max = wurf;\n        }\n        System.out.println();\n        System.out.println(\"Summe: \" + summe);\n        System.out.println(\"Größter Wurf: \" + max);\n    }\n}\n","tests":[{"name":"W6, 5 Würfe","input":["6","5"],"expect":[{"re":"summe:?\\s*12\\b","label":"Summe 12 (Seed 42)"},{"re":"gr(ö|oe)(ß|ss)te[rn]?\\s*wurf:?\\s*4\\b","label":"größter Wurf 4"}]},{"name":"W20, 3 Würfe","input":["20","3"],"expect":[{"re":"summe:?\\s*24\\b","label":"Summe 24 (Seed 42)"},{"re":"wurf:?\\s*11\\b","label":"größter Wurf 11"}]}],"codeChecks":[{"label":"Klasse Wuerfel","re":"class\\s+Wuerfel"},{"label":"Konstruktor (int, long)","re":"Wuerfel\\s*\\(\\s*int\\s+\\w+\\s*,\\s*long\\s+\\w+\\s*\\)"},{"label":"Methode wuerfeln()","re":"int\\s+wuerfeln\\s*\\(\\s*\\)"},{"label":"new Random(seed)","re":"new\\s+Random\\s*\\(\\s*\\w+\\s*\\)"}],"rubric":[["Programm kompiliert und läuft",15],["Klasse Wuerfel mit Konstruktor und Random-Feld",30],["wuerfeln liefert 1 bis seiten",20],["Schleife, Summe und Maximum richtig",25],["Saubere Ausgabe",10]],"tip":"Das `Random`-Objekt ist selbst ein Feld deines Würfels. Erzeuge es im Konstruktor, nicht in `wuerfeln()` – sonst kommt mit demselben Seed immer dieselbe Zahl."}},{"layout":"code","console":"clear","code":"import java.util.Random;\n\nclass Wuerfel {\n    int seiten;\n    Random zufall;\n\n    Wuerfel(int seiten, long seed) {\n        this.seiten = seiten;\n        this.zufall = new Random(seed);\n    }\n\n    int wuerfeln() {\n        return zufall.nextInt(seiten) + 1;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Wuerfel w6 = new Wuerfel(6, 42);\n        Wuerfel w20 = new Wuerfel(20, 7);\n        System.out.println(w6.wuerfeln() + \" und \" + w20.wuerfeln());\n    }\n}\n","run":true,"say":"Abgegeben! Und jetzt siehst du die Stärke von Objekten: Ein W6 und ein W20 aus demselben Bauplan, jeder mit eigenen Seiten und eigenem Zufall."},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["Klassen als **Bauplan** schreiben","Objekte mit `new` erzeugen","Konstruktoren und `this` verwenden","Methoden ohne `static` – sie gehören zum Objekt","`toString`, Referenzen und `null` verstehen"],"gap":0.7},"say":"Das war Lektion 8! Du denkst jetzt in Objekten. In Lektion 9 lernst du, viele Objekte in einer Liste zu verwalten – und wie man sie vor falschen Werten schützt."}]}]},{"id":"java-09","nr":9,"title":"ArrayList & Kapselung","sub":"Listen, die wachsen und schrumpfen – und Objekte, die ihre Daten selbst beschützen.","outro":"Listen von Objekten sind das Rückgrat jedes Spiels: alle Gegner, alle Münzen, alle Spieler im Rennen. Und mit private und Gettern bleiben deine Objekte immer in einem gültigen Zustand. In Lektion 10 geht es um Vererbung.","chapters":[{"title":"Listen statt Arrays","steps":[{"t":"Lektion 9","h":"ArrayList & Kapselung","sub":"Flexible Listen und sichere Objekte","say":"Servus! Arrays haben einen Haken: Ihre Größe steht fest. In einem Spiel kommen aber ständig Münzen dazu und Gegner verschwinden. Dafür gibt es die **ArrayList**."},{"layout":"split","visual":{"kind":"compare","left":{"title":"Array","code":"String[] items = new String[3];\nitems[0] = \"Schwert\";\n// Platz 4? Geht nicht!","note":"feste Größe"},"right":{"title":"ArrayList","code":"ArrayList<String> items = new ArrayList<>();\nitems.add(\"Schwert\");\nitems.add(\"Schild\"); // wächst mit","note":"wächst und schrumpft","cls":"good"}},"say":"Ein Array ist wie ein Eierkarton mit fester Anzahl Plätze. Eine ArrayList ist wie ein Rucksack: Du kannst jederzeit etwas hineingeben oder herausnehmen."},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<String> items = new ArrayList<>();\n        items.add(\"Schwert\");\n        items.add(\"Schild\");\n        items.add(\"Trank\");\n        System.out.println(items);\n        System.out.println(items.size());\n        System.out.println(items.get(1));\n    }\n}\n","hl":[1,4],"say":"Die ArrayList musst du importieren. In spitzen Klammern steht, was hineinkommt – hier Strings. Mit `add` fügst du hinten etwas an."},{"run":true,"hl":[7,9],"say":"Mit `println` siehst du die ganze Liste in eckigen Klammern. `size()` ist die Anzahl, `get(1)` holt das Element an Index 1 – wieder zählt man ab 0."}]},{"title":"Ändern, Entfernen, Durchlaufen","steps":[{"t":"Kapitel 2","h":"Die wichtigsten Befehle","sub":"add, set, remove, contains","after":"code"},{"layout":"split","visual":{"kind":"table","title":"ArrayList-Befehle","head":["Befehl","macht"],"rows":[["`add(x)`","hinten anfügen"],["`add(i, x)`","an Stelle i einfügen"],["`get(i)`","Element an Stelle i"],["`set(i, x)`","Stelle i ersetzen"],["`remove(i)` / `remove(x)`","entfernen"],["`contains(x)`","ist x drin?"],["`size()`","Anzahl"]],"gap":0.5},"code":"import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<String> items = new ArrayList<>();\n        items.add(\"Schwert\");\n        items.add(\"Trank\");\n        items.add(0, \"Karte\");\n        items.set(2, \"Supertrank\");\n        items.remove(\"Schwert\");\n        System.out.println(items);\n        System.out.println(items.contains(\"Karte\"));\n    }\n}\n","console":"clear","say":"Hier die wichtigsten Befehle auf einen Blick. Schauen wir, was mit der Liste passiert."},{"run":true,"say":"Karte kam vorne dazu, der Trank wurde zum Supertrank, das Schwert ist weg. Beim Entfernen rücken alle Elemente dahinter automatisch nach."},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Integer> punkte = new ArrayList<>();\n        punkte.add(120);\n        punkte.add(80);\n        punkte.add(200);\n        int summe = 0;\n        for (int p : punkte) {\n            summe += p;\n        }\n        System.out.println(\"Summe: \" + summe);\n    }\n}\n","hl":[2,2],"say":"Für Zahlen schreibst du `Integer` statt `int` in die spitzen Klammern – das ist die Objekt-Version von int. Für double nimmst du `Double`. Durchlaufen geht wie beim Array mit der for-each-Schleife."},{"run":true,"say":"Summe 400. Java packt die Zahlen automatisch ein und aus, du merkst davon kaum etwas."},{"quiz":{"id":"l9-q1","q":"Eine Liste ist [A, B, C]. Was ist sie nach `remove(0)`?","options":["[A, B]","[B, C]","[null, B, C]","[A, C]"],"correct":1,"explain":"remove(0) entfernt das Element an Index 0, die anderen rücken nach vorne."}}]},{"title":"Aufgabe: Inventar","steps":[{"t":"Aufgabe 1","h":"Inventar","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 1: Inventar mit Befehlen","items":["Lies so lange Befehle ein, bis „ende“ kommt","`nimm X` – X ins Inventar (höchstens 5 Dinge!)","`wirf X` – X entfernen (oder Meldung, falls nicht da)","`zeige` – Inventar ausgeben"],"gap":0.9},"say":"Deine Aufgabe: ein Inventar, wie in einem Abenteuerspiel. Es wird über Text-Befehle gesteuert."},{"task":{"id":"l9-inventar","nr":1,"title":"Inventar mit Befehlen","text":["Lies in einer Schleife Zeilen mit `nextLine()` ein, bis „ende“ eingegeben wird. Befehle:","`nimm Name` fügt einen Gegenstand hinzu – ist das Inventar schon voll (5 Dinge), gib „Inventar voll!“ aus. `wirf Name` entfernt ihn – gibt es ihn nicht, gib „Hast du nicht.“ aus. `zeige` gibt das Inventar und die Anzahl aus."],"req":["`ArrayList<String>` als Inventar","Schleife bis „ende“","Befehle mit `startsWith` / `substring` (oder `split`) erkennen","Grenze 5 und Meldung „Hast du nicht.“"],"example":"> nimm Schwert\n> nimm Trank\n> wirf Schild\nHast du nicht.\n> zeige\n[Schwert, Trank] (2/5)\n> ende","starter":"import java.util.ArrayList;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<String> inventar = new ArrayList<>();\n        // Befehle lesen, bis \"ende\"\n    }\n}\n","solution":"import java.util.ArrayList;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<String> inventar = new ArrayList<>();\n        while (true) {\n            System.out.print(\"> \");\n            String zeile = sc.nextLine();\n            if (zeile.equals(\"ende\")) {\n                break;\n            } else if (zeile.startsWith(\"nimm \")) {\n                if (inventar.size() >= 5) {\n                    System.out.println(\"Inventar voll!\");\n                } else {\n                    inventar.add(zeile.substring(5));\n                }\n            } else if (zeile.startsWith(\"wirf \")) {\n                if (!inventar.remove(zeile.substring(5))) {\n                    System.out.println(\"Hast du nicht.\");\n                }\n            } else if (zeile.equals(\"zeige\")) {\n                System.out.println(inventar + \" (\" + inventar.size() + \"/5)\");\n            } else {\n                System.out.println(\"Unbekannter Befehl\");\n            }\n        }\n    }\n}\n","tests":[{"name":"nimm, wirf, zeige","input":["nimm Schwert","nimm Trank","nimm Karte","wirf Trank","wirf Schild","zeige","ende"],"expect":[{"re":"schwert[^\\n]*karte","label":"zeige: Schwert und Karte"},{"re":"\\[[^\\]]*trank","label":"Trank wurde entfernt","not":true},{"re":"hast du nicht","label":"„Hast du nicht.“"}]},{"name":"voll","input":["nimm A","nimm B","nimm C","nimm D","nimm E","nimm F","zeige","ende"],"expect":[{"re":"voll","label":"„Inventar voll!“"},{"re":"\\bF\\b","label":"F nicht im Inventar","not":true,"flags":""}]}],"codeChecks":[{"label":"ArrayList<String>","re":"ArrayList\\s*<\\s*String\\s*>"},{"label":"Schleife","re":"\\bwhile\\b|\\bfor\\b|\\bdo\\b"},{"label":"equals statt == für Befehle","re":"\\.equals(IgnoreCase)?\\s*\\("}],"rubric":[["Programm kompiliert und läuft",15],["Schleife bis „ende“",15],["nimm mit Grenze 5",25],["wirf mit Meldung",25],["zeige mit Anzahl",20]],"tip":"`\"nimm Schwert\".substring(5)` ist „Schwert“. Und `remove(text)` gibt true oder false zurück – damit weißt du sofort, ob es den Gegenstand gab."}},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<String> inventar = new ArrayList<>();\n        inventar.add(\"Schwert\");\n        String befehl = \"wirf Schild\";\n        if (!inventar.remove(befehl.substring(5))) {\n            System.out.println(\"Hast du nicht.\");\n        }\n    }\n}\n","run":true,"hl":[5,7],"say":"Abgegeben! Ein schöner Trick aus der Lösung: `remove` meldet zurück, ob es geklappt hat. So brauchst du kein extra `contains`."}]},{"title":"Listen von Objekten","steps":[{"t":"Kapitel 4","h":"Listen von Objekten","sub":"Alle Gegner in einer Liste","after":"code"},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\nclass Muenze {\n    int x;\n    boolean gesammelt;\n\n    Muenze(int x) {\n        this.x = x;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Muenze> muenzen = new ArrayList<>();\n        for (int i = 1; i <= 5; i++) {\n            muenzen.add(new Muenze(i * 10));\n        }\n        int spielerX = 30;\n        for (Muenze m : muenzen) {\n            if (m.x == spielerX) {\n                m.gesammelt = true;\n            }\n        }\n        for (Muenze m : muenzen) {\n            System.out.print(m.gesammelt ? \"x \" : \"o \");\n        }\n    }\n}\n","hl":[11,14],"say":"Jetzt kommt alles zusammen: Eine Liste aus **eigenen Objekten**. Hier legen wir fünf Münzen an verschiedene Positionen."},{"run":true,"hl":[16,20],"say":"Der Spieler steht bei x = 30 und sammelt genau diese Münze ein. Genau so wird unser Spiel später jedes Bild prüfen: Für jede Münze – berührt der Spieler sie?"},{"code":"import java.util.ArrayList;\n\nclass Muenze {\n    int x;\n    boolean gesammelt;\n\n    Muenze(int x) {\n        this.x = x;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Muenze> muenzen = new ArrayList<>();\n        for (int i = 1; i <= 5; i++) {\n            muenzen.add(new Muenze(i * 10));\n        }\n        for (int i = muenzen.size() - 1; i >= 0; i--) {\n            if (muenzen.get(i).x <= 20) {\n                muenzen.remove(i);\n            }\n        }\n        System.out.println(\"Übrig: \" + muenzen.size());\n    }\n}\n","console":"clear","hl":[14,18],"say":"Wichtig beim Entfernen während des Durchlaufens: Geh die Liste **von hinten** durch. Sonst rücken Elemente nach und du überspringst welche. In einer for-each-Schleife darfst du gar nichts entfernen."},{"run":true,"say":"Zwei Münzen entfernt, drei übrig. Merk dir: Entfernen in einer Schleife – immer rückwärts."}]},{"title":"Kapselung","steps":[{"t":"Kapitel 5","h":"Kapselung","sub":"private, Getter und Setter","after":"code"},{"layout":"code","console":"clear","code":"class Spieler {\n    String name;\n    int leben;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Spieler s = new Spieler();\n        s.name = \"Mia\";\n        s.leben = -50;\n        System.out.println(s.name + \" hat \" + s.leben + \" Leben\");\n    }\n}\n","hl":[9,9],"say":"Ein Problem: Jeder kann die Felder einfach ändern – auch auf völlig unsinnige Werte wie minus 50 Leben. Bei großen Programmen passiert das schneller, als man denkt."},{"run":true,"say":"Minus 50 Leben. Das sollte nie passieren dürfen. Die Lösung heißt **Kapselung**: Das Objekt passt selbst auf seine Daten auf."},{"code":"class Spieler {\n    private String name;\n    private int leben;\n\n    Spieler(String name) {\n        this.name = name;\n        this.leben = 3;\n    }\n\n    public int getLeben() {\n        return leben;\n    }\n\n    public void setLeben(int leben) {\n        if (leben >= 0 && leben <= 9) {\n            this.leben = leben;\n        }\n    }\n\n    public String getName() {\n        return name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Spieler s = new Spieler(\"Mia\");\n        s.setLeben(-50);\n        System.out.println(s.getName() + \" hat \" + s.getLeben() + \" Leben\");\n        s.setLeben(5);\n        System.out.println(s.getName() + \" hat \" + s.getLeben() + \" Leben\");\n    }\n}\n","console":"clear","hl":[2,3],"say":"Mit `private` sind die Felder von außen unsichtbar. Nur Code **in der Klasse** darf sie anfassen."},{"hl":[10,18],"say":"Zum Lesen gibt es einen **Getter**, zum Ändern einen **Setter**. Der Setter kann prüfen, ob der neue Wert erlaubt ist – unsinnige Werte werden einfach ignoriert."},{"run":true,"say":"Die minus 50 wurden abgewiesen, die 5 angenommen. Probier mal im Code `s.leben = 7;` in main – dann meldet Java einen Fehler, weil das Feld private ist."},{"quiz":{"id":"l9-q2","q":"Warum macht man Felder `private`?","options":["Damit das Programm schneller läuft","Damit nur die Klasse selbst sie ändern kann und ungültige Werte verhindert","Damit man sie nicht ausgeben kann","Weil Java das verlangt"],"correct":1,"explain":"Kapselung schützt das Objekt: Änderungen gehen nur über Methoden, die prüfen können."}}]},{"title":"Aufgabe: Bestenliste","steps":[{"t":"Aufgabe 2","h":"Bestenliste","sub":"Objekte, Liste, Kapselung","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 2: Bestenliste","items":["Klasse `Eintrag` mit **private** `name` und `zeit` (Sekunden, double) + Gettern","Lies Einträge „Name Zeit“ ein, bis „fertig“","Gib alle Einträge aus und dann den **Schnellsten**","Bonus: ungültige Zeiten (≤ 0) ablehnen"],"gap":0.9},"say":"Zweite Aufgabe – und die passt perfekt zu unserem Rennspiel: eine Bestenliste mit Laufzeiten."},{"task":{"id":"l9-bestenliste","nr":2,"title":"Bestenliste","text":["Schreib eine Klasse `Eintrag` mit den private-Feldern `name` (String) und `zeit` (double, in Sekunden), einem Konstruktor und den Gettern `getName()` und `getZeit()`.","In main liest du Zeilen wie „Mia 42.5“ ein, bis „fertig“ kommt. Zerlege jede Zeile mit `split(\" \")` und `Double.parseDouble`. Zeiten ≤ 0 lehnst du mit „Ungültige Zeit“ ab.","Am Ende gibst du alle Einträge aus und dann „Schnellste: Name (Zeit s)“."],"req":["Klasse `Eintrag` mit private-Feldern und Gettern","`ArrayList<Eintrag>`","Zeilen mit `split` zerlegen","Ungültige Zeiten ablehnen","Den schnellsten Eintrag finden und ausgeben"],"example":"Mia 42.5\nTom 39.8\nLea -3\nUngültige Zeit\nfertig\nMia: 42.5 s\nTom: 39.8 s\nSchnellste: Tom (39.8 s)","starter":"import java.util.ArrayList;\nimport java.util.Scanner;\n\nclass Eintrag {\n    // private Felder, Konstruktor, Getter\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<Eintrag> liste = new ArrayList<>();\n        // Zeilen lesen bis \"fertig\"\n    }\n}\n","solution":"import java.util.ArrayList;\nimport java.util.Scanner;\n\nclass Eintrag {\n    private String name;\n    private double zeit;\n\n    Eintrag(String name, double zeit) {\n        this.name = name;\n        this.zeit = zeit;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public double getZeit() {\n        return zeit;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<Eintrag> liste = new ArrayList<>();\n        while (true) {\n            String zeile = sc.nextLine();\n            if (zeile.equals(\"fertig\")) break;\n            String[] teile = zeile.split(\" \");\n            double zeit = Double.parseDouble(teile[1]);\n            if (zeit <= 0) {\n                System.out.println(\"Ungültige Zeit\");\n            } else {\n                liste.add(new Eintrag(teile[0], zeit));\n            }\n        }\n        Eintrag beste = null;\n        for (Eintrag e : liste) {\n            System.out.println(e.getName() + \": \" + e.getZeit() + \" s\");\n            if (beste == null || e.getZeit() < beste.getZeit()) {\n                beste = e;\n            }\n        }\n        if (beste != null) {\n            System.out.println(\"Schnellste: \" + beste.getName() + \" (\" + beste.getZeit() + \" s)\");\n        }\n    }\n}\n","tests":[{"name":"drei Läufer","input":["Mia 42.5","Tom 39.8","Lea 44.0","fertig"],"expect":[{"re":"schnellste[^\\n]*tom","label":"Schnellste: Tom"},{"re":"39[.,]8","label":"Zeit 39.8"},{"re":"mia[^\\n]*42[.,]5","label":"Mia wird aufgelistet"}]},{"name":"ungültig","input":["Ben 50","Ida -1","Max 0","fertig"],"expect":[{"re":"ung(ü|ue)ltig","label":"„Ungültige Zeit“"},{"re":"schnellste[^\\n]*ben","label":"Schnellste: Ben"},{"re":"schnellste[^\\n]*(ida|max)","label":"ungültige Zeiten zählen nicht","not":true}]}],"codeChecks":[{"label":"Klasse Eintrag","re":"class\\s+Eintrag"},{"label":"private Felder","re":"private\\s+(String|double)\\s+\\w+\\s*;[\\s\\S]*private\\s+(String|double)\\s+\\w+\\s*;"},{"label":"Getter getZeit()","re":"double\\s+getZeit\\s*\\(\\s*\\)"},{"label":"ArrayList<Eintrag>","re":"ArrayList\\s*<\\s*Eintrag\\s*>"},{"label":"split","re":"\\.split\\s*\\("}],"rubric":[["Programm kompiliert und läuft",15],["Klasse mit private-Feldern und Gettern",25],["Einlesen und Zerlegen mit split",20],["Ungültige Zeiten abgelehnt",15],["Alle Einträge und Schnellste richtig ausgegeben",25]],"tip":"Zum Finden des Schnellsten: Merk dir das bisher beste **Objekt** in einer Variable (am Anfang `null`) und vergleich jede Zeit mit `beste.getZeit()`."}},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\nclass Eintrag {\n    private String name;\n    private double zeit;\n\n    Eintrag(String name, double zeit) {\n        this.name = name;\n        this.zeit = zeit;\n    }\n\n    public String getName() { return name; }\n    public double getZeit() { return zeit; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Eintrag> liste = new ArrayList<>();\n        liste.add(new Eintrag(\"Mia\", 42.5));\n        liste.add(new Eintrag(\"Tom\", 39.8));\n        Eintrag beste = null;\n        for (Eintrag e : liste) {\n            if (beste == null || e.getZeit() < beste.getZeit()) beste = e;\n        }\n        System.out.println(\"Schnellste: \" + beste.getName());\n    }\n}\n","run":true,"hl":[18,21],"say":"Abgegeben! Das Muster „bestes Objekt merken“ funktioniert genauso wie das Minimum aus Lektion 5 – nur dass du dir statt einer Zahl ein ganzes Objekt merkst."},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["`ArrayList` anlegen, füllen, ändern und leeren","Mit `Integer` und `Double` Zahlen in Listen speichern","Listen von **eigenen Objekten** verwalten","Beim Entfernen in Schleifen rückwärts laufen","Felder mit `private`, Gettern und Settern schützen"],"gap":0.7},"say":"Das war Lektion 9! In Lektion 10 lernst du Vererbung: Wie verschiedene Gegner vieles gemeinsam haben und trotzdem unterschiedlich sein können."}]}]},{"id":"java-10","nr":10,"title":"Vererbung","sub":"Gemeinsames einmal schreiben, Unterschiede gezielt überschreiben – extends, super und Polymorphie.","outro":"Mit Vererbung baust du Familien von Klassen: Gegner, Plattformen, Power-ups. Genau so ist auch unser Spiel aufgebaut. In Lektion 11 bringen wir Spielfelder auf den Bildschirm und machen Programme robust gegen falsche Eingaben.","chapters":[{"title":"Die Idee","steps":[{"t":"Lektion 10","h":"Vererbung","sub":"Klassen, die von anderen lernen","say":"Servus! In einem Spiel gibt es viele Gegner-Arten: Schleime, Fledermäuse, Drachen. Alle haben Namen und Leben, aber jeder greift anders an. Wie schreibt man das, ohne alles mehrfach zu kopieren? Mit **Vererbung**."},{"layout":"visual","visual":{"kind":"flow","title":"Eine Klassen-Familie","items":[{"h":"Gegner","p":"name, leben, schaden(), angriff()"},{"h":"Schleim extends Gegner","p":"erbt alles + teilt sich"},{"h":"Drache extends Gegner","p":"erbt alles + speit Feuer","cls":"good"}],"gap":1.1},"say":"Die Oberklasse `Gegner` enthält alles, was **alle** Gegner gemeinsam haben. Die Unterklassen erben das automatisch und fügen nur noch ihre Besonderheiten hinzu."},{"layout":"code","console":"clear","code":"class Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n        if (leben < 0) leben = 0;\n    }\n\n    String angriff() {\n        return name + \" greift an!\";\n    }\n}\n\n\nclass Schleim extends Gegner {\n    Schleim() {\n        super(\"Schleim\", 3);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Schleim s = new Schleim();\n        s.schaden(1);\n        System.out.println(s.name + \": \" + s.leben);\n        System.out.println(s.angriff());\n    }\n}\n","hl":[21,25],"say":"Mit `extends` sagst du: Ein Schleim **ist ein** Gegner. Im Konstruktor ruft `super(...)` den Konstruktor der Oberklasse auf – der setzt Name und Leben."},{"run":true,"say":"Die Klasse Schleim ist nur fünf Zeilen lang, kann aber schon alles: Sie hat einen Namen, Leben, kann Schaden nehmen und angreifen – alles geerbt."},{"quiz":{"id":"l10-q1","q":"Was bedeutet `class Drache extends Gegner`?","options":["Gegner erbt von Drache","Drache erbt alles von Gegner","Drache und Gegner sind dieselbe Klasse","Drache darf Gegner nicht benutzen"],"correct":1,"explain":"Drache ist die Unterklasse und bekommt alle Felder und Methoden von Gegner."}}]},{"title":"Überschreiben","steps":[{"t":"Kapitel 2","h":"Methoden überschreiben","sub":"@Override","after":"code"},{"layout":"code","console":"clear","code":"class Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n        if (leben < 0) leben = 0;\n    }\n\n    String angriff() {\n        return name + \" greift an!\";\n    }\n}\n\n\nclass Drache extends Gegner {\n    int feuer;\n\n    Drache() {\n        super(\"Drache\", 20);\n        this.feuer = 5;\n    }\n\n    @Override\n    String angriff() {\n        return name + \" speit Feuer! (\" + feuer + \" Schaden)\";\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Gegner g = new Gegner(\"Ratte\", 1);\n        Drache d = new Drache();\n        System.out.println(g.angriff());\n        System.out.println(d.angriff());\n    }\n}\n","hl":[29,32],"say":"Der Drache soll anders angreifen. Also schreibt er die Methode `angriff` einfach neu – das nennt man **Überschreiben**. `@Override` ist ein Hinweis an Java: „Ich will hier wirklich eine geerbte Methode ersetzen.“"},{"run":true,"say":"Die Ratte nutzt die normale Version, der Drache seine eigene. Außerdem hat der Drache ein zusätzliches Feld `feuer`, das normale Gegner nicht haben."},{"code":"class Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n        if (leben < 0) leben = 0;\n    }\n\n    String angriff() {\n        return name + \" greift an!\";\n    }\n}\n\n\nclass Ritter extends Gegner {\n    Ritter() {\n        super(\"Ritter\", 8);\n    }\n\n    @Override\n    void schaden(int wert) {\n        super.schaden(wert / 2);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Ritter r = new Ritter();\n        r.schaden(6);\n        System.out.println(r.name + \": \" + r.leben);\n    }\n}\n","console":"clear","hl":[27,29],"say":"Mit `super.methode()` rufst du in einer überschriebenen Methode die **alte** Version auf. Der Ritter hat eine Rüstung: Er nimmt nur halben Schaden, den Rest erledigt die normale schaden-Methode."},{"run":true,"say":"6 Schaden, halbiert auf 3 – der Ritter hat noch 5 Leben. So musst du die Logik nicht kopieren, sondern ergänzt sie nur."}]},{"title":"Polymorphie","steps":[{"t":"Kapitel 3","h":"Polymorphie","sub":"Viele Gestalten, eine Liste","after":"code"},{"layout":"code","console":"clear","code":"import java.util.ArrayList;\n\nclass Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n        if (leben < 0) leben = 0;\n    }\n\n    String angriff() {\n        return name + \" greift an!\";\n    }\n}\n\n\nclass Schleim extends Gegner {\n    Schleim() { super(\"Schleim\", 3); }\n\n    @Override\n    String angriff() { return \"Schleim blubbert dich an.\"; }\n}\n\nclass Drache extends Gegner {\n    Drache() { super(\"Drache\", 20); }\n\n    @Override\n    String angriff() { return \"Drache speit Feuer!\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<Gegner> welle = new ArrayList<>();\n        welle.add(new Schleim());\n        welle.add(new Drache());\n        welle.add(new Gegner(\"Ratte\", 1));\n        for (Gegner g : welle) {\n            System.out.println(g.angriff());\n        }\n    }\n}\n","hl":[37,40],"say":"Jetzt das Geniale: Weil ein Schleim **ein** Gegner ist, darf er in eine `ArrayList<Gegner>`. Der Drache auch. Alle verschiedenen Gegner stecken in **einer** Liste."},{"run":true,"hl":[41,43],"say":"Und beim Durchlaufen ruft Java automatisch die **richtige** Version von `angriff` auf – je nachdem, was das Objekt wirklich ist. Das heißt **Polymorphie**: viele Gestalten, ein Aufruf."},{"layout":"visual","visual":{"kind":"bullets","title":"Warum ist das so stark?","items":["Die Spielschleife kennt nur `Gegner`","Neue Gegner-Art? Neue Klasse – **die Schleife bleibt gleich**","Jeder Gegner entscheidet selbst, wie er sich verhält","In unserem Game: alle Objekte in **einer** Liste, jedes Bild `update()` und `draw()`"],"gap":0.9},"say":"Genau so funktionieren Spiele: Die Spielschleife geht alle Objekte durch und ruft bei jedem dieselben Methoden auf. Was dabei passiert, entscheidet jedes Objekt selbst."},{"quiz":{"id":"l10-q2","q":"`Gegner g = new Drache();` – Welche angriff()-Methode läuft bei `g.angriff()`?","options":["Die von Gegner, weil die Variable vom Typ Gegner ist","Die von Drache, weil das Objekt ein Drache ist","Beide nacheinander","Gar keine – Fehler"],"correct":1,"explain":"Entscheidend ist das echte Objekt, nicht der Typ der Variable. Das ist Polymorphie."}}]},{"title":"Aufgabe: Gegner-Welle","steps":[{"t":"Aufgabe 1","h":"Gegner-Welle","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 1: Gegner-Welle","items":["Oberklasse `Gegner` mit name, leben, `schaden(int)`, `angriff()` (gibt Schaden als int zurück)","`Fledermaus`: 2 Leben, Angriff 1","`Golem`: 10 Leben, Angriff 3, nimmt **nur halben** Schaden","main: Held mit 20 Leben kämpft gegen eine Welle in einer `ArrayList<Gegner>`"],"gap":0.9},"say":"Deine Aufgabe: Bau eine kleine Gegner-Familie und lass deinen Helden gegen eine ganze Welle kämpfen."},{"task":{"id":"l10-welle","nr":1,"title":"Gegner-Welle","text":["Schreib eine Oberklasse `Gegner` mit `name`, `leben`, einem Konstruktor, `void schaden(int wert)` und `int angriff()` (Standard: 1 Schaden).","Unterklassen: `Fledermaus` (2 Leben, Angriff 1) und `Golem` (10 Leben, `angriff()` gibt 3 zurück, `schaden` halbiert den Wert und ruft `super.schaden` auf).","In main: Eine `ArrayList<Gegner>` mit Fledermaus, Golem, Fledermaus. Der Held hat 20 Leben und macht 4 Schaden pro Schlag. Kämpf die Gegner der Reihe nach: Held schlägt, dann greift der Gegner an, wenn er noch lebt – bis er besiegt ist. Gib aus, wann ein Gegner besiegt ist, und am Ende die Leben des Helden."],"req":["Oberklasse `Gegner` und zwei Unterklassen mit `extends`","`super(...)` im Konstruktor","`@Override` von `angriff` und `schaden`","`ArrayList<Gegner>` und Kampf-Schleife","Ausgabe: Held hat am Ende 8 Leben"],"example":"Fledermaus besiegt!\nGolem besiegt!\nFledermaus besiegt!\nHeld hat noch 8 Leben","starter":"import java.util.ArrayList;\n\nclass Gegner {\n    // name, leben, Konstruktor, schaden(int), angriff()\n}\n\n// class Fledermaus extends Gegner { ... }\n// class Golem extends Gegner { ... }\n\npublic class Main {\n    public static void main(String[] args) {\n        int held = 20;\n        // ArrayList<Gegner> welle = new ArrayList<>();\n    }\n}\n","solution":"import java.util.ArrayList;\n\nclass Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n    }\n\n    int angriff() {\n        return 1;\n    }\n}\n\nclass Fledermaus extends Gegner {\n    Fledermaus() {\n        super(\"Fledermaus\", 2);\n    }\n}\n\nclass Golem extends Gegner {\n    Golem() {\n        super(\"Golem\", 10);\n    }\n\n    @Override\n    int angriff() {\n        return 3;\n    }\n\n    @Override\n    void schaden(int wert) {\n        super.schaden(wert / 2);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        int held = 20;\n        ArrayList<Gegner> welle = new ArrayList<>();\n        welle.add(new Fledermaus());\n        welle.add(new Golem());\n        welle.add(new Fledermaus());\n        for (Gegner g : welle) {\n            while (g.leben > 0) {\n                g.schaden(4);\n                if (g.leben > 0) {\n                    held -= g.angriff();\n                }\n            }\n            System.out.println(g.name + \" besiegt!\");\n        }\n        System.out.println(\"Held hat noch \" + held + \" Leben\");\n    }\n}\n","tests":[{"name":"Welle","input":[],"expect":[{"re":"fledermaus besiegt","label":"Fledermaus besiegt"},{"re":"golem besiegt","label":"Golem besiegt"},{"re":"noch\\s*8\\b|\\b8\\s*leben","label":"Held hat noch 8 Leben"}]}],"codeChecks":[{"label":"class Fledermaus extends Gegner","re":"class\\s+Fledermaus\\s+extends\\s+Gegner"},{"label":"class Golem extends Gegner","re":"class\\s+Golem\\s+extends\\s+Gegner"},{"label":"super(...) im Konstruktor","re":"super\\s*\\("},{"label":"super.schaden","re":"super\\s*\\.\\s*schaden"},{"label":"ArrayList<Gegner>","re":"ArrayList\\s*<\\s*Gegner\\s*>"}],"rubric":[["Programm kompiliert und läuft",15],["Oberklasse und zwei Unterklassen mit super",25],["angriff und schaden richtig überschrieben",25],["Kampf-Schleife über ArrayList<Gegner>",20],["Richtiges Endergebnis (8 Leben)",15]],"tip":"Rechne den Golem nach: 4 Schaden halbiert sind 2. Er braucht also 5 Schläge und schlägt 4-mal zurück (beim 5. ist er schon besiegt). Das sind 12 Schaden – die Fledermäuse sterben schon beim ersten Schlag."}},{"layout":"code","console":"clear","code":"class Gegner {\n    String name;\n    int leben;\n\n    Gegner(String name, int leben) {\n        this.name = name;\n        this.leben = leben;\n    }\n\n    void schaden(int wert) {\n        leben -= wert;\n        if (leben < 0) leben = 0;\n    }\n\n    int angriff() {\n        return 1;\n    }\n}\n\n\nclass Golem extends Gegner {\n    Golem() { super(\"Golem\", 10); }\n\n    @Override\n    int angriff() { return 3; }\n\n    @Override\n    void schaden(int wert) { super.schaden(wert / 2); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Gegner g = new Golem();\n        g.schaden(4);\n        System.out.println(g.name + \": \" + g.leben + \" Leben, Angriff \" + g.angriff());\n    }\n}\n","run":true,"say":"Abgegeben! Obwohl die Variable vom Typ Gegner ist, verhält sich der Golem wie ein Golem: halber Schaden, starker Angriff. Polymorphie in Aktion."}]},{"title":"Abstrakte Klassen & Object","steps":[{"t":"Kapitel 5","h":"Abstrakte Klassen","sub":"Baupläne, die man nicht direkt bauen kann","after":"code"},{"layout":"code","console":"clear","code":"abstract class Form {\n    String name;\n\n    Form(String name) { this.name = name; }\n\n    abstract double flaeche();\n\n    public String toString() {\n        return name + \" mit Fläche \" + flaeche();\n    }\n}\n\nclass Rechteck extends Form {\n    double b, h;\n    Rechteck(double b, double h) { super(\"Rechteck\"); this.b = b; this.h = h; }\n\n    @Override\n    double flaeche() { return b * h; }\n}\n\nclass Kreis extends Form {\n    double r;\n    Kreis(double r) { super(\"Kreis\"); this.r = r; }\n\n    @Override\n    double flaeche() { return Math.round(Math.PI * r * r * 10) / 10.0; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Form[] formen = { new Rechteck(3, 4), new Kreis(1) };\n        for (Form f : formen) {\n            System.out.println(f);\n        }\n    }\n}\n","hl":[1,6],"say":"Manchmal ist die Oberklasse nur eine Idee: Es gibt keine „Form an sich“, nur Rechtecke und Kreise. Dann machst du die Klasse `abstract`. Eine abstrakte Methode hat keinen Inhalt – jede Unterklasse **muss** sie schreiben."},{"run":true,"say":"Jede Form berechnet ihre Fläche selbst, aber `toString` ist nur einmal geschrieben. `new Form()` würde übrigens nicht gehen – von abstrakten Klassen gibt es keine Objekte."},{"layout":"visual","visual":{"kind":"bullets","title":"Gut zu wissen","items":["Jede Klasse erbt automatisch von **Object** – daher kommen `toString()` und `equals()`","Java erlaubt nur **eine** Oberklasse pro Klasse","`instanceof` prüft, ob ein Objekt zu einer Klasse gehört","`protected`: sichtbar für Unterklassen"],"gap":0.9},"say":"Noch ein paar Fakten: Ganz oben in jeder Familie steht die Klasse `Object`. Deshalb hat jedes Objekt ein `toString`. Und eine Klasse kann in Java nur von **einer** anderen erben."},{"quiz":{"id":"l10-q3","q":"Was passiert bei `new Form()`, wenn Form abstract ist?","options":["Ein leeres Objekt wird erzeugt","Compiler-Fehler","Es wird automatisch ein Kreis","Laufzeitfehler beim Aufruf von flaeche()"],"correct":1,"explain":"Von abstrakten Klassen kann man keine Objekte erzeugen – das merkt schon der Compiler."}}]},{"title":"Aufgabe: Power-ups","steps":[{"t":"Aufgabe 2","h":"Power-ups","sub":"Abstrakte Klasse für Spiel-Items","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 2: Power-ups","items":["Klasse `Spieler` mit `leben`, `tempo`, `punkte`","abstrakte Klasse `PowerUp` mit `abstract void anwenden(Spieler s)` und `beschreibung()`","`Herz` (+1 Leben), `Turbo` (tempo × 2), `Stern` (+500 Punkte)","Lies Kürzel ein (h, t, s), wende sie an, gib den Spieler aus"],"gap":0.9},"say":"Letzte Aufgabe dieser Lektion: Power-ups! Jedes Item macht etwas anderes mit dem Spieler."},{"task":{"id":"l10-powerups","nr":2,"title":"Power-ups","text":["Schreib eine Klasse `Spieler` mit `leben = 3`, `tempo = 1` und `punkte = 0` und eine **abstrakte** Klasse `PowerUp` mit `abstract void anwenden(Spieler s)` und `abstract String beschreibung()`.","Unterklassen: `Herz` (+1 Leben), `Turbo` (tempo verdoppeln), `Stern` (+500 Punkte).","In main liest du eine Zeile mit Kürzeln ein, z. B. „h t s t“. Für jedes Kürzel erzeugst du das passende Power-up, gibst seine Beschreibung aus und wendest es an. Am Ende: „Leben: 4, Tempo: 4, Punkte: 500“."],"req":["`abstract class PowerUp` mit zwei abstrakten Methoden","Drei Unterklassen mit `@Override`","Variable vom Typ `PowerUp` (Polymorphie)","Kürzel mit `split` zerlegen","Richtige Endwerte"],"example":"Kürzel: h t s t\nHerz: +1 Leben\nTurbo: doppeltes Tempo\nStern: +500 Punkte\nTurbo: doppeltes Tempo\nLeben: 4, Tempo: 4, Punkte: 500","starter":"import java.util.Scanner;\n\nclass Spieler {\n    int leben = 3;\n    int tempo = 1;\n    int punkte = 0;\n}\n\n// abstract class PowerUp { ... }\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        Spieler sp = new Spieler();\n        System.out.print(\"Kürzel: \");\n        String[] kuerzel = sc.nextLine().split(\" \");\n    }\n}\n","solution":"import java.util.Scanner;\n\nclass Spieler {\n    int leben = 3;\n    int tempo = 1;\n    int punkte = 0;\n}\n\nabstract class PowerUp {\n    abstract void anwenden(Spieler s);\n    abstract String beschreibung();\n}\n\nclass Herz extends PowerUp {\n    @Override\n    void anwenden(Spieler s) { s.leben++; }\n\n    @Override\n    String beschreibung() { return \"Herz: +1 Leben\"; }\n}\n\nclass Turbo extends PowerUp {\n    @Override\n    void anwenden(Spieler s) { s.tempo *= 2; }\n\n    @Override\n    String beschreibung() { return \"Turbo: doppeltes Tempo\"; }\n}\n\nclass Stern extends PowerUp {\n    @Override\n    void anwenden(Spieler s) { s.punkte += 500; }\n\n    @Override\n    String beschreibung() { return \"Stern: +500 Punkte\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        Spieler sp = new Spieler();\n        System.out.print(\"Kürzel: \");\n        String[] kuerzel = sc.nextLine().split(\" \");\n        for (String k : kuerzel) {\n            PowerUp p = null;\n            if (k.equals(\"h\")) p = new Herz();\n            else if (k.equals(\"t\")) p = new Turbo();\n            else if (k.equals(\"s\")) p = new Stern();\n            if (p != null) {\n                System.out.println(p.beschreibung());\n                p.anwenden(sp);\n            }\n        }\n        System.out.println(\"Leben: \" + sp.leben + \", Tempo: \" + sp.tempo + \", Punkte: \" + sp.punkte);\n    }\n}\n","tests":[{"name":"h t s t","input":["h t s t"],"expect":[{"re":"leben:?\\s*4","label":"Leben 4"},{"re":"tempo:?\\s*4","label":"Tempo 4"},{"re":"punkte:?\\s*500\\b","label":"Punkte 500"}]},{"name":"s s h x","input":["s s h x"],"expect":[{"re":"leben:?\\s*4","label":"Leben 4"},{"re":"tempo:?\\s*1\\b","label":"Tempo 1"},{"re":"punkte:?\\s*1000","label":"Punkte 1000"}]}],"codeChecks":[{"label":"abstract class PowerUp","re":"abstract\\s+class\\s+PowerUp"},{"label":"abstrakte Methode anwenden","re":"abstract\\s+void\\s+anwenden"},{"label":"drei Unterklassen","re":"extends\\s+PowerUp[\\s\\S]*extends\\s+PowerUp[\\s\\S]*extends\\s+PowerUp"},{"label":"Variable vom Typ PowerUp","re":"PowerUp\\s+\\w+\\s*="}],"rubric":[["Programm kompiliert und läuft",15],["Abstrakte Klasse richtig aufgebaut",25],["Drei Unterklassen mit passender Wirkung",25],["Polymorphe Verwendung über PowerUp-Variable",20],["Eingabe zerlegt und Endwerte richtig",15]],"tip":"Leg in der Schleife eine Variable `PowerUp p = null;` an und weise ihr je nach Kürzel ein `new Herz()`, `new Turbo()` … zu. Danach rufst du einfach `p.anwenden(sp)` auf – egal welches es ist."}},{"layout":"code","console":"clear","code":"class Spieler {\n    int punkte = 0;\n}\n\nabstract class PowerUp {\n    abstract void anwenden(Spieler s);\n}\n\nclass Stern extends PowerUp {\n    @Override\n    void anwenden(Spieler s) { s.punkte += 500; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Spieler sp = new Spieler();\n        PowerUp p = new Stern();\n        p.anwenden(sp);\n        p.anwenden(sp);\n        System.out.println(sp.punkte);\n    }\n}\n","run":true,"say":"Abgegeben! Die main-Methode kennt nur `PowerUp` und `anwenden`. Willst du ein neues Item – einen Pilz, einen Magneten –, schreibst du nur eine neue Klasse."},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["Unterklassen mit `extends` bilden","Konstruktoren der Oberklasse mit `super(...)` aufrufen","Methoden mit `@Override` überschreiben und mit `super.` ergänzen","**Polymorphie**: verschiedene Objekte in einer Liste","Abstrakte Klassen als gemeinsamen Bauplan"],"gap":0.7},"say":"Das war Lektion 10 – du kennst jetzt die großen Ideen der objektorientierten Programmierung. In Lektion 11 bauen wir Spielfelder und machen Programme robust."}]}]},{"id":"java-11","nr":11,"title":"Spielfelder & Fehlerbehandlung","sub":"2D-Arrays als Spielwelt, Bewegung mit Kollision – und Programme, die bei falschen Eingaben nicht abstürzen.","outro":"Ein Spielfeld aus Kacheln, Kollision mit Wänden und robuste Eingaben: Genau diese Ideen stecken auch in unserem Jump’n’Run. In Lektion 12 baust du dein Java-Abschlussprojekt.","chapters":[{"title":"Zweidimensionale Arrays","steps":[{"t":"Lektion 11","h":"Spielfelder","sub":"und Fehlerbehandlung","say":"Servus! Fast jedes 2D-Spiel besteht aus einem **Gitter aus Kacheln**: Wand, Boden, Münze, Ziel. Heute lernst du, solche Spielfelder zu bauen – mit zweidimensionalen Arrays."},{"layout":"visual","visual":{"kind":"html","html":"<h4>Ein Gitter: Zeile und Spalte</h4><table class=\"vt grid-demo\"><thead><tr><th></th><th>Spalte 0</th><th>Spalte 1</th><th>Spalte 2</th><th>Spalte 3</th></tr></thead><tbody><tr data-s=\"0.4\"><th>Zeile 0</th><td><code>#</code></td><td><code>#</code></td><td><code>#</code></td><td><code>#</code></td></tr><tr data-s=\"1\"><th>Zeile 1</th><td><code>#</code></td><td><code>@</code></td><td><code>.</code></td><td><code>#</code></td></tr><tr data-s=\"1.6\"><th>Zeile 2</th><td><code>#</code></td><td><code>.</code></td><td><code>Z</code></td><td><code>#</code></td></tr></tbody></table><p class=\"vnote\" data-s=\"2.4\"><code>feld[1][1]</code> ist der Spieler <code>@</code>, <code>feld[2][2]</code> das Ziel <code>Z</code>. Zuerst die Zeile, dann die Spalte.</p>"},"say":"Ein 2D-Array ist ein Array aus Arrays: Jede Zeile ist selbst ein Array. Du greifst mit zwei Indizes zu – zuerst die **Zeile**, dann die **Spalte**."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        char[][] feld = new char[3][5];\n        for (int y = 0; y < feld.length; y++) {\n            for (int x = 0; x < feld[y].length; x++) {\n                feld[y][x] = '.';\n            }\n        }\n        feld[1][2] = '@';\n        for (int y = 0; y < feld.length; y++) {\n            for (int x = 0; x < feld[y].length; x++) {\n                System.out.print(feld[y][x]);\n            }\n            System.out.println();\n        }\n    }\n}\n","hl":[3,8],"say":"`new char[3][5]` macht 3 Zeilen mit je 5 Spalten. Zum Füllen brauchst du **zwei verschachtelte Schleifen**: außen die Zeilen y, innen die Spalten x."},{"run":true,"hl":[10,15],"say":"Ausgeben geht genauso: Zeichen für Zeichen, und nach jeder Zeile ein Zeilenumbruch. `feld.length` ist die Anzahl Zeilen, `feld[y].length` die Breite."},{"quiz":{"id":"l11-q1","q":"`int[][] a = new int[4][7];` – Was ist `a[0].length`?","options":["4","7","28","0"],"correct":1,"explain":"a hat 4 Zeilen, und jede Zeile a[0] … a[3] ist ein Array mit 7 Einträgen."}}]},{"title":"Level aus Text","steps":[{"t":"Kapitel 2","h":"Level aus Text","sub":"So bauen echte Spiele ihre Welten","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        String[] level = {\n            \"##########\",\n            \"#@...#...#\",\n            \"#.##.#.#.#\",\n            \"#....#.#Z#\",\n            \"##.....#.#\",\n            \"##########\"\n        };\n        char[][] feld = new char[level.length][];\n        for (int y = 0; y < level.length; y++) {\n            feld[y] = level[y].toCharArray();\n        }\n        int muenzen = 0;\n        for (int y = 0; y < feld.length; y++) {\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '.') muenzen++;\n            }\n        }\n        System.out.println(\"Breite \" + feld[0].length + \", Höhe \" + feld.length + \", Punkte: \" + muenzen);\n    }\n}\n","hl":[2,9],"say":"Level von Hand mit Schleifen zu bauen ist mühsam. Viel besser: Du **zeichnest** das Level als Text. Jedes Zeichen ist eine Kachel. `#` ist Wand, `.` ist Weg, `@` der Spieler, `Z` das Ziel."},{"hl":[10,13],"say":"Mit `toCharArray` wird jede Text-Zeile zu einer Zeile im Spielfeld. Jetzt kannst du jede Kachel einzeln lesen und ändern."},{"run":true,"say":"Das Spielfeld ist 10 breit und 6 hoch. Genau so – mit Text-Zeilen – werden wir auch die Level im Jump’n’Run speichern."}]},{"title":"Bewegung & Kollision","steps":[{"t":"Kapitel 3","h":"Bewegen und Kollidieren","sub":"Erst prüfen, dann laufen","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    static boolean frei(char[][] feld, int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return false;\n        }\n        return feld[y][x] != '#';\n    }\n\n    public static void main(String[] args) {\n        String[] level = {\n            \"##########\",\n            \"#@...#...#\",\n            \"#.##.#.#.#\",\n            \"#....#.#Z#\",\n            \"##.....#.#\",\n            \"##########\"\n        };\n        char[][] feld = new char[level.length][];\n        for (int y = 0; y < level.length; y++) feld[y] = level[y].toCharArray();\n        int px = 1, py = 1;\n        String zuege = \"ddssaa\";\n        for (int i = 0; i < zuege.length(); i++) {\n            char z = zuege.charAt(i);\n            int nx = px, ny = py;\n            if (z == 'w') ny--;\n            if (z == 's') ny++;\n            if (z == 'a') nx--;\n            if (z == 'd') nx++;\n            if (frei(feld, nx, ny)) {\n                px = nx;\n                py = ny;\n            } else {\n                System.out.println(\"Bumm! Wand bei \" + nx + \",\" + ny);\n            }\n        }\n        System.out.println(\"Spieler steht bei \" + px + \",\" + py);\n    }\n}\n","hl":[22,32],"say":"Das wichtigste Muster jeder Spiel-Bewegung: Berechne zuerst die **neue** Position nx, ny. Dann prüfe, ob sie frei ist. Nur dann bewegst du den Spieler wirklich."},{"hl":[2,7],"say":"Die Methode `frei` prüft zwei Dinge: Liegt die Position überhaupt im Feld? Und ist dort keine Wand? Die Reihenfolge ist wichtig – erst die Grenzen, sonst gibt es eine Exception."},{"run":true,"say":"Zweimal rechts, dann wollte er runter – aber da war eine Wand. Diese Kollisionsprüfung wirst du in unserem Spiel wiedersehen, nur mit Pixeln statt Kästchen."}]},{"title":"Aufgabe: Labyrinth","steps":[{"t":"Aufgabe 1","h":"Labyrinth","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 1: Labyrinth-Spiel","items":["Das Level ist vorgegeben (String-Array)","Lies Züge mit w, a, s, d ein – einer pro Zeile","Wände blockieren; zeichne das Feld nach jedem Zug","Erreicht der Spieler **Z**: „Ziel erreicht in N Zügen!“","„q“ beendet das Spiel"],"gap":0.9},"say":"Jetzt baust du ein echtes kleines Spiel: ein Labyrinth, durch das du dich mit w, a, s, d bewegst."},{"task":{"id":"l11-labyrinth","nr":1,"title":"Labyrinth-Spiel","text":["Das Level aus dem Startcode wird in ein `char[][]` umgewandelt. Der Spieler startet beim `@`.","Lies in einer Schleife Züge ein (`w` hoch, `s` runter, `a` links, `d` rechts). Ist das Zielfeld eine Wand, bleibt der Spieler stehen. Zähle nur gültige Züge. Nach jedem Zug zeichnest du das Feld neu.","Steht der Spieler auf `Z`, gib „Ziel erreicht in N Zügen!“ aus und beende das Spiel. Bei `q` endet es mit „Aufgegeben.“"],"req":["Level als `char[][]`","Bewegung mit w/a/s/d und Kollision mit `#`","Nur gültige Züge zählen","Feld nach jedem Zug ausgeben","Ziel erkennen und Anzahl der Züge ausgeben"],"example":"Zug: d\n##########\n#.@..#...#\n...\nZiel erreicht in 15 Zügen!","starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        String[] level = {\n            \"##########\",\n            \"#@...#...#\",\n            \"#.##.#.#.#\",\n            \"#....#.#Z#\",\n            \"##.....#.#\",\n            \"##########\"\n        };\n        char[][] feld = new char[level.length][];\n        for (int y = 0; y < level.length; y++) {\n            feld[y] = level[y].toCharArray();\n        }\n        Scanner sc = new Scanner(System.in);\n        // Startposition suchen, dann Züge lesen\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    static void zeichne(char[][] feld) {\n        for (char[] zeile : feld) {\n            System.out.println(new String(zeile));\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] level = {\n            \"##########\",\n            \"#@...#...#\",\n            \"#.##.#.#.#\",\n            \"#....#.#Z#\",\n            \"##.....#.#\",\n            \"##########\"\n        };\n        char[][] feld = new char[level.length][];\n        for (int y = 0; y < level.length; y++) {\n            feld[y] = level[y].toCharArray();\n        }\n        Scanner sc = new Scanner(System.in);\n        int px = 0, py = 0;\n        for (int y = 0; y < feld.length; y++) {\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    px = x;\n                    py = y;\n                }\n            }\n        }\n        int zuege = 0;\n        while (true) {\n            System.out.print(\"Zug: \");\n            String z = sc.nextLine();\n            if (z.equals(\"q\")) {\n                System.out.println(\"Aufgegeben.\");\n                break;\n            }\n            int nx = px, ny = py;\n            if (z.equals(\"w\")) ny--;\n            else if (z.equals(\"s\")) ny++;\n            else if (z.equals(\"a\")) nx--;\n            else if (z.equals(\"d\")) nx++;\n            if (feld[ny][nx] == '#') {\n                System.out.println(\"Da ist eine Wand!\");\n                continue;\n            }\n            if (nx == px && ny == py) continue;\n            zuege++;\n            boolean ziel = feld[ny][nx] == 'Z';\n            feld[py][px] = '.';\n            feld[ny][nx] = '@';\n            px = nx;\n            py = ny;\n            zeichne(feld);\n            if (ziel) {\n                System.out.println(\"Ziel erreicht in \" + zuege + \" Zügen!\");\n                break;\n            }\n        }\n    }\n}\n","tests":[{"name":"kürzester Weg","input":["s","s","d","d","d","s","d","d","w","w","w","d","d","s","s"],"expect":[{"re":"ziel erreicht in 15","label":"Ziel erreicht in 15 Zügen"}]},{"name":"gegen die Wand","input":["w","a","d","q"],"expect":[{"re":"aufgegeben","label":"„Aufgegeben.“"},{"re":"#\\.@\\.\\.#","label":"Feld zeigt den Spieler nach dem Zug"},{"re":"ziel erreicht","label":"kein Ziel","not":true}]},{"name":"Wände zählen nicht","input":["w","w","s","s","d","d","d","s","d","d","w","w","w","d","d","s","s"],"expect":[{"re":"ziel erreicht in 15","label":"Wand-Versuche zählen nicht: 15 Züge"}]}],"codeChecks":[{"label":"2D-Array char[][]","re":"char\\s*\\[\\s*\\]\\s*\\[\\s*\\]"},{"label":"Wand-Prüfung","re":"'#'"},{"label":"Ziel-Prüfung","re":"'Z'"}],"rubric":[["Programm kompiliert und läuft",15],["Startposition gefunden und Bewegung mit w/a/s/d",25],["Kollision mit Wänden",20],["Feld nach jedem Zug gezeichnet",15],["Ziel und Zug-Zähler richtig, q beendet",25]],"tip":"Speicher die Position in `px` und `py`. Beim Bewegen: altes Feld auf `.` setzen, neues Feld auf `@`. Prüf aber **vorher**, ob das neue Feld `Z` ist – sonst überschreibst du das Ziel."}},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        char[][] feld = { \"#.Z\".toCharArray() };\n        int px = 1, py = 0;\n        int nx = 2, ny = 0;\n        boolean ziel = feld[ny][nx] == 'Z';\n        feld[py][px] = '.';\n        feld[ny][nx] = '@';\n        System.out.println(new String(feld[0]) + \" -> Ziel? \" + ziel);\n    }\n}\n","run":true,"hl":[5,7],"say":"Abgegeben! Der Knackpunkt: Erst schauen, was auf dem neuen Feld liegt, dann den Spieler dorthin setzen. Sonst ist das Z weg, bevor du es bemerkst."}]},{"title":"Exceptions abfangen","steps":[{"t":"Kapitel 5","h":"Fehlerbehandlung","sub":"try und catch","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        String eingabe = \"zwölf\";\n        int zahl = Integer.parseInt(eingabe);\n        System.out.println(zahl * 2);\n    }\n}\n","run":true,"expectError":true,"say":"Was passiert, wenn jemand statt einer Zahl ein Wort eintippt? Das Programm stürzt mit einer **NumberFormatException** ab. In einem Spiel wäre das ärgerlich."},{"code":"public class Main {\n    public static void main(String[] args) {\n        String[] eingaben = {\"12\", \"zwölf\", \"7\"};\n        for (String e : eingaben) {\n            try {\n                int zahl = Integer.parseInt(e);\n                System.out.println(zahl + \" mal 2 = \" + zahl * 2);\n            } catch (NumberFormatException ex) {\n                System.out.println(\"\\\"\" + e + \"\\\" ist keine Zahl!\");\n            }\n        }\n        System.out.println(\"Programm läuft weiter.\");\n    }\n}\n","console":"clear","hl":[4,9],"say":"Mit `try` sagst du: „Versuch das mal.“ Geht es schief, springt Java in den `catch`-Block – statt abzustürzen. In den Klammern steht, welchen Fehler du abfängst."},{"run":true,"say":"Das Wort wurde abgefangen, und das Programm läuft einfach weiter. Alles nach der fehlerhaften Zeile im try-Block wird dabei übersprungen."},{"layout":"split","visual":{"kind":"table","title":"Häufige Exceptions","head":["Exception","wann?"],"rows":[["`NumberFormatException`","Text ist keine Zahl"],["`ArrayIndexOutOfBoundsException`","Index außerhalb des Arrays"],["`NullPointerException`","Zugriff über null"],["`ArithmeticException`","Ganzzahl durch 0"],["`InputMismatchException`","nextInt bekommt keinen int"]],"gap":0.6},"code":"public class Main {\n    public static void main(String[] args) {\n        int[] werte = {1, 2, 3};\n        try {\n            System.out.println(werte[5]);\n        } catch (ArrayIndexOutOfBoundsException ex) {\n            System.out.println(\"Gibt es nicht: \" + ex.getMessage());\n        } finally {\n            System.out.println(\"finally läuft immer\");\n        }\n    }\n}\n","run":true,"console":"clear","say":"Hier die häufigsten Exceptions. Mit `getMessage` bekommst du die Fehlermeldung, und ein `finally`-Block läuft **immer** – ob ein Fehler passiert ist oder nicht."},{"quiz":{"id":"l11-q2","q":"Was gibt dieser Code aus? `try { int x = 5 / 0; System.out.print(\"A\"); } catch (ArithmeticException e) { System.out.print(\"B\"); } System.out.print(\"C\");`","options":["AC","BC","ABC","B"],"correct":1,"explain":"Die Division wirft sofort eine Exception, A wird übersprungen. Der catch-Block gibt B aus, danach geht es mit C weiter."}}]},{"title":"Selbst Exceptions werfen","steps":[{"t":"Kapitel 6","h":"throw","sub":"Fehler selbst melden","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    static int levelNummer(String text) {\n        int n = Integer.parseInt(text);\n        if (n < 1 || n > 8) {\n            throw new IllegalArgumentException(\"Level \" + n + \" gibt es nicht\");\n        }\n        return n;\n    }\n\n    public static void main(String[] args) {\n        String[] tests = {\"3\", \"12\", \"abc\"};\n        for (String t : tests) {\n            try {\n                System.out.println(\"Starte Level \" + levelNummer(t));\n            } catch (NumberFormatException e) {\n                System.out.println(\"Keine Zahl: \" + t);\n            } catch (IllegalArgumentException e) {\n                System.out.println(e.getMessage());\n            }\n        }\n    }\n}\n","hl":[4,6],"say":"Du kannst auch selbst Exceptions **werfen**, mit `throw new …`. So meldet eine Methode: „Mit diesem Wert kann ich nicht arbeiten.“ Wer sie aufruft, muss sich darum kümmern."},{"run":true,"hl":[16,20],"say":"Mehrere catch-Blöcke fangen verschiedene Fehler unterschiedlich ab. Achtung: Die speziellere Exception muss zuerst kommen – NumberFormatException ist nämlich eine Unterklasse von IllegalArgumentException. Vererbung, du erinnerst dich!"},{"quiz":{"id":"l11-q3","q":"Wann sollte man eine Exception abfangen?","options":["Immer, um jeden Absturz zu verstecken","Wenn man sinnvoll darauf reagieren kann, z. B. nochmal fragen","Nie, Abstürze sind normal","Nur in der main-Methode"],"correct":1,"explain":"Fang Fehler dort ab, wo du etwas Sinnvolles tun kannst. Einfach alles zu verschlucken versteckt echte Bugs."}}]},{"title":"Aufgabe: Robuste Eingabe","steps":[{"t":"Aufgabe 2","h":"Robuste Eingabe","sub":"Programme, die nicht abstürzen","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 2: Robuster Rundenzähler","items":["Methode `int leseZahl(String text)` – wirft bei negativen Zahlen eine `IllegalArgumentException`","Lies Rundenzeiten in Sekunden ein, bis „stop“","Fang Wörter und negative Zahlen mit try/catch ab","Am Ende: Anzahl gültiger Runden, Gesamtzeit, Fehler"],"gap":0.9},"say":"Letzte Aufgabe dieser Lektion: ein Rundenzähler, der mit jedem Unsinn klarkommt, den man eintippt."},{"task":{"id":"l11-robust","nr":2,"title":"Robuster Rundenzähler","text":["Schreib eine Methode `static int leseZahl(String text)`, die den Text mit `Integer.parseInt` umwandelt und bei einer negativen Zahl `throw new IllegalArgumentException(\"negativ\")` macht.","In main liest du Zeilen ein, bis „stop“ kommt. Jede Zeile gibst du an `leseZahl`. Fang `NumberFormatException` („Keine Zahl!“) und `IllegalArgumentException` („Zeit darf nicht negativ sein!“) getrennt ab.","Am Ende gibst du aus: „Runden: …“, „Gesamt: … s“ und „Fehler: …“."],"req":["Methode `leseZahl` mit `throw`","try/catch mit zwei catch-Blöcken in der richtigen Reihenfolge","Schleife bis „stop“","Zähler für Runden, Gesamtzeit und Fehler"],"example":"45\nschnell\n-3\n50\nstop\nKeine Zahl!\nZeit darf nicht negativ sein!\nRunden: 2\nGesamt: 95 s\nFehler: 2","starter":"import java.util.Scanner;\n\npublic class Main {\n    // static int leseZahl(String text) { ... }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // Zeilen lesen bis \"stop\"\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    static int leseZahl(String text) {\n        int n = Integer.parseInt(text);\n        if (n < 0) {\n            throw new IllegalArgumentException(\"negativ\");\n        }\n        return n;\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int runden = 0, gesamt = 0, fehler = 0;\n        while (true) {\n            String zeile = sc.nextLine();\n            if (zeile.equals(\"stop\")) break;\n            try {\n                int zeit = leseZahl(zeile);\n                runden++;\n                gesamt += zeit;\n            } catch (NumberFormatException e) {\n                System.out.println(\"Keine Zahl!\");\n                fehler++;\n            } catch (IllegalArgumentException e) {\n                System.out.println(\"Zeit darf nicht negativ sein!\");\n                fehler++;\n            }\n        }\n        System.out.println(\"Runden: \" + runden);\n        System.out.println(\"Gesamt: \" + gesamt + \" s\");\n        System.out.println(\"Fehler: \" + fehler);\n    }\n}\n","tests":[{"name":"gemischt","input":["45","schnell","-3","50","stop"],"expect":[{"re":"runden:?\\s*2\\b","label":"Runden: 2"},{"re":"gesamt:?\\s*95","label":"Gesamt: 95"},{"re":"fehler:?\\s*2\\b","label":"Fehler: 2"},{"re":"keine zahl","label":"„Keine Zahl!“"},{"re":"negativ","label":"Meldung für negative Zahl"}]},{"name":"nur gültig","input":["10","20","30","stop"],"expect":[{"re":"runden:?\\s*3\\b","label":"Runden: 3"},{"re":"gesamt:?\\s*60","label":"Gesamt: 60"},{"re":"fehler:?\\s*0\\b","label":"Fehler: 0"}]}],"codeChecks":[{"label":"throw new IllegalArgumentException","re":"throw\\s+new\\s+IllegalArgumentException"},{"label":"catch NumberFormatException","re":"catch\\s*\\(\\s*NumberFormatException"},{"label":"catch IllegalArgumentException","re":"catch\\s*\\(\\s*IllegalArgumentException"},{"label":"Methode leseZahl","re":"static\\s+int\\s+leseZahl\\s*\\(\\s*String"}],"rubric":[["Programm kompiliert und läuft",15],["leseZahl mit parseInt und throw",25],["Zwei catch-Blöcke in richtiger Reihenfolge",25],["Schleife bis stop",10],["Zähler und Ausgabe richtig",25]],"tip":"Fängst du zuerst `IllegalArgumentException` ab, landet auch jede NumberFormatException dort – und der Compiler beschwert sich über den zweiten Block. Also: speziell vor allgemein."}},{"layout":"code","console":"clear","code":"public class Main {\n    static int leseZahl(String text) {\n        int n = Integer.parseInt(text);\n        if (n < 0) throw new IllegalArgumentException(\"negativ\");\n        return n;\n    }\n\n    public static void main(String[] args) {\n        try {\n            leseZahl(\"-3\");\n        } catch (NumberFormatException e) {\n            System.out.println(\"Keine Zahl!\");\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"Fehler: \" + e.getMessage());\n        }\n    }\n}\n","run":true,"say":"Abgegeben! Mit eigenen Exceptions und try/catch hält dein Programm jetzt jedem Tipp-Unsinn stand."},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["2D-Arrays anlegen, füllen und ausgeben","Level aus Text-Zeilen laden","Bewegung mit Kollisionsprüfung","Exceptions mit `try` / `catch` / `finally` abfangen","Eigene Exceptions mit `throw` werfen"],"gap":0.7},"say":"Das war Lektion 11! Jetzt hast du alles beisammen für dein Java-Abschlussprojekt in Lektion 12."}]}]},{"id":"java-12","nr":12,"title":"Abschlussprojekt: Pixel-Lauf","sub":"Alles zusammen: ein Jump’n’Run in der Konsole – mit Schwerkraft, Sprüngen, Münzen, Stacheln und Ziel.","outro":"Geschafft – du hast ein komplettes Spiel in Java programmiert! Schwerkraft, Kollision, Spielschleife und Level aus Text: Genau diese Ideen baust du als Nächstes im Browser nach, mit JavaScript, Grafik und Mitspielern. Weiter geht’s in den Classics mit JavaScript.","chapters":[{"title":"Das Projekt","steps":[{"t":"Lektion 12","h":"Pixel-Lauf","sub":"Dein Java-Abschlussprojekt","say":"Servus und willkommen zum Finale des Java-Teils! Heute baust du ein echtes **Jump’n’Run** – noch in der Konsole, aber mit allem, was dazugehört: Schwerkraft, Springen, Münzen, Stacheln und ein Ziel."},{"layout":"visual","visual":{"kind":"code","title":"So sieht das Level aus","code":"################\n#              #\n#     o    o  Z#\n#    ###  ###  #\n#@  o   ^^   ###\n################","note":"`@` Spieler · `#` Wand/Boden · `o` Münze · `^` Stacheln · `Z` Ziel"},"say":"Das ist unser Level, gezeichnet als Text. Der Spieler startet links unten. Über die Stacheln muss er springen, und oben warten Münzen und das Ziel."},{"layout":"visual","visual":{"kind":"flow","dir":"row","title":"Ein Tick der Spielschleife","items":[{"h":"Eingabe","p":"a, d, w oder wd"},{"h":"Update","p":"laufen, springen, fallen"},{"h":"Prüfen","p":"Münze? Stachel? Ziel?"},{"h":"Zeichnen","p":"Feld ausgeben","cls":"good"}],"gap":1},"say":"Jedes Spiel läuft in einer Schleife. Ein Durchgang heißt **Tick** oder Frame: Eingabe lesen, alles bewegen, Ereignisse prüfen, zeichnen. Bei uns ist ein Tick eine eingegebene Zeile. Im Browser werden es später 60 Ticks pro Sekunde."},{"layout":"visual","visual":{"kind":"boxes","title":"Drei Klassen","vars":[{"type":"class","name":"Level","value":"Karte, istFest()"},{"type":"class","name":"Spieler","value":"x, y, sprung, update()"},{"type":"class","name":"Main","value":"Spielschleife, zeichne()"}],"note":"Jede Klasse hat **eine** Aufgabe – so bleibt das Projekt übersichtlich."},"say":"Wir teilen das Projekt in drei Klassen auf. Das Level kennt die Karte. Der Spieler kennt seine Position und weiß, wie er sich bewegt. Und Main hält alles in der Spielschleife zusammen."}]},{"title":"Die Klasse Level","steps":[{"t":"Kapitel 2","h":"Die Klasse Level","sub":"Karte laden und fragen: Ist hier Boden?","after":"code"},{"layout":"code","console":"clear","code":"class Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\npublic class Main {\n\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        System.out.println(\"Start: \" + lv.startX + \",\" + lv.startY);\n        System.out.println(\"Boden unter dem Start? \" + lv.istFest(1, 5));\n        System.out.println(\"Luft über dem Start? \" + !lv.istFest(1, 3));\n        System.out.println(\"Außerhalb der Karte? \" + lv.istFest(99, 2));\n    }\n}\n","hl":[5,17],"say":"Der Konstruktor kennst du fast schon aus Lektion 11: Er macht aus Text-Zeilen ein `char[][]`. Neu: Er sucht dabei das `@`, merkt sich die Startposition und ersetzt es durch ein Leerzeichen."},{"hl":[19,24],"say":"Die wichtigste Methode heißt `istFest`: Ist an dieser Stelle etwas, durch das man nicht durchkommt? Außerhalb der Karte zählt alles als fest – so kann der Spieler nie hinausfallen."},{"run":true,"say":"Start bei 1,4. Darunter ist Boden, darüber Luft, und außerhalb ist alles fest. Mit dieser einen Methode können wir Laufen, Fallen und Springen bauen."}]},{"title":"Schwerkraft & Springen","steps":[{"t":"Kapitel 3","h":"Schwerkraft & Springen","sub":"Die Physik in drei Regeln","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Die Physik von Pixel-Lauf","items":["**Laufen:** `a`/`d` bewegt nach links/rechts – wenn dort nichts Festes ist","**Springen:** `w` geht nur **auf dem Boden** und gibt 2 Ticks Schwung nach oben","**Schwerkraft:** Ohne Schwung und ohne Boden fällt der Spieler 1 Feld pro Tick","Kombinierbar: `wd` springt nach rechts"],"gap":1},"say":"Unsere Physik hat drei Regeln. Laufen, Springen mit Schwung, und Schwerkraft. Echte Spiele rechnen mit Geschwindigkeiten und Pixeln, aber die Idee ist genau dieselbe."},{"layout":"code","console":"clear","code":"class Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        String[] eingaben = {\"w\", \".\", \".\", \".\"};\n        for (String e : eingaben) {\n            s.update(lv, e);\n            System.out.println(e + \" -> y=\" + s.y + \", Boden: \" + s.aufBoden(lv));\n        }\n    }\n}\n","hl":[48,51],"say":"Hier die Methode `update`. Zuerst die waagrechte Bewegung: Nur wenn neben dem Spieler nichts Festes ist, darf er dorthin."},{"hl":[52,61],"say":"Dann die senkrechte: Hat der Spieler noch Sprung-Schwung, geht es ein Feld nach oben – außer er stößt sich den Kopf. Sonst gilt die Schwerkraft: Kein Boden unter den Füßen? Dann ein Feld runter."},{"run":true,"say":"Schau dir die y-Werte an: Hoch auf 3, hoch auf 2, dann fällt er zurück auf 3 und landet auf 4. Ein kompletter Sprung in vier Ticks!"},{"quiz":{"id":"l12-q1","q":"Warum darf man nur springen, wenn `aufBoden` true ist?","options":["Sonst wäre der Code zu langsam","Sonst könnte man in der Luft immer weiter springen und fliegen","Weil Java das so verlangt","Damit die Münzen funktionieren"],"correct":1,"explain":"Ohne diese Prüfung könnte man mit w, w, w … endlos nach oben fliegen."}}]},{"title":"Die Spielschleife","steps":[{"t":"Kapitel 4","h":"Die Spielschleife","sub":"Alles zusammenstecken","after":"code"},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n    static void zeichne(Level lv, Spieler s) {\n        for (int y = 0; y < lv.feld.length; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < lv.feld[y].length; x++) {\n                if (x == s.x && y == s.y) sb.append('@');\n                else sb.append(lv.feld[y][x]);\n            }\n            System.out.println(sb);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        Scanner sc = new Scanner(System.in);\n        while (sc.hasNextLine()) {\n            String eingabe = sc.nextLine();\n            if (eingabe.equals(\"q\")) break;\n            s.update(lv, eingabe);\n        }\n        zeichne(lv, s);\n        System.out.println(\"Position: \" + s.x + \",\" + s.y);\n    }\n}\n","hl":[68,77],"say":"`zeichne` geht das Feld Zeile für Zeile durch. Wo der Spieler steht, kommt ein `@` hin, sonst die Kachel aus dem Level."},{"hl":[88,97],"say":"Und die Spielschleife: Solange es Eingaben gibt, lesen wir eine Zeile und rufen `update` auf. Am Ende zeichnen wir das Feld. Wir spielen das mal mit sechs Schritten nach rechts und einem Sprung über die Stacheln."},{"run":true,"input":["d","d","d","d","d","d","wd","d","d"],"say":"Der Spieler ist über die Stacheln gesprungen und steht jetzt auf der rechten Plattform. Die Münzen und Stacheln haben aber noch keine Wirkung – das ist dein Job."}]},{"title":"Projekt Teil 1: Physik","steps":[{"t":"Projekt Teil 1","h":"Die Physik","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Teil 1: Schreib update() selbst","items":["Level, zeichne() und die Spielschleife sind fertig","Schreib in `Spieler` die Methode `update(Level lv, String eingabe)`","Laufen mit a/d, Springen mit w (nur auf dem Boden, 2 Ticks Schwung)","Schwerkraft: 1 Feld pro Tick nach unten"],"gap":0.9},"say":"Erster Teil des Projekts: Du schreibst die Physik. Ohne nachzuschauen – du hast alle Regeln gerade gesehen."},{"task":{"id":"l12-physik","nr":1,"title":"Projekt Teil 1: Physik","level":"Projekt","text":["Im Startcode sind die Klasse `Level`, die Methode `zeichne` und die Spielschleife fertig. In der Klasse `Spieler` fehlt die Methode `update(Level lv, String eingabe)`.","Regeln: Enthält die Eingabe „a“ oder „d“, geht der Spieler ein Feld nach links bzw. rechts, falls dort nichts Festes ist. Enthält sie „w“ und der Spieler steht auf dem Boden, bekommt er `sprung = 2`. Danach: Ist `sprung > 0`, geht er ein Feld hoch (falls frei, sonst wird sprung 0) und sprung sinkt um 1. Sonst fällt er ein Feld, wenn unter ihm kein Boden ist."],"req":["Methode `update(Level lv, String eingabe)` in `Spieler`","Laufen mit Kollision","Springen nur auf dem Boden","Schwung nach oben und Kopfstoß","Schwerkraft"],"example":"Eingaben: w . . .\n… (Feld) …\nPosition: 1,4","starter":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x <
