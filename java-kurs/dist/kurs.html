<title>Java-Kurs mit Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>/* Layout: Kopf mit Lektionstitel, darunter der „Video“-Player (immer dunkel, 16:9 auf breiten Schirmen,
   gestapelt auf dem Handy), dann Aufgabe, Kapitel/Noten und Spielplatz. Farben: Java-Orange + Java-Blau. */
code, pre, .ed-code, .ce-hl, .ce-ta, .con-out, .con-live, .vcode, .cmp-code, .example, .time, .fname, .box-val, .box-type, .box-name { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #EEF2F8; --fg: #172033; --muted: #5C6880; --line: #DCE3EE;
  --accent: #C9620A; --accent-soft: #FCEBDD; --blue: #2B67B0; --good: #1F8A5B; --bad: #C2413B;
  --ui: "Lexend", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  /* Player (immer dunkel) */
  --v-bg: #0D1220; --v-panel: #141B2D; --v-panel-2: #1A2338; --v-line: #26314A; --v-fg: #E6ECF6; --v-muted: #8D9AB4;
  --v-accent: #F28C28; --v-blue: #6CA6E8; --v-green: #5FD39B; --v-red: #FF7B72; --v-yellow: #F5C451;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0F18; --surface: #131A27; --surface-2: #1A2232; --fg: #E7ECF5; --muted: #95A1B8; --line: #263043;
  --accent: #F2953B; --accent-soft: #3A2513; --blue: #73A8EA; --good: #57C98F; --bad: #FF7B72; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B0F18; --surface: #131A27; --surface-2: #1A2232; --fg: #E7ECF5; --muted: #95A1B8; --line: #263043;
  --accent: #F2953B; --accent-soft: #3A2513; --blue: #73A8EA; --good: #57C98F; --bad: #FF7B72; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
a { color: var(--blue); }
code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: .05em .35em; border-radius: 5px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.2; margin: 0; }
h2 { font-size: 20px; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h4 { font-size: 15px; margin: 16px 0 6px; }

/* Kopf */
.hero { display: grid; gap: 8px; padding-top: 6px; }
.crumbs { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--accent); font-weight: 600; text-decoration: none; }
.crumbs > * + *::before { content: "·"; margin-right: 10px; }
.brand { color: var(--accent); font-weight: 600; }
.hero h1 { font-size: clamp(30px, 6vw, 48px); font-weight: 800; letter-spacing: -.02em; }
.hero .lead { margin: 0; font-size: 18px; color: var(--muted); max-width: 65ch; }
.hero .meta { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

/* Buttons */
.btn { font: 600 15px var(--ui); border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible, .cbtn:focus-visible, .chap:focus-visible, .qopt:focus-visible { outline: 3px solid var(--v-accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }

/* ---------- Player */
.player { display: grid; gap: 8px; container-type: inline-size; scroll-margin-top: 12px; }
.player:fullscreen { background: #000; align-content: center; padding: 2vh 2vw; }
.stage { position: relative; aspect-ratio: 16 / 9; background: radial-gradient(120% 90% at 0% 0%, #17213A 0%, var(--v-bg) 55%); color: var(--v-fg); border-radius: 18px; overflow: hidden; user-select: none; cursor: pointer;
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 50px -24px rgba(5, 12, 30, .6); font-size: clamp(12px, 1.55cqw, 19px); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px); }
.pane-head { display: flex; align-items: center; gap: 8px; font: 600 .78em var(--ui); color: var(--v-muted); padding: .55em .9em; border-bottom: 1px solid var(--v-line); text-transform: uppercase; letter-spacing: .06em; }
.dots { display: inline-flex; gap: 5px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3A4560; display: block; }
.dots i:nth-child(1) { background: #E5675B; } .dots i:nth-child(2) { background: #E8B04F; } .dots i:nth-child(3) { background: #5DBE72; }
.fname { text-transform: none; letter-spacing: 0; font-family: var(--mono); color: var(--v-fg); }

/* Titelkarte */
.st-title { position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; padding: 0 9%; gap: .4em; opacity: 0; pointer-events: none; transition: opacity .4s; }
.stage[data-lay="title"] .st-title { opacity: 1; }
.st-kicker { font: 700 1.05em var(--ui); color: var(--v-accent); letter-spacing: .14em; text-transform: uppercase; }
.st-h { font: 800 3.6em/1.05 var(--ui); letter-spacing: -.02em; max-width: 16ch; }
.st-sub { font-size: 1.35em; color: var(--v-muted); max-width: 40ch; }
.st-title::before { content: "{ }"; position: absolute; right: 7%; top: 50%; transform: translateY(-50%); font: 700 13em var(--mono); color: rgba(242,140,40,.07); }
.st-title.anim .st-kicker { animation: rise .6s both; } .st-title.anim .st-h { animation: rise .7s .1s both; } .st-title.anim .st-sub { animation: rise .7s .25s both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* Arbeitsfläche */
.st-work { position: absolute; left: 2.6%; right: 2.6%; top: 3.8%; bottom: 25%; display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.6%; transition: opacity .35s, grid-template-columns .45s ease; }
.stage[data-lay="title"] .st-work { opacity: 0; }
.st-editor, .st-console, .st-visual { background: var(--v-panel); border: 1px solid var(--v-line); border-radius: .9em; overflow: hidden; min-height: 0; min-width: 0; display: flex; flex-direction: column; transition: opacity .35s; }
.st-side { display: grid; grid-template-rows: 0fr 1fr; gap: 0; min-height: 0; min-width: 0; transition: grid-template-rows .45s ease; }
.ed-scroll { overflow: auto; flex: 1; scrollbar-width: thin; }
.ed-code { margin: 0; padding: .7em 0; font: 400 .86em/1.6 var(--mono); color: var(--v-fg); white-space: pre; }
.ln { display: flex; transition: opacity .3s, background .3s; }
.ln .no { width: 3.2em; flex: none; text-align: right; padding-right: 1em; color: #4F5C78; }
.ln .tx { flex: 1; padding-right: 1em; }
.ln.hl { background: rgba(242,140,40,.13); box-shadow: inset 3px 0 0 var(--v-accent); }
.ln.dim { opacity: .45; }
.cur { display: inline-block; width: 2px; height: 1.15em; vertical-align: text-bottom; background: var(--v-accent); margin: 0 -1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.c-kw { color: #FF9D5C; font-weight: 600; } .c-ty { color: #7FC3FF; } .c-str { color: #A8E07C; } .c-num { color: #F5C451; } .c-com { color: #6F7D99; font-style: italic; } .c-fn { color: #D7B4FF; } .c-ann { color: #F5C451; }
.st-console { background: #090D17; }
.con-ico { color: var(--v-green); }
.con-out { margin: 0; padding: .6em .9em; font: 400 .82em/1.55 var(--mono); overflow: auto; flex: 1; white-space: pre-wrap; word-break: break-word; }
.cl { min-height: 1.55em; }
.k-cmd { color: var(--v-muted); } .k-out { color: var(--v-fg); } .k-err { color: var(--v-red); } .k-in { color: var(--v-green); font-weight: 600; } .k-meta { color: var(--v-muted); font-style: italic; } .k-hint { color: var(--v-yellow); }

/* Layout-Varianten */
.stage[data-lay="code"] .st-side { grid-template-rows: 0fr 1fr; }
.stage[data-lay="code"] .st-visual { opacity: 0; border-width: 0; }
.stage[data-lay="editor"] .st-work { grid-template-columns: 1fr 0fr; gap: 0; }
.stage[data-lay="editor"] .st-side { opacity: 0; }
.stage[data-lay="split"] .st-side { grid-template-rows: 1fr 0fr; }
.stage[data-lay="split"] .st-console { opacity: 0; border-width: 0; }
.stage[data-lay="all"] .st-side { grid-template-rows: 1.15fr 1fr; gap: .8em; }
.stage[data-lay="visual"] .st-work { grid-template-columns: 0fr 1fr; gap: 0; }
.stage[data-lay="visual"] .st-editor { opacity: 0; border-width: 0; }
.stage[data-lay="visual"] .st-side { grid-template-rows: 1fr 0fr; }
.stage[data-lay="visual"] .st-console { opacity: 0; border-width: 0; }
.stage[data-lay="vcon"] .st-work { grid-template-columns: 0fr 1fr; gap: 0; }
.stage[data-lay="vcon"] .st-editor { opacity: 0; border-width: 0; }
.stage[data-lay="vcon"] .st-side { grid-template-rows: 1fr 1fr; gap: .8em; }

/* Schaubilder */
.st-visual { background: linear-gradient(160deg, var(--v-panel-2), var(--v-panel)); }
.vis { padding: 1.1em 1.3em; overflow: auto; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .6em; }
.vis h4 { margin: 0 0 .3em; font-size: 1.15em; color: var(--v-fg); }
[data-s] { opacity: 0; transform: translateY(10px) scale(.98); transition: opacity .45s, transform .45s cubic-bezier(.2,.9,.3,1.2); }
[data-s].in { opacity: 1; transform: none; }
.bul { margin: 0; padding: 0; list-style: none; display: grid; gap: .55em; }
.bul li { padding: .55em .8em .55em 2.2em; background: rgba(255,255,255,.04); border: 1px solid var(--v-line); border-radius: .7em; position: relative; font-size: 1.02em; }
.bul li::before { content: "›"; position: absolute; left: .8em; color: var(--v-accent); font-weight: 800; }
.bul code, .say code, .vt code, .fstep code, .big code, .vnote code, .cmp-note code, .quiz-card code { background: rgba(255,255,255,.08); color: #FFD3A8; }
.big { text-align: center; display: grid; gap: .5em; }
.big-main { font: 800 2.3em/1.15 var(--ui); letter-spacing: -.01em; }
.big-sub { color: var(--v-muted); font-size: 1.1em; }
.boxes { display: flex; flex-wrap: wrap; gap: 1em; justify-content: center; }
.box { display: grid; justify-items: center; gap: .25em; min-width: 6.5em; }
.box-type { font: 600 .8em var(--mono); color: var(--v-blue); }
.box-val { min-width: 5.5em; padding: .55em .8em; text-align: center; font: 700 1.25em var(--mono); background: #0B111E; border: 2px solid var(--v-accent); border-radius: .5em; color: var(--v-yellow); box-shadow: 0 6px 0 -2px rgba(242,140,40,.25); }
.box-val.str { color: #A8E07C; } .box-val.bool { color: #D7B4FF; } .box-val.ch { color: #7FC3FF; }
.box-name { font: 700 1em var(--mono); color: var(--v-fg); }
.vnote { margin: .3em 0 0; color: var(--v-muted); text-align: center; }
.vt { width: 100%; border-collapse: collapse; font-size: .92em; }
.vt th { text-align: left; color: var(--v-muted); font-weight: 600; border-bottom: 1px solid var(--v-line); padding: .35em .5em; }
.vt td { padding: .45em .5em; border-bottom: 1px solid rgba(255,255,255,.05); }
.vt td:first-child code { color: #FF9D5C; }
.flow { display: grid; gap: .25em; justify-items: center; }
.fstep { display: grid; gap: .1em; text-align: center; padding: .55em 1em; border: 1.5px solid var(--v-line); border-radius: .7em; background: rgba(255,255,255,.03); min-width: 70%; }
.fstep span { color: var(--v-muted); font-size: .88em; }
.fstep.hot { border-color: var(--v-accent); background: rgba(242,140,40,.1); }
.fstep.ok { border-color: var(--v-green); }
.arrow { color: var(--v-accent); font-weight: 800; line-height: 1; }
.flow.row { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: center; gap: .4em; }
.flow.row .arrow { grid-column: auto; text-align: center; }
.flow.row { grid-template-columns: none; }
.flow.row .fstep { min-width: 0; height: 100%; align-content: center; padding: .8em .5em; }
.flow.row .fstep b { font-size: .95em; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; }
.cmp-col { border: 1.5px solid var(--v-line); border-radius: .7em; padding: .7em; background: rgba(0,0,0,.2); min-width: 0; }
.cmp-col.good { border-color: var(--v-green); } .cmp-col.bad { border-color: var(--v-red); }
.cmp-h { font-weight: 700; margin-bottom: .4em; }
.cmp-code, .vcode { margin: 0; font: .8em/1.55 var(--mono); white-space: pre-wrap; color: var(--v-fg); background: #0B111E; border-radius: .5em; padding: .6em .7em; overflow: auto; }
.cmp-note { margin-top: .5em; font-size: .88em; color: var(--v-muted); }

/* Erklärer unten */
.st-narr { position: absolute; left: 2.6%; right: 2.6%; bottom: 3.6%; height: 18.5%; display: flex; gap: 1em; align-items: center; padding: .6em 1.2em .6em .8em; background: rgba(20,27,45,.92); border: 1px solid var(--v-line); border-radius: 1em; transition: opacity .3s; }
.stage[data-lay="title"] .st-narr { background: transparent; border-color: transparent; }
.st-narr.empty { opacity: 0; }
.avatar { flex: none; width: 3.2em; height: 3.2em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFB36B, #E0702A); display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(242,140,40,.25); }
.avatar::before { content: "☕"; font-size: 1.5em; }
.stage.playing .avatar { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg); } }
.say { margin: 0; font-size: 1.22em; line-height: 1.4; font-weight: 500; }
.say .w { opacity: .12; transition: opacity .25s; }
.say .w.on { opacity: 1; }

/* Quiz, Ende, Sperre */
.st-gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,10,20,.72); backdrop-filter: blur(3px); cursor: default; padding: 4%; }
.quiz-card { width: min(92%, 34em); background: var(--v-panel-2); border: 1px solid var(--v-line); border-radius: 1.1em; padding: 1.4em 1.5em; display: grid; gap: .8em; box-shadow: 0 30px 60px -30px #000; animation: rise .4s both; }
.quiz-kick { color: var(--v-accent); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .85em; }
.quiz-card h3 { font-size: 1.4em; }
.quiz-opts { display: grid; gap: .5em; }
.qopt { font: 500 1em var(--ui); text-align: left; padding: .7em 1em; border-radius: .7em; border: 1.5px solid var(--v-line); background: rgba(255,255,255,.04); color: var(--v-fg); cursor: pointer; }
.qopt:hover:not(:disabled) { border-color: var(--v-accent); }
.qopt.right { border-color: var(--v-green); background: rgba(95,211,155,.14); }
.qopt.wrong { border-color: var(--v-red); background: rgba(255,123,114,.12); }
.quiz-fb p { margin: 0 0 .7em; }
.quiz-card .btn { font-size: .95em; }
.st-lock { position: absolute; inset: 0; display: grid; place-items: center; background: repeating-linear-gradient(45deg, #0B1020 0 14px, #0E1428 14px 28px); cursor: default; z-index: 3; }
.stage.locked > :not(.st-lock) { visibility: hidden; }
.lock-card { text-align: center; display: grid; gap: .6em; justify-items: center; width: min(90%, 30em); background: var(--v-panel-2); border: 1px solid var(--v-line); border-radius: 1.2em; padding: 1.6em; }
.lock-ico { font-size: 2.6em; }
.lock-card h3 { font-size: 1.5em; }
.lock-card p { margin: 0; color: var(--v-muted); }
.st-bigplay { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 5.2em; height: 5.2em; border-radius: 50%; border: 0; background: var(--v-accent); color: #1A0E02; font-size: 1em; cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 .6em rgba(242,140,40,.2); transition: opacity .3s, transform .3s; z-index: 2; }
.st-bigplay span { font-size: 2em; margin-left: .15em; }
.stage.started .st-bigplay { left: auto; top: auto; right: 3.5%; top: 5%; width: 3em; height: 3em; transform: none; box-shadow: 0 0 0 .35em rgba(242,140,40,.2); }
.stage.started .st-bigplay span { font-size: 1.2em; }
.stage.playing .st-bigplay, .stage.locked .st-bigplay { opacity: 0; pointer-events: none; }

/* Steuerleiste */
.controls { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.cbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 16px; cursor: pointer; display: grid; place-items: center; flex: none; }
.cbtn.play { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 15px; }
.cbtn.off { opacity: .4; text-decoration: line-through; }
.cbtn:disabled { opacity: .4; cursor: default; }
.seekwrap { position: relative; flex: 1; min-width: 60px; height: 38px; display: flex; align-items: center; }
#c-seek { width: 100%; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--surface-2) var(--p, 0%)); outline-offset: 4px; cursor: pointer; }
#c-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
#c-seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
#c-seek:disabled { cursor: not-allowed; filter: grayscale(.8); }
.marks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
.marks .cm { position: absolute; width: 2px; height: 12px; top: -6px; background: var(--muted); opacity: .45; }
.marks .gm { position: absolute; width: 12px; height: 12px; top: -15px; margin-left: -6px; border-radius: 3px; background: var(--bad); }
.marks .gm.quiz { background: var(--blue); border-radius: 50%; width: 10px; height: 10px; margin-left: -5px; top: -14px; }
.marks .gm.done { background: var(--good); }
.time { font: 600 13px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#c-speed { font: 600 13px var(--ui); border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 10px; height: 38px; padding: 0 6px; }
.nowchap { font-size: 14px; color: var(--muted); padding-left: 4px; min-height: 21px; }

/* ---------- Aufgabe */
.task { background: var(--surface); border: 2px solid var(--accent); border-radius: 18px; padding: 20px; display: grid; gap: 16px; scroll-margin-top: 12px; }
.task-kick { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.task-head h2 { font-size: 26px; margin-top: 4px; }
.task-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; }
.task-text p { margin: 0 0 10px; max-width: 62ch; }
.req { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.example { font: 13px/1.5 var(--mono); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 0; white-space: pre-wrap; overflow-x: auto; }
.task-note { font-size: 14px; color: var(--muted); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-top: 14px !important; }
.task-work { display: grid; gap: 10px; min-width: 0; }
.task-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.task-con, .playground .task-con { background: #090D17; border-radius: 12px; overflow: hidden; border: 1px solid #1E2740; }
.task-con .pane-head { color: #8D9AB4; border-color: #1E2740; font-size: 12px; }
.con-live { margin: 0; padding: 10px 12px; font: 13px/1.55 var(--mono); color: #E6ECF6; min-height: 110px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.con-in { font: 600 13px var(--mono); background: #131C30; color: var(--v-green); border: 1px solid #2C3A5C; border-radius: 6px; padding: 2px 6px; min-width: 12ch; outline: none; }
.con-in:focus { border-color: var(--v-accent); }

  const PRIMS = new Set(['int', 'long', 'short', 'byte', 'double', 'float', 'char', 'boolean']);
  const OPS = ['>>>=', '<<=', '>>=', '>>>', '...', '->', '::', '++', '--', '&&', '||', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '<<', '>>', '(', ')', '{', '}', '[', ']', ';', ',', '.', '@', '=', '<', '>', '!', '~', '?', ':', '+', '-', '*', '/', '&', '|', '^', '%'];

, `class` heißt „jetzt kommt eine Klasse“. Und alles zwischen der geschweiften Klammer `{` und der schließenden `}` gehört zur Klasse."},{"code":"\npublic class Main {\n    public static void main(String[] args) {\n\n    }\n}\n","hl":[2,4],"say":"Jetzt kommt die wichtigste Zeile: die **main-Methode**. Hier startet jedes Java-Programm. Alles, was zwischen ihren Klammern steht, wird der Reihe nach ausgeführt."},{"layout":"split","visual":{"kind":"bullets","title":"Die Start-Zeile","items":["`public` – von außen aufrufbar","`static` – gehört zur Klasse (lernst du später)","`void` – gibt nichts zurück","`main` – der Startpunkt des Programms","`String[] args` – Startwerte (brauchen wir kaum)"],"gap":0.9},"hl":[2,2],"say":"Diese Zeile sieht am Anfang wild aus. Merk sie dir einfach wie eine Zauberformel. Was die einzelnen Wörter genau bedeuten, lernst du im Lauf des Kurses."},{"layout":"editor","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hallo Welt!\");\n    }\n}\n","hl":[3,3],"say":"Und jetzt der eigentliche Befehl: `System.out.println(...)` schreibt etwas in die **Konsole** – das ist das Textfenster, in dem die Ausgabe erscheint."},{"hl":[3,3],"say":"Text steht in Java immer in **Anführungszeichen** `\"…\"`. So ein Text heißt **String**. Und ganz wichtig: Jede Anweisung endet mit einem **Strichpunkt** `;`."},{"layout":"code","run":true,"say":"Zeit für den großen Moment: Wir führen das Programm aus!"},{"say":"Da steht es: **Hallo Welt!** 🎉 Herzlichen Glückwunsch, das war dein erstes Java-Programm. Genau so fangen alle Programmierer an."},{"layout":"split","visual":{"kind":"code","title":"Das gleiche Programm, ohne Einrückung:","code":"public class Main{public static void main(String[] args){System.out.println(\"Hallo Welt!\");}}","note":"Läuft genauso – aber niemand will das lesen. Rück deinen Code immer ordentlich ein!","noteAt":1.5},"say":"Übrigens: Leerzeichen und Einrückungen sind Java egal. Für Menschen sind ] args) {\n        // Mein Bild: eine Katze\n        System.out.println(\"      /\\\\_/\\\\\");\n        System.out.println(\"     ( o.o )\");\n        System.out.println(\"      > ^ <\");\n        System.out.println(\"     /     \\\\\");\n        System.out.println(\"    (_______)\");\n        System.out.println(\"   \\\"Miau!\\\"\");\n    }\n}\n","tests":[{"name":"Bild mit mindestens 5 Zeilen","input":[],"expect":[{"re":"(.*\\n){5,}","label":"mindestens 5 Zeilen Ausgabe"}]}],"codeChecks":[{"label":"Escape-Sequenz \\\\ oder \\\" verwendet","re":"\\\\\\\\|\\\\\""},{"label":"Kommentar vorhanden","re":"//|/\\*"},{"label":"mindestens 5-mal println","re":"(System\\.out\\.println[\\s\\S]*){5}"}],"rubric":[["Programm kompiliert und läuft",30],["Bild mit mindestens 5 Zeilen, erkennbar und mit Mühe gemacht",35],["Escape-Sequenz \\\\ oder \\\" richtig benutzt",20],["Kommentar beschreibt das Bild",15]],"tip":"Zeichne dein Bild zuerst auf Papier oder im Kopf Zeile für Zeile – dann übertrag jede Zeile in ein println."}},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        // Mein Bild: eine Katze\n        System.out.println(\"      /\\\\_/\\\\\");\n        System.out.println(\"     ( o.o )\");\n        System.out.println(\"      > ^ <\");\n        System.out.println(\"     /     \\\\\");\n        System.out.println(\"    (_______)\");\n        System.out.println(\"   \\\"Miau!\\\"\");\n    }\n}\n","run":true,"say":"Fertig! So sieht die Beispiel-Katze aus. Deine Zeichnung ist bestimmt kreativer. 😺"},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["Ein Java-Programm mit Klasse und `main` schreiben","Text mit `println` und `print` ausgeben","Sonderzeichen wie `\\n`, `\\t` und `\\\"` benutzen","Fehlermeldungen lesen und Fehler beheben","Kommentare schreiben"],"gap":0.8},"say":"Das war Lektion 1! In Lektion 2 lernst du **Variablen** – damit kann sich dein Programm Dinge merken und rechnen. Bis gleich!"}]}]},{"id":"java-02","nr":2,"title":"Variablen & Datentypen","sub":"Wie sich dein Programm Dinge merkt, rechnet und Text mit Zahlen verbindet.","outro":"Du kennst jetzt Variablen, die wichtigsten Datentypen und die Rechenzeichen – inklusive der Falle bei der Ganzzahl-Division. In Lektion 3 lernst du Eingaben und Entscheidungen mit if und else.","playground":"public class Main {\n    public static void main(String[] args) {\n        int punkte = 10;\n        double preis = 4.99;\n        String name = \"Lena\";\n        System.out.println(name + \" hat \" + punkte + \" Punkte.\");\n    }\n}\n","chapters":[{"title":"Warum Variablen?","steps":[{"t":"Lektion 2","h":"Variablen & Datentypen","sub":"Wie sich dein Programm Dinge merkt","say":"Servus und willkommen zurück! In Lektion 1 hat dein Programm nur fixen Text ausgegeben. Heute lernst du, wie es sich Dinge merken und damit rechnen kann."},{"layout":"visual","visual":{"kind":"bullets","title":"Ein Programm muss sich vieles merken","items":["deinen **Namen** im Spiel","deine **Punkte** und **Leben**","den **Preis** von etwas im Shop","ob du schon **eingeloggt** bist"],"gap":0.9},"say":"Fast jedes Programm muss sich etwas merken: deinen Namen, deine Punkte, einen Preis oder ob du eingeloggt bist. Dafür gibt es **Variablen**."},{"visual":{"kind":"boxes","title":"Eine Variable ist wie eine beschriftete Box","vars":[{"type":"int","name":"punkte","value":"120"},{"type":"String","name":"spieler","value":"\"Lena\"","cls":"str"},{"type":"boolean","name":"eingeloggt","value":"true","cls":"bool"}],"gap":0.9,"note":"Jede Box hat einen **Namen**, einen **Typ** und einen **Wert**.","noteAt":3.2},"say":"Stell dir eine Variable wie eine beschriftete Box vor. Außen steht der **Name**, drinnen liegt der **Wert**. Und der **Typ** sagt, was überhaupt hineinpassen darf."}]},{"title":"Variablen anlegen","steps":[{"t":"Kapitel 2","h":"Variablen anlegen","sub":"Deklarieren und zuweisen","after":"split"},{"layout":"split","visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"?"}],"start":0.4},"code":"public class Main {\n    public static void main(String[] args) {\n        int punkte;\n    }\n}\n","hl":[3,3],"say":"So legst du eine Variable an: zuerst der **Typ**, dann der **Name**, dann ein Strichpunkt. Das nennt man **Deklarieren**. `int` steht für ganze Zahlen."},{"visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"10"}],"start":0.4},"code":"public class Main {\n    public static void main(String[] args) {\n        int punkte;\n        punkte = 10;\n    }\n}\n","hl":[4,4],"say":"Mit dem Gleichheitszeichen legst du einen Wert in die Box. Das heißt **Zuweisen**. Jetzt steckt die Zahl 10 in der Variable `punkte`."},{"visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"10","s":0},{"type":"int","name":"leben","value":"3"}],"start":0.6},"code":"public class Main {\n    public static void main(String[] args) {\n        int punkte;\n        punkte = 10;\n        int leben = 3;\n    }\n}\n","hl":[5,5],"say":"Meistens macht man beides in einer Zeile: deklarieren und gleich einen Startwert zuweisen. `int leben = 3;` – fertig."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int punkte;\n        punkte = 10;\n        int leben = 3;\n        System.out.println(punkte);\n        System.out.println(\"punkte\");\n        System.out.println(\"Leben: \" + leben);\n    }\n}\n","hl":[6,8],"say":"Jetzt geben wir die Werte aus. Achtung, Unterschied: Ohne Anführungszeichen meint Java die **Variable**. Mit Anführungszeichen ist es nur ein Text."},{"run":true,"say":"Siehst du? `punkte` ohne Anführungszeichen ergibt 10. Mit Anführungszeichen kommt einfach das Wort „punkte“ heraus. Und mit `+` hängst du den Wert an einen Text."},{"quiz":{"id":"l2-q1","q":"Was gibt dieser Code aus?\n`int x = 5;`\n`System.out.println(\"x\");`","options":["5","x","einen Fehler"],"correct":1,"explain":"Mit Anführungszeichen ist es ein Text – also wird einfach der Buchstabe x ausgegeben. Für den Wert müsste es `println(x)` heißen."}}]},{"title":"Datentypen","steps":[{"t":"Kapitel 3","h":"Die wichtigsten Datentypen","sub":"Welche Box für welchen Wert?","after":"visual"},{"layout":"visual","visual":{"kind":"table","title":"Die fünf wichtigsten Typen","head":["Typ","Was passt hinein?","Beispiel"],"rows":[["`int`","ganze Zahlen","`42`, `-7`, `0`"],["`double`","Kommazahlen (mit Punkt!)","`3.14`, `-0.5`"],["`boolean`","wahr oder falsch","`true`, `false`"],["`char`","ein einzelnes Zeichen","`'A'`, `'?'`"],["`String`","Text (beliebig lang)","`\"Hallo\"`"]],"gap":0.8},"say":"Für jede Art von Wert gibt es einen passenden Typ. Diese fünf brauchst du am Anfang fast immer."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int alter = 14;\n        double groesse = 1.68;\n        boolean hatHaustier = true;\n        char note = 'A';\n        String name = \"Lena\";\n        System.out.println(name + \" ist \" + alter + \" Jahre alt.\");\n        System.out.println(\"Größe: \" + groesse + \" m\");\n        System.out.println(\"Haustier? \" + hatHaustier + \", Lieblingsbuchstabe: \" + note);\n    }\n}\n","hl":[3,7],"say":"Hier sind alle fünf in Aktion. Schau dir genau an, wie die Werte geschrieben werden."},{"hl":[7,7],"say":"Zwei Dinge sind wichtig: `String` wird **großgeschrieben**, weil es eine Klasse ist. Und ein `char` steht in **einfachen** Anführungszeichen, ein String in doppelten."},{"run":true,"say":"Alle Werte landen sauber in der Ausgabe – egal ob Zahl, Text oder true und false."},{"console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        double preis = 2,50;\n        System.out.println(preis);\n    }\n}\n","hl":[3,3],"say":"Achtung, Österreich-Falle! Bei uns schreibt man Kommazahlen mit Beistrich. Java versteht aber nur den **Punkt** – 2,50 geht schief."},{"run":true,"expectError":true,"say":"Der Compiler meckert, weil er das Komma nicht versteht. Richtig wäre `2.50` – mit Punkt."},{"console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        double preis = 2.50;\n        System.out.println(preis);\n    }\n}\n","run":true,"say":"Mit Punkt klappt es. Übrigens zeigt Java `2.5` an – die Null am Ende lässt es einfach weg."},{"quiz":{"id":"l2-q2","q":"Welcher Typ passt für den Wert 3.75?","options":["`int`","`double`","`char`","`boolean`"],"correct":1,"explain":"3.75 hat Nachkommastellen, also braucht es `double`. In ein `int` passen nur ganze Zahlen."}}]},{"title":"Werte ändern","steps":[{"t":"Kapitel 4","h":"Werte ändern","sub":"Variablen heißen so, weil sie variabel sind","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"10"}],"start":0.3},"code":"public class Main {\n    public static void main(String[] args) {\n        int punkte = 10;\n        punkte = 25;\n    }\n}\n","hl":[4,4],"say":"Der Wert einer Variable kann sich jederzeit ändern. Weist du einen neuen Wert zu, wird der alte einfach überschrieben."},{"visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"25"}],"start":0.3},"say":"Jetzt steckt 25 in der Box. Die 10 ist weg – eine Variable kann sich immer nur **einen** Wert merken."},{"visual":{"kind":"boxes","vars":[{"type":"int","name":"punkte","value":"30"}],"start":1.5,"note":"Rechts ausrechnen (25 + 5 = 30), dann links speichern.","noteAt":2.5},"code":"public class Main {\n    public static void main(String[] args) {\n        int punkte = 10;\n        punkte = 25;\n        punkte = punkte + 5;\n    }\n}\n","hl":[5,5],"say":"Und das hier? `punkte = punkte + 5;` Mathematisch ist das Unsinn – aber in Java heißt `=` nicht „ist gleich“, sondern „**speichere**“: Erst wird rechts gerechnet, dann links gespeichert."},{"layout":"code","code":"public class Main {\n    public static void main(String[] args) {\n        int punkte = 10;\n        punkte = 25;\n        punkte = punkte + 5;\n        punkte += 5;     // Kurzform für: punkte = punkte + 5\n        punkte++;        // erhöht um genau 1\n        punkte--;        // verringert um genau 1\n        System.out.println(\"Punkte: \" + punkte);\n    }\n}\n","hl":[6,8],"say":"Weil man das ständig braucht, gibt es Kurzformen: `+=` addiert etwas dazu, `++` zählt um eins hoch, `--` zählt um eins herunter."},{"run":true,"say":"Rechnen wir mit: 25 plus 5 ist 30, plus 5 ist 35, plus 1 ist 36, minus 1 ist wieder 35."}]},{"title":"Rechnen mit Java","steps":[{"t":"Kapitel 5","h":"Rechnen mit Java","sub":"+ − * / und das geheimnisvolle %","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"table","title":"Rechenzeichen","head":["Zeichen","Bedeutung","Beispiel"],"rows":[["`+`","plus","`7 + 2` → 9"],["`-`","minus","`7 - 2` → 5"],["`*`","mal","`7 * 2` → 14"],["`/`","geteilt","`7 / 2` → **3** (!)"],["`%`","Rest der Division","`7 % 2` → 1"]],"gap":0.7},"code":"public class Main {\n    public static void main(String[] args) {\n        int a = 7;\n        int b = 2;\n        System.out.println(a + b);\n        System.out.println(a - b);\n        System.out.println(a * b);\n        System.out.println(a / b);\n        System.out.println(a % b);\n    }\n}\n","hl":[5,9],"say":"Java rechnet mit den bekannten Zeichen. Mal ist ein Stern, geteilt ein Schrägstrich. Und dann gibt es noch das Prozentzeichen – dazu gleich mehr."},{"layout":"all","run":true,"hl":[8,8],"say":"Moment – 7 geteilt durch 2 ergibt 3? Das ist die berühmteste Falle in Java: Teilst du zwei `int`-Werte, kommt wieder ein `int` heraus. Die Nachkommastellen werden einfach **abgeschnitten**."},{"hl":[9,9],"say":"Und `%` heißt **Modulo**: Es gibt den Rest der Division. 7 durch 2 ist 3, Rest 1. Damit prüft man zum Beispiel, ob eine Zahl gerade ist: Dann ist der Rest 0."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int a = 7;\n        int b = 2;\n        System.out.println(a / b);         // 3 (int geteilt durch int)\n        System.out.println(a / 2.0);       // 3.5 (eine Kommazahl ist dabei)\n        System.out.println((double) a / b); // 3.5 (umgewandelt)\n        System.out.println((int) 9.99);     // 9 (abgeschnitten, nicht gerundet!)\n    }\n}\n","hl":[6,7],"say":"Willst du das genaue Ergebnis, muss mindestens eine Kommazahl dabei sein: zum Beispiel `2.0` statt `2`, oder du wandelst mit `(double)` um."},{"run":true,"hl":[8,8],"say":"Umgekehrt macht `(int)` aus einer Kommazahl eine ganze Zahl. Achtung: Es wird nicht gerundet, sondern abgeschnitten. Aus 9.99 wird 9."},{"quiz":{"id":"l2-q3","q":"Was ergibt `17 / 5` in Java (beides int)?","options":["3.4","3","4","2"],"correct":1,"explain":"17 geteilt durch 5 ist 3,4 – aber bei int wird der Kommateil abgeschnitten. Übrig bleibt 3. (Und `17 % 5` wäre der Rest: 2.)"}}]},{"title":"Text und Zahlen verbinden","steps":[{"t":"Kapitel 6","h":"Text + Zahlen","sub":"Die Plus-Falle","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        String name = \"Max\";\n        int punkte = 42;\n        System.out.println(name + \" hat \" + punkte + \" Punkte\");\n        System.out.println(\"Summe: \" + 2 + 3);\n        System.out.println(\"Summe: \" + (2 + 3));\n        System.out.println(2 + 3 + \" ist die Summe\");\n    }\n}\n","hl":[5,5],"say":"Mit `+` verbindest du Text mit Variablen. Das kennst du schon. Aber Vorsicht – schau dir die nächsten Zeilen genau an."},{"run":true,"hl":[6,8],"say":"„Summe: 23“? Java liest von links nach rechts: Zuerst wird „Summe: “ mit 2 verbunden – ab da ist alles Text, und die 3 wird nur angehängt. Mit **Klammern** wird zuerst gerechnet."},{"hl":[8,8],"say":"In der letzten Zeile stehen die Zahlen ganz vorne. Da rechnet Java zuerst 2 plus 3, und erst dann kommt der Text dazu. Reihenfolge ist alles!"},{"quiz":{"id":"l2-q4","q":"Was gibt `System.out.println(\"Ergebnis: \" + 4 * 2);` aus?","options":["Ergebnis: 42","Ergebnis: 8","Ergebnis: 4 * 2"],"correct":1,"explain":"Punkt vor Strich gilt auch hier: `4 * 2` wird zuerst ausgerechnet, erst dann wird die 8 an den Text gehängt."}}]},{"title":"Aufgabe: Taschengeld-Rechner","steps":[{"t":"Aufgabe 1","h":"Taschengeld-Rechner","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 1: Taschengeld-Rechner","items":["Speichere Name, Taschengeld pro Woche und Anzahl Wochen in **Variablen**","Rechne aus, wie viel Geld insgesamt zusammenkommt","Ziehe den Preis von etwas ab, das du kaufen willst","Gib alles schön mit Text aus"],"gap":0.9},"say":"Jetzt bist du dran: Bau einen kleinen **Taschengeld-Rechner**. Denk an die passenden Typen – Geldbeträge haben Nachkommastellen!"},{"task":{"id":"l2-taschengeld","nr":1,"title":"Taschengeld-Rechner","text":["Schreib ein Programm, das ausrechnet, wie viel Taschengeld nach einigen Wochen zusammenkommt – und wie viel übrig bleibt, wenn du dir etwas kaufst (z. B. ein Spiel).","Die Werte schreibst du direkt in den Code (Eingaben lernst du in Lektion 3)."],"req":["Eine `String`-Variable für den Namen","Eine `double`-Variable für das Taschengeld pro Woche (z. B. 7.50)","Eine `int`-Variable für die Anzahl der Wochen","Eine Rechnung mit `*` für das Gesamtgeld und eine mit `-` für den Rest nach dem Kauf","Ausgabe mit Text und Variablen, verbunden mit `+`"],"example":"Lena spart 6 Wochen lang 7.5 Euro.\nInsgesamt: 45.0 Euro\nNach dem Kauf von \"Minecraft\" (29.99 Euro) bleiben 15.01 Euro.","starter":"public class Main {\n    public static void main(String[] args) {\n        String name = \"Lena\";\n        // Lege hier deine weiteren Variablen an\n\n    }\n}\n","solution":"public class Main {\n    public static void main(String[] args) {\n        String name = \"Lena\";\n        double proWoche = 7.50;\n        int wochen = 6;\n        double gesamt = proWoche * wochen;\n        String spiel = \"Minecraft\";\n        double preis = 29.99;\n        double rest = gesamt - preis;\n        System.out.println(name + \" spart \" + wochen + \" Wochen lang \" + proWoche + \" Euro.\");\n        System.out.println(\"Insgesamt: \" + gesamt + \" Euro\");\n        System.out.println(\"Nach dem Kauf von \\\"\" + spiel + \"\\\" (\" + preis + \" Euro) bleiben \" + rest + \" Euro.\");\n    }\n}\n","tests":[{"name":"Programm läuft und gibt Beträge aus","input":[],"expect":[{"re":"\\d","label":"Zahlen in der Ausgabe"},{"re":"(.+\\n){2,}","label":"mindestens 2 Zeilen Ausgabe"}]}],"codeChecks":[{"label":"String-Variable","re":"\\bString\\s+\\w+\\s*="},{"label":"double-Variable","re":"\\bdouble\\s+\\w+\\s*="},{"label":"int-Variable","re":"\\bint\\s+\\w+\\s*="},{"label":"Multiplikation mit *","re":"\\w\\s*\\*\\s*\\w"},{"label":"Subtraktion mit -","re":"\\w\\s*-\\s*\\w"}],"rubric":[["Programm kompiliert und läuft",25],["Passende Datentypen (String, double, int)",25],["Richtige Rechnungen für Gesamtgeld und Rest",30],["Verständliche Ausgabe mit Text und Variablen",20]],"tip":"Wenn bei Geldbeträgen komische Zahlen wie 15.010000000000002 herauskommen, ist das normal bei double – in Lektion 3 lernst du printf, damit sieht es schöner aus."}},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        String name = \"Lena\";\n        double proWoche = 7.50;\n        int wochen = 6;\n        double gesamt = proWoche * wochen;\n        String spiel = \"Minecraft\";\n        double preis = 29.99;\n        double rest = gesamt - preis;\n        System.out.println(name + \" spart \" + wochen + \" Wochen lang \" + proWoche + \" Euro.\");\n        System.out.println(\"Insgesamt: \" + gesamt + \" Euro\");\n        System.out.println(\"Nach dem Kauf von \\\"\" + spiel + \"\\\" (\" + preis + \" Euro) bleiben \" + rest + \" Euro.\");\n    }\n}\n","hl":[4,9],"say":"Abgegeben! Hier eine mögliche Lösung. Jede Zahl hat ihre eigene Variable mit einem gut lesbaren Namen."},{"run":true,"say":"Schau dir den Rest an: 15.010000000000002! Kommazahlen sind im Computer nicht ganz exakt gespeichert. Wie man das schön rundet, lernst du in der nächsten Lektion."}]},{"title":"Namen & Konstanten","steps":[{"t":"Kapitel 8","h":"Gute Namen & Konstanten","sub":"Regeln, die Profis einhalten","after":"visual"},{"layout":"visual","visual":{"kind":"table","title":"Erlaubt oder nicht?","head":["Name","Okay?","Warum"],"rows":[["`punkte`","✅","klein, sprechend"],["`anzahlLeben`","✅","camelCase: neue Wörter groß"],["`2spieler`","❌","darf nicht mit Ziffer anfangen"],["`mein name`","❌","keine Leerzeichen"],["`class`","❌","reserviertes Java-Wort"],["`x`","⚠️","erlaubt, aber nichtssagend"]],"gap":0.7},"say":"Variablennamen haben Regeln: keine Leerzeichen, nicht mit einer Ziffer anfangen und keine Java-Wörter wie `class`. Profis schreiben im **camelCase**: klein anfangen, jedes neue Wort groß."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        final double MWST = 0.20;   // Mehrwertsteuer in Österreich\n        double netto = 50.0;\n        double brutto = netto + netto * MWST;\n        System.out.println(\"Brutto: \" + brutto + \" Euro\");\n    }\n}\n","hl":[3,3],"say":"Und wenn sich ein Wert nie ändern darf? Dann schreibst du `final` davor. Das ist eine **Konstante**. Die schreibt man üblicherweise in GROSSBUCHSTABEN."},{"run":true,"say":"50 Euro netto plus 20 Prozent Steuer ergeben 60 Euro. Würde jemand später `MWST = 0.5;` schreiben, meldet Java sofort einen Fehler."},{"quiz":{"id":"l2-q5","q":"Welcher Variablenname ist erlaubt UND gut gewählt?","options":["`Anzahl Fische`","`3fische`","`anzahlFische`","`int`"],"correct":2,"explain":"`anzahlFische` ist camelCase, beginnt mit einem Buchstaben, hat keine Leerzeichen und ist kein Java-Wort."}}]},{"title":"Aufgabe: Angel-Statistik","steps":[{"t":"Aufgabe 2","h":"Angel-Statistik","sub":"Rechnen mit / und %","after":"visual"},{"layout":"visual","visual":{"kind":"boxes","title":"Dein Fang heute","vars":[{"type":"int","name":"hecht","value":"2350"},{"type":"int","name":"zander","value":"1780"},{"type":"int","name":"forelle","value":"640"}],"gap":0.8,"note":"Gewichte in **Gramm**","noteAt":2.6},"say":"Letzte Aufgabe! Du warst angeln und hast drei Fische gefangen. Die Gewichte sind in Gramm gespeichert. Jetzt soll dein Programm eine kleine Statistik ausgeben."},{"task":{"id":"l2-angeln","nr":2,"title":"Angel-Statistik","text":["Du hast drei Fische gefangen: einen Hecht (2350 g), einen Zander (1780 g) und eine Forelle (640 g). Speichere die Gewichte in `int`-Variablen.","Gib aus: das Gesamtgewicht in Gramm, das **Durchschnittsgewicht** (mit Nachkommastellen!) und das Gesamtgewicht als „… kg und … g“ – dafür brauchst du `/` und `%`."],"req":["Drei `int`-Variablen für die Gewichte","Gesamtgewicht in Gramm ausgeben","Durchschnitt als Kommazahl (z. B. `1590.0`) – Achtung Ganzzahl-Division!","Gesamtgewicht als Kilo und Gramm mit `/ 1000` und `% 1000`","Ausgabe mit erklärendem Text"],"example":"Gesamtgewicht: 4770 g\nDurchschnitt: 1590.0 g\nDas sind 4 kg und 770 g.","starter":"public class Main {\n    public static void main(String[] args) {\n        int hecht = 2350;\n        int zander = 1780;\n        int forelle = 640;\n        // Rechne und gib die Statistik aus\n\n    }\n}\n","solution":"public class Main {\n    public static void main(String[] args) {\n        int hecht = 2350;\n        int zander = 1780;\n        int forelle = 640;\n        int gesamt = hecht + zander + forelle;\n        double schnitt = gesamt / 3.0;\n        int kilo = gesamt / 1000;\n        int gramm = gesamt % 1000;\n        System.out.println(\"Gesamtgewicht: \" + gesamt + \" g\");\n        System.out.println(\"Durchschnitt: \" + schnitt + \" g\");\n        System.out.println(\"Das sind \" + kilo + \" kg und \" + gramm + \" g.\");\n    }\n}\n","tests":[{"name":"Statistik stimmt","input":[],"expect":[{"has":"4770","label":"Gesamtgewicht 4770"},{"re":"1590[.,]0|1590 ","label":"Durchschnitt 1590.0 (als Kommazahl)"},{"re":"\\b4\\b[^\\n]*\\b770\\b","label":"4 kg und 770 g"}]}],"codeChecks":[{"label":"Division mit /","re":"/\\s*(1000|3)"},{"label":"Modulo mit %","re":"%\\s*1000"},{"label":"double für den Durchschnitt","re":"\\bdouble\\b|\\(double\\)|3\\.0"}],"rubric":[["Programm kompiliert und läuft",20],["Gesamtgewicht richtig berechnet",20],["Durchschnitt als Kommazahl richtig (keine Ganzzahl-Division)",25],["Kilo und Gramm mit / und % richtig",25],["Verständliche Ausgabe",10]],"tip":"Für den Durchschnitt teile durch `3.0` statt durch `3` – sonst schneidet Java die Nachkommastellen ab."}},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int hecht = 2350;\n        int zander = 1780;\n        int forelle = 640;\n        int gesamt = hecht + zander + forelle;\n        double schnitt = gesamt / 3.0;\n        int kilo = gesamt / 1000;\n        int gramm = gesamt % 1000;\n        System.out.println(\"Gesamtgewicht: \" + gesamt + \" g\");\n        System.out.println(\"Durchschnitt: \" + schnitt + \" g\");\n        System.out.println(\"Das sind \" + kilo + \" kg und \" + gramm + \" g.\");\n    }\n}\n","run":true,"hl":[7,9],"say":"So könnte die Lösung aussehen: `gesamt / 3.0` liefert die genaue Kommazahl, `/ 1000` die ganzen Kilo und `% 1000` die restlichen Gramm. Petri Heil! 🎣"},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["Variablen deklarieren und Werte zuweisen","Die Typen `int`, `double`, `boolean`, `char` und `String`","Rechnen mit `+ - * / %` und die Ganzzahl-Falle","Umwandeln mit `(int)` und `(double)`","Text und Zahlen mit `+` verbinden","Konstanten mit `final`"],"gap":0.7},"say":"Das war Lektion 2! Du kannst jetzt mit Variablen arbeiten und rechnen. In Lektion 3 wird es interaktiv: Dein Programm fragt den Benutzer etwas und trifft Entscheidungen."}]}]},{"id":"java-03","nr":3,"title":"Eingaben & Entscheidungen","sub":"Dein Programm fragt nach, vergleicht Werte und entscheidet mit if, else und den logischen Operatoren.","outro":"Dein Programm kann jetzt zuhören und entscheiden – das ist der Schritt von „Text ausgeben“ zu echter Logik. In Lektion 4 kommen Schleifen: Dinge wiederholen, ohne alles hundertmal hinzuschreiben.","playground":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Wie alt bist du? \");\n        int alter = sc.nextInt();\n        if (alter >= 18) {\n            System.out.println(\"Volljährig!\");\n        } else {\n            System.out.println(\"Noch \" + (18 - alter) + \" Jahre bis 18.\");\n        }\n    }\n}\n","chapters":[{"title":"Programme, die reagieren","steps":[{"t":"Lektion 3","h":"Eingaben & Entscheidungen","sub":"Programme, die zuhören und reagieren","say":"Servus! Bisher haben deine Programme immer genau dasselbe gemacht. Heute ändern wir das: Dein Programm fragt den Benutzer etwas – und reagiert unterschiedlich auf die Antwort."},{"layout":"visual","visual":{"kind":"flow","title":"Fast jedes Programm funktioniert so","dir":"row","items":[{"h":"⌨️ Eingabe","p":"Benutzer tippt etwas"},{"h":"⚙️ Verarbeitung","p":"rechnen & entscheiden","cls":"hot"},{"h":"💬 Ausgabe","p":"Antwort anzeigen","cls":"ok"}],"gap":1.1},"say":"Fast jedes Programm folgt diesem Muster: Eingabe, Verarbeitung, Ausgabe. Ein Spiel liest deine Tasten, ein Online-Shop deine Bestellung. Heute baust du alle drei Teile selbst."}]},{"title":"Eingaben mit Scanner","steps":[{"t":"Kapitel 2","h":"Der Scanner","sub":"Text von der Tastatur einlesen","after":"editor"},{"layout":"editor","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n    }\n}\n","hl":[1,1],"say":"Zum Einlesen gibt es in Java den **Scanner**. Er wohnt in einer Bibliothek, deshalb müssen wir ihn ganz oben mit `import` holen."},{"hl":[5,5],"say":"In der main-Methode erzeugen wir dann einen Scanner und nennen ihn `sc`. `System.in` bedeutet: Lies von der Tastatur."},{"code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Wie heißt du? \");\n        String name = sc.nextLine();\n        System.out.println(\"Servus \" + name + \"!\");\n    }\n}\n","hl":[6,7],"say":"`sc.nextLine()` wartet, bis der Benutzer etwas eintippt und Enter drückt. Die ganze Zeile landet dann in der Variable `name`."},{"layout":"code","console":"clear","run":true,"input":["Lena"],"say":"Probieren wir es aus. Der Benutzer tippt „Lena“ – das siehst du in Grün. Und das Programm antwortet mit seinem Namen."},{"hl":[6,6],"say":"Kleiner Trick: Für die Frage nehmen wir `print` statt `println`. Dann tippt der Benutzer direkt hinter der Frage, in derselben Zeile."},{"layout":"split","visual":{"kind":"table","title":"Die wichtigsten Scanner-Befehle","head":["Befehl","liest …","Typ"],"rows":[["`sc.nextLine()`","eine ganze Zeile","`String`"],["`sc.next()`","ein einzelnes Wort","`String`"],["`sc.nextInt()`","eine ganze Zahl","`int`"],["`sc.nextDouble()`","eine Kommazahl","`double`"]],"gap":0.8},"console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Wie alt bist du? \");\n        int alter = sc.nextInt();\n        System.out.println(\"In 4 Jahren bist du \" + (alter + 4) + \".\");\n    }\n}\n","hl":[7,7],"say":"Für Zahlen gibt es eigene Befehle: `nextInt()` für ganze Zahlen und `nextDouble()` für Kommazahlen. Damit kannst du gleich weiterrechnen."},{"layout":"code","run":true,"input":["14"],"say":"Der Benutzer gibt 14 ein, das Programm rechnet 14 plus 4. Ganz ohne den Code zu ändern, funktioniert es jetzt für jedes Alter."},{"console":"clear","run":true,"input":["vierzehn"],"expectError":true,"say":"Und was passiert, wenn jemand Buchstaben statt einer Zahl eintippt? Dann stürzt das Programm mit einer **InputMismatchException** ab: Die Eingabe passt nicht zum Typ."},{"quiz":{"id":"l3-q1","q":"Mit welchem Befehl liest du eine ganze Zahl ein?","options":["`sc.nextLine()`","`sc.nextInt()`","`sc.readInt()`","`sc.next()`"],"correct":1,"explain":"`nextInt()` liest eine ganze Zahl und liefert einen `int`. `nextLine()` liefert immer Text."}}]},{"title":"Vergleiche","steps":[{"t":"Kapitel 3","h":"Vergleiche","sub":"Ist das wahr oder falsch?","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"table","title":"Vergleichsoperatoren","head":["Zeichen","Bedeutung","Beispiel → Ergebnis"],"rows":[["`==`","gleich","`5 == 5` → true"],["`!=`","ungleich","`5 != 3` → true"],["`<`","kleiner","`3 < 2` → false"],["`>`","größer","`7 > 2` → true"],["`<=`","kleiner oder gleich","`4 <= 4` → true"],["`>=`","größer oder gleich","`9 >= 10` → false"]],"gap":0.6},"code":"public class Main {\n    public static void main(String[] args) {\n        int alter = 15;\n        System.out.println(alter >= 18);\n        System.out.println(alter == 15);\n        System.out.println(alter != 15);\n    }\n}\n","hl":[4,6],"say":"Um zu entscheiden, muss ein Programm Werte vergleichen. Das Ergebnis eines Vergleichs ist immer ein `boolean`: entweder `true` oder `false`."},{"layout":"all","run":true,"say":"15 ist nicht größer oder gleich 18, also false. 15 ist gleich 15, also true. Und „ungleich 15“ stimmt natürlich nicht."},{"hl":[5,5],"say":"Wichtig: Ein einzelnes `=` **speichert** einen Wert. Zum **Vergleichen** brauchst du zwei: `==`. Das verwechselt am Anfang jeder."}]},{"title":"if und else","steps":[{"t":"Kapitel 4","h":"if und else","sub":"Wenn … dann … sonst","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"flow","items":[{"h":"alter >= 18 ?","p":"Bedingung","cls":"hot"},{"h":"✅ true → if-Block","p":"„Du darfst wählen!“","cls":"ok"},{"h":"❌ false → else-Block","p":"„Noch nicht …“"}],"gap":1},"code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Alter: \");\n        int alter = sc.nextInt();\n        if (alter >= 16) {\n            System.out.println(\"Du darfst in Österreich wählen!\");\n        } else {\n            System.out.println(\"Noch \" + (16 - alter) + \" Jahre bis zur Wahl.\");\n        }\n    }\n}\n","hl":[8,12],"say":"Mit `if` trifft dein Programm Entscheidungen. In den runden Klammern steht die **Bedingung**. Ist sie true, wird der Block in den geschweiften Klammern ausgeführt."},{"hl":[10,12],"say":"Ist die Bedingung false, springt Java in den `else`-Block. Es läuft also immer **genau einer** der beiden Blöcke. In Österreich darf man übrigens schon ab 16 wählen."},{"layout":"all","run":true,"input":["17"],"say":"Mit 17 ist die Bedingung erfüllt: Der if-Block läuft."},{"console":"clear","run":true,"input":["13"],"say":"Mit 13 ist sie nicht erfüllt: Diesmal läuft der else-Block – und rechnet sogar aus, wie lange es noch dauert."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int temperatur = 31;\n        if (temperatur > 30) {\n            System.out.println(\"Ab ins Freibad!\");\n        }\n        System.out.println(\"Schönen Tag noch.\");\n    }\n}\n","hl":[4,6],"say":"Der else-Teil ist übrigens freiwillig. Fehlt er, passiert bei false einfach gar nichts – und das Programm macht danach normal weiter."},{"run":true,"say":"Bei 31 Grad geht es ins Freibad. Die letzte Zeile steht außerhalb vom if und läuft deshalb immer."}]},{"title":"else if – mehrere Fälle","steps":[{"t":"Kapitel 5","h":"else if","sub":"Wenn es mehr als zwei Möglichkeiten gibt","after":"code"},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Punkte (0-100): \");\n        int punkte = sc.nextInt();\n        if (punkte >= 90) {\n            System.out.println(\"Note 1 – Sehr gut\");\n        } else if (punkte >= 78) {\n            System.out.println(\"Note 2 – Gut\");\n        } else if (punkte >= 64) {\n            System.out.println(\"Note 3 – Befriedigend\");\n        } else if (punkte >= 50) {\n            System.out.println(\"Note 4 – Genügend\");\n        } else {\n            System.out.println(\"Note 5 – Nicht genügend\");\n        }\n    }\n}\n","hl":[8,18],"say":"Gibt es mehr als zwei Fälle, hängst du mit `else if` weitere Bedingungen an. Hier ein Notenrechner – mit genau den Grenzen, nach denen auch deine Aufgaben hier benotet werden."},{"run":true,"input":["82"],"say":"Java prüft von oben nach unten: 82 ist nicht über 90, aber über 78. Also Note 2. Sobald eine Bedingung passt, werden alle weiteren übersprungen."},{"quiz":{"id":"l3-q2","q":"Was passiert, wenn man die Reihenfolge umdreht und zuerst `if (punkte >= 50)` prüft?","options":["Nichts, das Ergebnis bleibt gleich","Alle ab 50 Punkten bekommen eine 4 – auch mit 100 Punkten","Das Programm kompiliert nicht"],"correct":1,"explain":"Die erste passende Bedingung gewinnt. 100 ist auch ≥ 50 – also würde jeder ab 50 Punkten bei der ersten Bedingung landen. Bei else-if-Ketten ist die Reihenfolge entscheidend!"}}]},{"title":"Und, Oder, Nicht","steps":[{"t":"Kapitel 6","h":"Und, Oder, Nicht","sub":"Bedingungen kombinieren","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"table","title":"Logische Operatoren","head":["Zeichen","heißt","true, wenn …"],"rows":[["`&&`","und","**beide** Seiten true sind"],["`||`","oder","**mindestens eine** Seite true ist"],["`!`","nicht","der Wert false ist (dreht um)"]],"gap":0.8},"code":"public class Main {\n    public static void main(String[] args) {\n        int alter = 12;\n        boolean wochenende = true;\n        boolean ferien = false;\n\n        if (alter >= 6 && alter <= 14) {\n            System.out.println(\"Kinderpreis im Freibad\");\n        }\n        if (wochenende || ferien) {\n            System.out.println(\"Ausschlafen!\");\n        }\n        if (!ferien) {\n            System.out.println(\"Hausaufgaben nicht vergessen.\");\n        }\n    }\n}\n","hl":[7,9],"say":"Oft hängt eine Entscheidung von mehreren Dingen ab. Mit `&&` (und) müssen **beide** Bedingungen stimmen – hier: mindestens 6 **und** höchstens 14 Jahre alt."},{"hl":[10,12],"say":"Mit `||` (oder) reicht es, wenn **eine** stimmt: Am Wochenende **oder** in den Ferien wird ausgeschlafen."},{"hl":[13,15],"say":"Und `!` dreht einen Wert um: `!ferien` heißt „nicht Ferien“. Weil ferien false ist, ist `!ferien` true."},{"layout":"all","run":true,"say":"Alle drei Bedingungen sind erfüllt, also erscheinen alle drei Zeilen."},{"quiz":{"id":"l3-q3","q":"Wann ist `(x > 0 && x < 10)` true?","options":["Wenn x zwischen 1 und 9 liegt","Wenn x kleiner als 0 oder größer als 10 ist","Immer","Wenn x genau 0 oder 10 ist"],"correct":0,"explain":"Beide Bedingungen müssen stimmen: größer als 0 UND kleiner als 10. Bei ganzen Zahlen also 1 bis 9."}}]},{"title":"Die String-Falle","steps":[{"t":"Kapitel 7","h":"Die String-Falle","sub":"Warum == bei Text nicht klappt","after":"code"},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Passwort: \");\n        String eingabe = sc.nextLine();\n        System.out.println(eingabe == \"geheim\");\n        System.out.println(eingabe.equals(\"geheim\"));\n    }\n}\n","hl":[8,8],"say":"Jetzt kommt eine der gemeinsten Fallen in Java. Wir lesen ein Passwort ein und vergleichen es mit `==`. Was glaubst du, kommt heraus?"},{"run":true,"input":["geheim"],"say":"Obwohl wir genau „geheim“ eingetippt haben, liefert `==` **false**! Strings sind in Java Objekte. `==` prüft, ob es **dasselbe Objekt** ist – nicht, ob der Text gleich ist."},{"hl":[9,9],"say":"Für Text nimmst du deshalb immer `.equals(...)`. Das vergleicht wirklich Buchstabe für Buchstabe. Merk dir: **Zahlen mit ==, Text mit equals.**"},{"layout":"split","visual":{"kind":"compare","left":{"title":"❌ So nicht","code":"if (name == \"Lena\")","note":"vergleicht Objekte – oft false","cls":"bad"},"right":{"title":"✅ So schon","code":"if (name.equals(\"Lena\"))","note":"vergleicht den Text","cls":"good"}},"say":"Und wenn Groß- und Kleinschreibung egal sein soll, gibt es `equalsIgnoreCase`. Dann ist „LENA“ gleich „lena“."},{"quiz":{"id":"l3-q4","q":"Wie prüfst du richtig, ob die Variable `antwort` den Text „ja“ enthält?","options":["`antwort == \"ja\"`","`antwort = \"ja\"`","`antwort.equals(\"ja\")`","`antwort.equals(ja)`"],"correct":2,"explain":"Text vergleicht man mit `.equals()`, und der Vergleichstext steht in Anführungszeichen."}}]},{"title":"Aufgabe: Ticket-Automat","steps":[{"t":"Aufgabe 1","h":"Ticket-Automat","sub":"Jetzt bist du dran!","after":"visual"},{"layout":"visual","visual":{"kind":"table","title":"Preise im Kino","head":["Alter","Preis"],"rows":[["unter 6","gratis"],["6 bis 17","6.50 €"],["ab 18","11.00 €"]],"gap":0.8},"say":"Jetzt bist du dran! Bau einen **Ticket-Automaten** fürs Kino: Er fragt nach Name und Alter und sagt dann, was das Ticket kostet."},{"task":{"id":"l3-ticket","nr":1,"title":"Ticket-Automat","text":["Schreib einen Ticket-Automaten fürs Kino. Das Programm fragt zuerst nach dem **Namen**, dann nach dem **Alter**.","Dann gibt es den passenden Preis aus: unter 6 Jahren gratis, von 6 bis 17 Jahren 6.50 Euro, ab 18 Jahren 11.00 Euro. Begrüße die Person dabei mit Namen."],"req":["`import java.util.Scanner;` und ein Scanner","Name mit `nextLine()`, Alter mit `nextInt()` einlesen","`if` / `else if` / `else` für die drei Preise","Unter 6: „gratis“, 6–17: 6.5, ab 18: 11.0","Ausgabe mit dem Namen"],"example":"Wie heißt du? Mia\nWie alt bist du? 12\nHallo Mia! Dein Ticket kostet 6.5 Euro.","starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // Frag nach Name und Alter und gib den Preis aus\n\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Wie heißt du? \");\n        String name = sc.nextLine();\n        System.out.print(\"Wie alt bist du? \");\n        int alter = sc.nextInt();\n        if (alter < 6) {\n            System.out.println(\"Hallo \" + name + \"! Für dich ist das Ticket gratis.\");\n        } else if (alter < 18) {\n            System.out.println(\"Hallo \" + name + \"! Dein Ticket kostet 6.5 Euro.\");\n        } else {\n            System.out.println(\"Hallo \" + name + \"! Dein Ticket kostet 11.0 Euro.\");\n        }\n    }\n}\n","tests":[{"name":"Kind (5 Jahre)","input":["Mia","5"],"expect":[{"re":"gratis|kostenlos|0[.,]0","label":"gratis"},{"has":"Mia","label":"Name in der Ausgabe"}]},{"name":"Jugendlich (12 Jahre)","input":["Tom","12"],"expect":[{"re":"6[.,]5","label":"6.5 Euro"}]},{"name":"Grenzfall 17 Jahre","input":["Ida","17"],"expect":[{"re":"6[.,]5","label":"6.5 Euro bei 17"}]},{"name":"Erwachsen (18 Jahre)","input":["Ben","18"],"expect":[{"re":"\\b11\\b|11[.,]0","label":"11 Euro bei 18"}]}],"codeChecks":[{"label":"Scanner verwendet","re":"new\\s+Scanner\\s*\\(\\s*System\\.in\\s*\\)"},{"label":"nextInt für das Alter","re":"nextInt\\s*\\("},{"label":"else if verwendet","re":"else\\s+if"}],"rubric":[["Programm kompiliert und läuft",20],["Eingabe von Name und Alter mit Scanner",20],["Richtige Preise für alle Altersgruppen (auch Grenzfälle 6 und 18)",40],["Freundliche Ausgabe mit Namen",20]],"tip":"Teste die Grenzen extra: 5, 6, 17 und 18. Genau dort passieren die meisten Fehler."}},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Wie heißt du? \");\n        String name = sc.nextLine();\n        System.out.print(\"Wie alt bist du? \");\n        int alter = sc.nextInt();\n        if (alter < 6) {\n            System.out.println(\"Hallo \" + name + \"! Für dich ist das Ticket gratis.\");\n        } else if (alter < 18) {\n            System.out.println(\"Hallo \" + name + \"! Dein Ticket kostet 6.5 Euro.\");\n        } else {\n            System.out.println(\"Hallo \" + name + \"! Dein Ticket kostet 11.0 Euro.\");\n        }\n    }\n}\n","run":true,"input":["Mia","12"],"hl":[10,15],"say":"Abgegeben! So könnte es aussehen. Weil die else-if-Kette von oben prüft, reicht bei der zweiten Bedingung `alter < 18` – unter 6 wurde ja schon vorher abgefangen."}]},{"title":"Schön formatieren mit printf","steps":[{"t":"Kapitel 9","h":"printf","sub":"Zahlen schön formatieren","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        double preis = 45.0 - 29.99;\n        System.out.println(\"Rest: \" + preis + \" Euro\");\n        System.out.printf(\"Rest: %.2f Euro%n\", preis);\n    }\n}\n","hl":[3,4],"say":"Erinnerst du dich an die komische Zahl aus Lektion 2? Mit `printf` kannst du Zahlen schön formatieren. `%.2f` heißt: Kommazahl mit genau **2 Nachkommastellen**."},{"run":true,"say":"Viel besser! printf rundet auf zwei Stellen. Das `%n` am Ende macht eine neue Zeile – printf springt nämlich nicht von selbst weiter."},{"layout":"split","console":"clear","visual":{"kind":"table","title":"Platzhalter für printf","head":["Platzhalter","für","Beispiel"],"rows":[["`%d`","ganze Zahlen","`printf(\"%d Punkte\", 42)`"],["`%.2f`","Kommazahl, 2 Stellen","`printf(\"%.2f\", 3.14159)`"],["`%s`","Text","`printf(\"Hallo %s\", name)`"],["`%n`","neue Zeile","`printf(\"Ende%n\")`"]],"gap":0.7},"code":"public class Main {\n    public static void main(String[] args) {\n        String name = \"Lena\";\n        int fische = 3;\n        double gewicht = 4.7712;\n        System.out.printf(\"%s hat %d Fische gefangen.%n\", name, fische);\n        System.out.printf(\"Gesamtgewicht: %.1f kg%n\", gewicht);\n    }\n}\n","hl":[6,7],"say":"Du kannst mehrere Platzhalter in einen Text packen. Die Werte kommen danach, durch Beistriche getrennt, in der richtigen Reihenfolge."},{"layout":"all","run":true,"say":"`%s` wird durch den Namen ersetzt, `%d` durch die Anzahl und `%.1f` durch das Gewicht mit einer Nachkommastelle."},{"quiz":{"id":"l3-q5","q":"Was gibt `System.out.printf(\"%.1f\", 2.46);` aus?","options":["2.46","2.4","2.5","2"],"correct":2,"explain":"`%.1f` rundet auf eine Nachkommastelle: 2.46 wird zu 2.5."}}]},{"title":"Aufgabe: Notenrechner","steps":[{"t":"Aufgabe 2","h":"Notenrechner","sub":"Mit Fehlerprüfung","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Aufgabe 2: Notenrechner","items":["Lies die Punkte (0–100) mit dem Scanner ein","Gib die österreichische Note **und** das Wort dazu aus","Bei Punkten unter 0 oder über 100: „Ungültige Eingabe“","Grenzen: ab 90 → 1, ab 78 → 2, ab 64 → 3, ab 50 → 4, sonst 5"],"gap":0.9},"say":"Letzte Aufgabe! Bau deinen eigenen Notenrechner – mit einer Extra-Prüfung: Ungültige Punkte sollen abgefangen werden. Dafür brauchst du `||`."},{"task":{"id":"l3-noten","nr":2,"title":"Notenrechner","text":["Schreib ein Programm, das eine Punktezahl von 0 bis 100 einliest und die passende österreichische Schulnote mit Wort ausgibt.","Ist die Eingabe kleiner als 0 oder größer als 100, soll stattdessen „Ungültige Eingabe“ erscheinen."],"req":["Punkte mit dem Scanner (`nextInt()`) einlesen","Ungültige Werte (< 0 oder > 100) mit `||` abfangen","Notengrenzen: ab 90 → 1 Sehr gut, ab 78 → 2 Gut, ab 64 → 3 Befriedigend, ab 50 → 4 Genügend, sonst 5 Nicht genügend","Ausgabe von Note und Wort, z. B. „Note 2 – Gut“"],"example":"Punkte: 82\nNote 2 – Gut","starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Punkte: \");\n        int punkte = sc.nextInt();\n        // Prüfe hier die Punkte und gib die Note aus\n\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Punkte: \");\n        int punkte = sc.nextInt();\n        if (punkte < 0 || punkte > 100) {\n            System.out.println(\"Ungültige Eingabe\");\n        } else if (punkte >= 90) {\n            System.out.println(\"Note 1 – Sehr gut\");\n        } else if (punkte >= 78) {\n            System.out.println(\"Note 2 – Gut\");\n        } else if (punkte >= 64) {\n            System.out.println(\"Note 3 – Befriedigend\");\n        } else if (punkte >= 50) {\n            System.out.println(\"Note 4 – Genügend\");\n        } else {\n            System.out.println(\"Note 5 – Nicht genügend\");\n        }\n    }\n}\n","tests":[{"name":"95 Punkte","input":["95"],"expect":[{"re":"\\b1\\b|sehr gut","label":"Note 1"}]},{"name":"82 Punkte","input":["82"],"expect":[{"re":"\\b2\\b|(^|[^e])\\bgut","label":"Note 2"}]},{"name":"Grenze 78","input":["78"],"expect":[{"re":"\\b2\\b","label":"Note 2 bei 78"}]},{"name":"70 Punkte","input":["70"],"expect":[{"re":"\\b3\\b|befriedigend","label":"Note 3"}]},{"name":"Grenze 50","input":["50"],"expect":[{"re":"\\b4\\b|genügend","label":"Note 4 bei 50"}]},{"name":"20 Punkte","input":["20"],"expect":[{"re":"\\b5\\b|nicht genügend","label":"Note 5"}]},{"name":"Ungültig (120)","input":["120"],"expect":[{"re":"ungültig|ungueltig|falsch|fehler","label":"„Ungültige Eingabe“ bei 120"}]},{"name":"Ungültig (-5)","input":["-5"],"expect":[{"re":"ungültig|ungueltig|falsch|fehler","label":"„Ungültige Eingabe“ bei -5"}]}],"codeChecks":[{"label":"Oder-Verknüpfung || verwendet","re":"\\|\\|"},{"label":"else if verwendet","re":"else\\s+if"}],"rubric":[["Programm kompiliert und läuft",15],["Punkte werden mit dem Scanner eingelesen",15],["Alle fünf Noten mit richtigen Grenzen",45],["Ungültige Eingaben werden mit || abgefangen",15],["Verständliche Ausgabe mit Note und Wort",10]],"tip":"Prüf die ungültigen Werte ganz am Anfang der if-Kette – dann musst du dich danach nicht mehr darum kümmern."}},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Punkte: \");\n        int punkte = sc.nextInt();\n        if (punkte < 0 || punkte > 100) {\n            System.out.println(\"Ungültige Eingabe\");\n        } else if (punkte >= 90) {\n            System.out.println(\"Note 1 – Sehr gut\");\n        } else if (punkte >= 78) {\n            System.out.println(\"Note 2 – Gut\");\n        } else if (punkte >= 64) {\n            System.out.println(\"Note 3 – Befriedigend\");\n        } else if (punkte >= 50) {\n            System.out.println(\"Note 4 – Genügend\");\n        } else {\n            System.out.println(\"Note 5 – Nicht genügend\");\n        }\n    }\n}\n","run":true,"input":["105"],"hl":[8,9],"say":"So könnte die Lösung aussehen. Die Prüfung auf ungültige Werte steht ganz oben – 105 Punkte werden sofort abgefangen."},{"layout":"visual","visual":{"kind":"bullets","title":"Das kannst du jetzt","items":["Eingaben mit dem `Scanner` lesen","Werte vergleichen mit `== != < > <= >=`","Entscheiden mit `if`, `else if` und `else`","Bedingungen verknüpfen mit `&&`, `||` und `!`","Texte richtig vergleichen mit `equals`","Zahlen formatieren mit `printf`"],"gap":0.7},"say":"Das war Lektion 3! Dein Programm kann jetzt zuhören und entscheiden. In Lektion 4 lernst du **Schleifen** – damit wiederholst du Dinge, ohne sie hundertmal hinzuschreiben."}]}]},{"id":"java-04","nr":4,"title":"Schleifen","sub":"Dinge wiederholen mit while, for und do-while – plus Zufallszahlen und dein erstes echtes Spiel.","outro":"Mit Schleifen kann dein Programm Dinge tausendfach wiederholen – und mit Zufallszahlen hast du dein erstes Spiel gebaut. In Lektion 5 lernst du Arrays: viele Werte in einer einzigen Variable.","playground":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(\"Runde \" + i);\n        }\n    }\n}\n","chapters":[{"title":"Warum Schleifen?","steps":[{"t":"Lektion 4","h":"Schleifen","sub":"Wiederholen, ohne alles hundertmal hinzuschreiben","say":"Servus! Stell dir vor, du sollst hundertmal „Ich darf nicht schwätzen“ ausgeben. Hundert Zeilen `println`? Viel zu mühsam. Dafür gibt es **Schleifen**."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hallo!\");\n        System.out.println(\"Hallo!\");\n        System.out.println(\"Hallo!\");\n        System.out.println(\"Hallo!\");\n        System.out.println(\"Hallo!\");\n    }\n}\n","hl":[3,7],"say":"So würde es ohne Schleife aussehen: Fünfmal dieselbe Zeile. Bei hundert oder tausend Wiederholungen wäre das völlig verrückt."},{"code":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 0; i < 5; i++) {\n            System.out.println(\"Hallo!\");\n        }\n    }\n}\n","hl":[3,5],"run":true,"say":"Mit einer Schleife sind es nur drei Zeilen – egal ob fünfmal oder eine Million Mal. Schauen wir uns an, wie das funktioniert."}]},{"title":"Die while-Schleife","steps":[{"t":"Kapitel 2","h":"while","sub":"Solange etwas stimmt, wiederhole","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"flow","items":[{"h":"Bedingung prüfen","p":"`countdown > 0` ?","cls":"hot"},{"h":"✅ true → Block ausführen","p":"ausgeben, dann `countdown--`","cls":"ok"},{"h":"↩ zurück nach oben","p":"und wieder prüfen"},{"h":"❌ false → fertig","p":"weiter nach der Schleife"}],"gap":1},"code":"public class Main {\n    public static void main(String[] args) {\n        int countdown = 5;\n        while (countdown > 0) {\n            System.out.println(countdown + \" ...\");\n            countdown--;\n        }\n        System.out.println(\"Abheben! 🚀\");\n    }\n}\n","hl":[4,7],"say":"Die einfachste Schleife ist `while`. Sie heißt auf Deutsch „solange“: **Solange** die Bedingung true ist, wird der Block wiederholt."},{"hl":[6,6],"say":"Ganz wichtig ist diese Zeile: `countdown--` macht den Wert bei jedem Durchlauf kleiner. Irgendwann ist er 0 – dann ist die Bedingung false und die Schleife endet."},{"layout":"all","run":true,"say":"5, 4, 3, 2, 1 – und abheben! Nach dem letzten Durchlauf ist `countdown` 0. Die Bedingung stimmt nicht mehr, also geht es nach der Schleife weiter."},{"layout":"split","visual":{"kind":"big","text":"⚠️ Endlosschleife","sub":"Vergisst du `countdown--`, bleibt die Bedingung für immer true – das Programm hört nie auf."},"hl":[6,6],"say":"Achtung: Würdest du `countdown--` vergessen, wäre die Bedingung für immer erfüllt. Das ist eine **Endlosschleife** – das Programm hängt. Hier im Kurs kannst du sie mit dem Stopp-Knopf beenden."},{"quiz":{"id":"l4-q1","q":"Wie oft wird „Hi“ ausgegeben?\n`int i = 0;`\n`while (i < 3) { System.out.println(\"Hi\"); i++; }`","options":["2-mal","3-mal","4-mal","unendlich oft"],"correct":1,"explain":"i ist 0, 1 und 2 – bei diesen Werten stimmt `i < 3`. Bei i = 3 ist Schluss. Also dreimal."}}]},{"title":"Die for-Schleife","steps":[{"t":"Kapitel 3","h":"for","sub":"Die Zählschleife","after":"split"},{"layout":"split","console":"clear","visual":{"kind":"table","title":"Die drei Teile der for-Schleife","head":["Teil","Beispiel","Wann?"],"rows":[["Start","`int i = 1`","einmal am Anfang"],["Bedingung","`i <= 5`","vor jedem Durchlauf"],["Schritt","`i++`","nach jedem Durchlauf"]],"gap":0.9},"code":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(\"Runde \" + i);\n        }\n    }\n}\n","hl":[3,3],"say":"Weil man so oft zählt, gibt es eine Kurzform: die `for`-Schleife. Sie packt alles in eine Zeile: den **Start**, die **Bedingung** und den **Schritt**."},{"layout":"all","run":true,"say":"i startet bei 1, die Schleife läuft, solange i höchstens 5 ist, und nach jeder Runde wird i um eins erhöht. Die Variable `i` kannst du im Block benutzen."},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 10; i >= 0; i -= 2) {\n            System.out.print(i + \" \");\n        }\n        System.out.println();\n    }\n}\n","hl":[3,3],"say":"Du kannst auch rückwärts oder in größeren Schritten zählen: Hier von 10 hinunter auf 0, immer in Zweierschritten."},{"run":true,"say":"10, 8, 6, 4, 2, 0. Mit `print` statt `println` landet alles in einer Zeile."},{"console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int summe = 0;\n        for (int i = 1; i <= 100; i++) {\n            summe += i;\n        }\n        System.out.println(\"1 + 2 + ... + 100 = \" + summe);\n    }\n}\n","hl":[3,6],"say":"Ein klassisches Muster: **Aufsummieren**. Wir starten mit einer Summe von 0 und addieren in jedem Durchlauf die aktuelle Zahl dazu."},{"run":true,"say":"5050! Das soll der berühmte Mathematiker Gauß als Schüler im Kopf ausgerechnet haben. Java schafft es in einer Millisekunde."},{"quiz":{"id":"l4-q2","q":"Was gibt `for (int i = 0; i < 4; i++) System.out.print(i);` aus?","options":["1234","0123","01234","4"],"correct":1,"explain":"i startet bei 0, und bei 4 ist Schluss (weil `i < 4`). Also 0, 1, 2, 3."}}]},{"title":"Zählen mit Bedingung","steps":[{"t":"Kapitel 4","h":"Schleife + if","sub":"Zählen, filtern, suchen","after":"code"},{"layout":"code","console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        int gerade = 0;\n        for (int zahl = 1; zahl <= 20; zahl++) {\n            if (zahl % 2 == 0) {\n                gerade++;\n                System.out.print(zahl + \" \");\n            }\n        }\n        System.out.println();\n        System.out.println(\"Gerade Zahlen: \" + gerade);\n    }\n}\n","hl":[5,8],"say":"Richtig stark werden Schleifen mit `if` darin. Hier zählen wir, wie viele gerade Zahlen es von 1 bis 20 gibt. Erinnerst du dich? Bei geraden Zahlen ist der Rest durch 2 gleich 0."},{"run":true,"say":"Zehn gerade Zahlen. Das Muster „Zähler auf 0 setzen, in der Schleife hochzählen“ wirst du noch sehr oft brauchen."},{"console":"clear","code":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 15; i++) {\n            if (i == 13) {\n                continue;   // die 13 überspringen\n            }\n            if (i % 7 == 0 && i > 10) {\n                System.out.println(\"Gefunden: \" + i);\n                break;      // Schleife sofort beenden\n            }\n            System.out.print(i + \" \");\n        }\n    }\n}\n","hl":[4,10],"say":"Zwei nützliche Befehle: `continue` überspringt den Rest des aktuellen Durchlaufs, `break` beendet die ganze Schleife sofort."},{"run":true,"say":"Die Zahlen laufen durch, bis die erste Zahl über 10 gefunden ist, die durch 7 teilbar ist: 14. Dann bricht `break` ab – deshalb wird die 13 hier gar nicht erst erreicht."}]},{"title":"do-while","steps":[{"t":"Kapitel 5","h":"do-while","sub":"Erst machen, dann prüfen","after":"code"},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int zahl;\n        do {\n            System.out.print(\"Zahl zwischen 1
