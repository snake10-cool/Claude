+ \",\" + s.y);\n    }\n}\n","solution":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n    static void zeichne(Level lv, Spieler s) {\n        for (int y = 0; y < lv.feld.length; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < lv.feld[y].length; x++) {\n                if (x == s.x && y == s.y) sb.append('@');\n                else sb.append(lv.feld[y][x]);\n            }\n            System.out.println(sb);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        Scanner sc = new Scanner(System.in);\n        while (sc.hasNextLine()) {\n            String eingabe = sc.nextLine();\n            if (eingabe.equals(\"q\")) break;\n            s.update(lv, eingabe);\n        }\n        zeichne(lv, s);\n        System.out.println(\"Position: \" + s.x + \",\" + s.y);\n    }\n}\n","tests":[{"name":"laufen","input":["d","d","d"],"expect":[{"re":"position:?\\s*4\\s*,\\s*4","label":"nach 3× d: 4,4"}]},{"name":"Wand links","input":["a","a","d"],"expect":[{"re":"position:?\\s*2\\s*,\\s*4","label":"Wand blockiert: 2,4"}]},{"name":"Sprung-Höhepunkt","input":["w","."],"expect":[{"re":"position:?\\s*1\\s*,\\s*2","label":"nach w und einem Tick: 1,2"}]},{"name":"Landung","input":["w",".",".","."],"expect":[{"re":"position:?\\s*1\\s*,\\s*4","label":"wieder gelandet: 1,4"}]},{"name":"kein Doppelsprung","input":["w","w","w"],"expect":[{"re":"position:?\\s*1\\s*,\\s*3","label":"kein Fliegen: 1,3"}]},{"name":"auf die Plattform","input":["d","d","wd","d","d","d"],"expect":[{"re":"position:?\\s*6\\s*,\\s*2","label":"auf der Plattform: 6,2"}]}],"codeChecks":[{"label":"Methode update(Level, String)","re":"void\\s+update\\s*\\(\\s*Level\\s+\\w+\\s*,\\s*String\\s+\\w+\\s*\\)"},{"label":"istFest benutzt","re":"istFest\\s*\\("},{"label":"aufBoden benutzt","re":"aufBoden\\s*\\("}],"rubric":[["Programm kompiliert und läuft",15],["Laufen mit Kollision",20],["Springen nur vom Boden",20],["Schwung nach oben inkl. Kopfstoß",20],["Schwerkraft",15],["Sauberer, lesbarer Code",10]],"tip":"Arbeite die Regeln von oben nach unten ab, genau in dieser Reihenfolge: erst waagrecht, dann „springen?“, dann „Schwung oder fallen?“. Teste mit kleinen Eingaben wie „w“ und „.“.","lookup":"Kapitel „Schwerkraft & Springen“ in dieser Lektion; `contains` aus Lektion 7."}},{"layout":"code","console":"clear","code":"class Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        String[] eingaben = {\"w\", \"w\", \"w\"};\n        for (String e : eingaben) {\n            s.update(lv, e);\n        }\n        System.out.println(\"y = \" + s.y);\n    }\n}\n","run":true,"hl":[51,51],"say":"Abgegeben! Siehst du, wie wichtig die Bedingung `aufBoden` in der markierten Zeile ist? Nach dreimal w ist der Spieler schon wieder auf dem Weg nach unten, bei y = 3 – fliegen geht nicht."}]},{"title":"Münzen, Stacheln, Ziel","steps":[{"t":"Kapitel 6","h":"Münzen, Stacheln, Ziel","sub":"Das Spiel bekommt Regeln","after":"code"},{"layout":"code","console":"clear","code":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n    static void zeichne(Level lv, Spieler s) {\n        for (int y = 0; y < lv.feld.length; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < lv.feld[y].length; x++) {\n                if (x == s.x && y == s.y) sb.append('@');\n                else sb.append(lv.feld[y][x]);\n            }\n            System.out.println(sb);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        Level lv = new Level(karte);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        Scanner sc = new Scanner(System.in);\n        int leben = 3, muenzen = 0, tick = 0;\n        while (sc.hasNextLine()) {\n            String eingabe = sc.nextLine();\n            if (eingabe.equals(\"q\")) break;\n            s.update(lv, eingabe);\n            tick++;\n            char c = lv.get(s.x, s.y);\n            if (c == 'o') {\n                muenzen++;\n                lv.leeren(s.x, s.y);\n            } else if (c == '^') {\n                leben--;\n                System.out.println(\"Autsch! Noch \" + leben + \" Leben.\");\n                if (leben == 0) {\n                    System.out.println(\"Game Over nach \" + tick + \" Ticks.\");\n                    return;\n                }\n                s = new Spieler(lv.startX, lv.startY);\n            } else if (c == 'Z') {\n                zeichne(lv, s);\n                System.out.println(\"Ziel nach \" + tick + \" Ticks mit \" + muenzen + \" Münzen!\");\n                return;\n            }\n        }\n        zeichne(lv, s);\n        System.out.println(\"Spiel beendet. Münzen: \" + muenzen);\n    }\n}\n","hl":[98,100],"say":"Jetzt kommen die Spielregeln dazu. Nach jedem update schauen wir, auf welcher Kachel der Spieler steht. Eine Münze wird eingesammelt und aus dem Level gelöscht."},{"hl":[101,108],"say":"Stacheln kosten ein Leben. Danach startet der Spieler neu am Anfang – wir erzeugen einfach ein **neues** Spieler-Objekt. Bei null Leben ist Game Over."},{"hl":[109,112],"say":"Und beim Ziel ist das Spiel gewonnen. Wir spielen den schnellsten Weg durch: 13 Ticks."},{"run":true,"input":["d","d","d","d","d","d","wd","d","d","d","d","d","wd"],"say":"Ziel erreicht nach 13 Ticks mit zwei Münzen! Und weißt du was? Das ist die Grundstruktur **jedes** Jump’n’Runs. Im Browser wird nur alles flüssiger und bunter."},{"quiz":{"id":"l12-q2","q":"Warum löschen wir eine Münze mit `lv.leeren(x, y)` aus dem Level?","options":["Damit das Level kleiner wird","Damit man dieselbe Münze nicht mehrmals einsammeln kann","Weil Münzen sonst fallen","Damit der Spieler schneller wird"],"correct":1,"explain":"Bliebe das o stehen, würde jeder Tick auf diesem Feld noch eine Münze zählen."}}]},{"title":"Projekt Teil 2: Das ganze Spiel","steps":[{"t":"Projekt Teil 2","h":"Das ganze Spiel","sub":"Dein eigenes Level","after":"visual"},{"layout":"visual","visual":{"kind":"bullets","title":"Teil 2: Mach ein echtes Spiel daraus","items":["Zeichne ein **eigenes Level** (mind. 20 breit, 7 hoch) mit Münzen, Stacheln und Ziel","Spielregeln: Münzen, 3 Leben mit Neustart, Game Over, Ziel","Neu: **Punkte** = Münzen × 100 + Bonus für Schnelligkeit","Gib nach dem Ziel eine Wertung aus"],"gap":0.9},"say":"Letzte Aufgabe des Java-Teils: Bau daraus dein eigenes Spiel – mit eigenem Level und Punktewertung. Wie du die Punkte berechnest, darfst du selbst festlegen."},{"task":{"id":"l12-spiel","nr":2,"title":"Projekt Teil 2: Das ganze Spiel","level":"Projekt","text":["Ergänze die Spielschleife um die Regeln: Münze `o` einsammeln (und aus dem Level löschen), Stacheln `^` kosten ein Leben und setzen den Spieler an den Start zurück, bei 0 Leben „Game Over“, beim Ziel `Z` „Ziel!“ mit Anzahl Ticks und Münzen.","Zeichne dazu ein **eigenes** Level: mindestens 20 Zeichen breit und 7 Zeilen hoch, mit mindestens 3 Münzen, Stacheln und einem Ziel, das man mit Springen erreichen kann.","Berechne am Ende Punkte: Münzen × 100 plus ein Zeitbonus deiner Wahl (z. B. 1000 − 20 × Ticks, mindestens 0). Damit die Tests dein Level nicht kennen müssen: Bei der Eingabe „test“ als **erster** Zeile benutze das Level aus Teil 1."],"req":["Eigenes Level (≥ 20 × 7) mit Münzen, Stacheln, Ziel","Münzen zählen und löschen","3 Leben, Neustart am Start, Game Over","Ziel mit Ticks, Münzen und Punkten","Erste Eingabe „test“ → Level aus Teil 1"],"example":"test\nd\n…\nwd\nZiel nach 13 Ticks mit 2 Münzen!\nPunkte: 940","starter":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n    static void zeichne(Level lv, Spieler s) {\n        for (int y = 0; y < lv.feld.length; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < lv.feld[y].length; x++) {\n                if (x == s.x && y == s.y) sb.append('@');\n                else sb.append(lv.feld[y][x]);\n            }\n            System.out.println(sb);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        String[] meinLevel = {\n            // Zeichne hier dein eigenes Level (mind. 20 breit, 7 hoch)\n            \"####################\",\n            \"#@                Z#\",\n            \"####################\"\n        };\n        Scanner sc = new Scanner(System.in);\n        String erste = sc.nextLine();\n        Level lv = new Level(erste.equals(\"test\") ? karte : meinLevel);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        // Spielschleife mit Münzen, Stacheln, Leben, Ziel und Punkten\n    }\n}\n","solution":"import java.util.Scanner;\n\nclass Level {\n    char[][] feld;\n    int startX, startY;\n\n    Level(String[] zeilen) {\n        feld = new char[zeilen.length][];\n        for (int y = 0; y < zeilen.length; y++) {\n            feld[y] = zeilen[y].toCharArray();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '@') {\n                    startX = x;\n                    startY = y;\n                    feld[y][x] = ' ';\n                }\n            }\n        }\n    }\n\n    boolean istFest(int x, int y) {\n        if (y < 0 || y >= feld.length || x < 0 || x >= feld[y].length) {\n            return true;\n        }\n        return feld[y][x] == '#';\n    }\n\n    char get(int x, int y) {\n        return feld[y][x];\n    }\n\n    void leeren(int x, int y) {\n        feld[y][x] = ' ';\n    }\n}\n\nclass Spieler {\n    int x, y;\n    int sprung = 0;\n\n    Spieler(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    boolean aufBoden(Level lv) {\n        return lv.istFest(x, y + 1);\n    }\n\n    void update(Level lv, String eingabe) {\n        if (eingabe.contains(\"a\") && !lv.istFest(x - 1, y)) x--;\n        if (eingabe.contains(\"d\") && !lv.istFest(x + 1, y)) x++;\n        if (eingabe.contains(\"w\") && aufBoden(lv)) sprung = 2;\n        if (sprung > 0) {\n            if (!lv.istFest(x, y - 1)) {\n                y--;\n                sprung--;\n            } else {\n                sprung = 0;\n            }\n        } else if (!aufBoden(lv)) {\n            y++;\n        }\n    }\n}\n\npublic class Main {\n    static void zeichne(Level lv, Spieler s) {\n        for (int y = 0; y < lv.feld.length; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < lv.feld[y].length; x++) {\n                if (x == s.x && y == s.y) sb.append('@');\n                else sb.append(lv.feld[y][x]);\n            }\n            System.out.println(sb);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] karte = {\n            \"################\",\n            \"#              #\",\n            \"#     o    o  Z#\",\n            \"#    ###  ###  #\",\n            \"#@  o   ^^   ###\",\n            \"################\"\n        };\n        String[] meinLevel = {\n            \"########################\",\n            \"#                      #\",\n            \"#          o o     o  Z#\",\n            \"#     o   #####   ######\",\n            \"#    ###          #    #\",\n            \"#@  o    ^^^   o  #    #\",\n            \"########################\"\n        };\n        Scanner sc = new Scanner(System.in);\n        String erste = sc.nextLine();\n        Level lv = new Level(erste.equals(\"test\") ? karte : meinLevel);\n        Spieler s = new Spieler(lv.startX, lv.startY);\n        int leben = 3, muenzen = 0, tick = 0;\n        while (sc.hasNextLine()) {\n            String eingabe = sc.nextLine();\n            if (eingabe.equals(\"q\")) break;\n            s.update(lv, eingabe);\n            tick++;\n            char c = lv.get(s.x, s.y);\n            if (c == 'o') {\n                muenzen++;\n                lv.leeren(s.x, s.y);\n            } else if (c == '^') {\n                leben--;\n                System.out.println(\"Autsch! Noch \" + leben + \" Leben.\");\n                if (leben == 0) {\n                    System.out.println(\"Game Over nach \" + tick + \" Ticks.\");\n                    return;\n                }\n                s = new Spieler(lv.startX, lv.startY);\n            } else if (c == 'Z') {\n                zeichne(lv, s);\n                int bonus = Math.max(0, 1000 - 20 * tick);\n                System.out.println(\"Ziel nach \" + tick + \" Ticks mit \" + muenzen + \" Münzen!\");\n                System.out.println(\"Punkte: \" + (muenzen * 100 + bonus));\n                return;\n            }\n        }\n        zeichne(lv, s);\n        System.out.println(\"Spiel beendet. Münzen: \" + muenzen);\n    }\n}\n","tests":[{"name":"Testlevel gewinnen","input":["test","d", sics","p":"JavaScript, HTML, CSS, Node.js"},{"h":"Unser Game","p":"Canvas, Physik, Level, Multiplayer"},{"h":"Finale","p":"Dein Multiplayer-Jump’n’Run","cls":"good"}],"gap":1.1},"say":"Als Nächstes lernst du JavaScript – die Sprache des Browsers. Vieles kennst du schon aus Java. Und im Reiter „Unser Game“ baust du Schritt für Schritt das Multiplayer-Jump’n’Run. Bis gleich!"}]}]}],"challenges":[{"id":"c1","after":4,"level":"★☆☆ leicht","title":"FizzBuzz","teaser":"Das berühmteste Einstellungs-Rätsel für Programmierer: Zahlen von 1 bis 100 – aber mit einem Dreh.","uses":["for","%","else if"],"text":["Gib die Zahlen von 1 bis 100 aus, jede in einer eigenen Zeile. Aber: Ist die Zahl durch 3 teilbar, gib stattdessen „Fizz“ aus. Ist sie durch 5 teilbar, „Buzz“. Ist sie durch 3 **und** 5 teilbar, „FizzBuzz“.","Das Spiel wird gern bei Bewerbungsgesprächen verwendet – viele stolpern über die Reihenfolge der Bedingungen."],"req":["100 Zeilen Ausgabe","Vielfache von 3 → `Fizz`, von 5 → `Buzz`, von beiden → `FizzBuzz`","Alle anderen Zahlen werden normal ausgegeben"],"example":"1\n2\nFizz\n4\nBuzz\nFizz\n7\n…\n14\nFizzBuzz\n16","lookup":["Lektion 2 · Rechnen: `zahl % 3 == 0` heißt „durch 3 teilbar“","Lektion 3 · else if: Die erste passende Bedingung gewinnt – was muss also zuerst geprüft werden?","Lektion 4 · die for-Schleife von 1 bis 100"],"starter":"public class Main {\n    public static void main(String[] args) {\n        // FizzBuzz von 1 bis 100\n    }\n}\n","solution":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 100; i++) {\n            if (i % 15 == 0) {\n                System.out.println(\"FizzBuzz\");\n            } else if (i % 3 == 0) {\n                System.out.println(\"Fizz\");\n            } else if (i % 5 == 0) {\n                System.out.println(\"Buzz\");\n            } else {\n                System.out.println(i);\n            }\n        }\n    }\n}\n","tests":[{"name":"FizzBuzz 1–100","input":[],"expect":[{"re":"^1$","flags":"m","label":"1 wird ausgegeben"},{"re":"^Fizz$","flags":"m","label":"Fizz bei Vielfachen von 3"},{"re":"^Buzz$","flags":"m","label":"Buzz bei Vielfachen von 5"},{"re":"^FizzBuzz$","flags":"m","label":"FizzBuzz bei 15, 30, …"},{"re":"^98$","flags":"m","label":"normale Zahlen bis 100"},{"re":"^15$","flags":"m","not":true,"label":"15 erscheint nicht als Zahl"},{"re":"^(Fizz|Buzz)\\n(?=16)","flags":"m","not":true,"label":"bei 15 kommt FizzBuzz (nicht nur Fizz)"}]}],"codeChecks":[{"label":"Schleife verwendet","re":"\\bfor\\b|\\bwhile\\b"},{"label":"Modulo % verwendet","re":"%"}],"rubric":[["Programm kompiliert und läuft",20],["Alle Zahlen 1 bis 100 in eigener Zeile",20],["Fizz und Buzz richtig",30],["FizzBuzz richtig (Reihenfolge der Bedingungen)",30]],"tip":"Prüfe die strengste Bedingung (durch 3 und 5) zuerst – sonst landet 15 schon bei „Fizz“."},{"id":"c2","after":4,"level":"★★☆ mittel","title":"Primzahl-Detektor","teaser":"Ist 91 eine Primzahl? Dein Programm findet es heraus – für jede Zahl.","uses":["Scanner","Schleife","%","boolean","break"],"text":["Eine **Primzahl** ist eine Zahl größer als 1, die nur durch 1 und sich selbst teilbar ist (2, 3, 5, 7, 11, …).","Lies eine ganze Zahl ein und gib aus, ob sie eine Primzahl ist. Achtung: 1 ist keine Primzahl, 2 schon."],"req":["Zahl mit dem Scanner einlesen","Mit einer Schleife nach Teilern suchen","Ausgabe „… ist eine Primzahl“ oder „… ist keine Primzahl“","Richtig auch für 1, 2 und z. B. 91 (= 7 · 13)"],"example":"Zahl: 97\n97 ist eine Primzahl.","lookup":["Lektion 2 · `%`: Ist der Rest 0, ist die Zahl teilbar","Lektion 4 · Zählen mit Bedingung und `break`","Idee: Merk dir in einer `boolean`-Variable, ob du einen Teiler gefunden hast"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zahl: \");\n        int n = sc.nextInt();\n        // Ist n eine Primzahl?\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zahl: \");\n        int n = sc.nextInt();\n        boolean prim = n >= 2;\n        for (int t = 2; t * t <= n; t++) {\n            if (n % t == 0) {\n                prim = false;\n                break;\n            }\n        }\n        if (prim) {\n            System.out.println(n + \" ist eine Primzahl.\");\n        } else {\n            System.out.println(n + \" ist keine Primzahl.\");\n        }\n    }\n}\n","tests":[{"name":"97 (Primzahl)","input":["97"],"expect":[{"re":"prim","label":"Primzahl erkannt"},{"re":"kein|nicht","not":true,"label":"nicht fälschlich „keine“"}]},{"name":"2 (kleinste Primzahl)","input":["2"],"expect":[{"re":"prim","label":"2 ist Primzahl"},{"re":"kein|nicht","not":true,"label":"2 ist nicht „keine“"}]},{"name":"91 (= 7 · 13)","input":["91"],"expect":[{"re":"kein|nicht","label":"91 ist keine Primzahl"}]},{"name":"1 (keine Primzahl)","input":["1"],"expect":[{"re":"kein|nicht","label":"1 ist keine Primzahl"}]},{"name":"12","input":["12"],"expect":[{"re":"kein|nicht","label":"12 ist keine Primzahl"}]}],"codeChecks":[{"label":"Schleife verwendet","re":"\\bfor\\b|\\bwhile\\b"},{"label":"Modulo % verwendet","re":"%"}],"rubric":[["Programm kompiliert und läuft",15],["Eingabe mit Scanner",10],["Richtige Teilersuche mit Schleife und %",35],["Sonderfälle 1 und 2 richtig",20],["Klare Ausgabe",20]],"tip":"Du musst nur Teiler von 2 bis n − 1 prüfen. Profis hören schon bei der Wurzel von n auf."},{"id":"c3","after":4,"level":"★★☆ mittel","title":"Quersumme","teaser":"Wie zerlegt man 4711 in seine Ziffern – ohne Text, nur mit Rechnen?","uses":["while","% 10","/ 10"],"text":["Die **Quersumme** ist die Summe aller Ziffern einer Zahl: 4711 → 4 + 7 + 1 + 1 = 13.","Lies eine positive ganze Zahl ein und gib ihre Quersumme aus. Der Trick: Du brauchst nur `%` und `/` – keine Strings."],"req":["Zahl mit dem Scanner einlesen","Ziffern mit `% 10` und `/ 10` in einer Schleife abarbeiten","Quersumme ausgeben"],"example":"Zahl: 4711\nQuersumme: 13","lookup":["Lektion 2 · Ganzzahl-Division: `4711 % 10` ist 1 (letzte Ziffer), `4711 / 10` ist 471 (Ziffer abgeschnitten)","Lektion 4 · while: Wiederhole, solange die Zahl größer als 0 ist","Lektion 4 · Muster „Summe bilden“"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zahl: \");\n        int n = sc.nextInt();\n        // Quersumme berechnen\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zahl: \");\n        int n = sc.nextInt();\n        int summe = 0;\n        while (n > 0) {\n            summe += n % 10;\n            n = n / 10;\n        }\n        System.out.println(\"Quersumme: \" + summe);\n    }\n}\n","tests":[{"name":"4711","input":["4711"],"expect":[{"re":"\\b13\\b","label":"Quersumme 13"}]},{"name":"999999","input":["999999"],"expect":[{"re":"\\b54\\b","label":"Quersumme 54"}]},{"name":"1000","input":["1000"],"expect":[{"re":"\\b1\\b","label":"Quersumme 1"}]},{"name":"7","input":["7"],"expect":[{"re":"\\b7\\b","label":"Quersumme 7"}]}],"codeChecks":[{"label":"Schleife verwendet","re":"\\bwhile\\b|\\bfor\\b"},{"label":"% 10 verwendet","re":"%\\s*10"}],"rubric":[["Programm kompiliert und läuft",15],["Eingabe mit Scanner",10],["Ziffern richtig mit % und / zerlegt",45],["Richtiges Ergebnis für alle Zahlen",30]],"tip":"Spiel es auf Papier durch: 4711 → Rest 1, weiter mit 471 → Rest 1, weiter mit 47 → …"},{"id":"c4","after":5,"level":"★★☆ mittel","title":"Würfel-Statistik","teaser":"Ist der Zufall fair? Würfle 6000-mal und zeichne ein Balkendiagramm aus Sternen.","uses":["Random","Array als Zähler","verschachtelte Schleifen","printf"],"text":["Würfle 6000-mal mit `Random` und zähle, wie oft jede Augenzahl von 1 bis 6 kommt. Benutze dafür ein **Array als Zähler**: Fach 3 zählt zum Beispiel die Dreier.","Gib dann für jede Augenzahl die Anzahl aus und dahinter einen Balken: ein Stern pro 100 Würfe."],"req":["6000 Würfe mit `Random`","Ein `int`-Array zählt die Augenzahlen","Sechs Zeilen: Augenzahl, Anzahl und Sterne-Balken","Ein Stern pro 100 Würfe"],"example":"1:  987 *********\n2: 1013 **********\n3: 1002 **********\n4:  998 *********\n5: 1021 **********\n6:  979 *********","lookup":["Lektion 5 · Arrays: `anzahl[wurf]++` erhöht genau das Fach für diese Augenzahl","Lektion 4 · Zufall: `nextInt(6) + 1` und verschachtelte Schleifen für die Sterne","Lektion 3 · printf mit `%4d` für saubere Spalten"],"starter":"import java.util.Random;\n\npublic class Main {\n    public static void main(String[] args) {\n        Random zufall = new Random();\n        // Würfeln, zählen, Balken ausgeben\n    }\n}\n","solution":"import java.util.Random;\n\npublic class Main {\n    public static void main(String[] args) {\n        Random zufall = new Random();\n        int[] anzahl = new int[7];\n        for (int i = 0; i < 6000; i++) {\n            anzahl[zufall.nextInt(6) + 1]++;\n        }\n        for (int augen = 1; augen <= 6; augen++) {\n            System.out.printf(\"%d: %4d \", augen, anzahl[augen]);\n            for (int s = 0; s < anzahl[augen] / 100; s++) {\n                System.out.print(\"*\");\n            }\n            System.out.println();\n        }\n    }\n}\n","tests":[{"name":"Sechs Balken","input":[],"expect":[{"re":"^\\s*1\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 1 mit Anzahl und Sternen"},{"re":"^\\s*2\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 2 mit Anzahl und Sternen"},{"re":"^\\s*3\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 3 mit Anzahl und Sternen"},{"re":"^\\s*4\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 4 mit Anzahl und Sternen"},{"re":"^\\s*5\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 5 mit Anzahl und Sternen"},{"re":"^\\s*6\\D[^\\n]*\\d+[^\\n]*\\*{5,}","flags":"m","label":"Zeile für 6 mit Anzahl und Sternen"}]}],"codeChecks":[{"label":"int-Array als Zähler","re":"int\\s*\\[\\s*\\]"},{"label":"Würfel mit nextInt(6)","re":"nextInt\\s*\\(\\s*6\\s*\\)"}],"rubric":[["Programm kompiliert und läuft",15],["6000 Würfe richtig gezählt (Array als Zähler)",40],["Sechs Zeilen mit Augenzahl und Anzahl",20],["Sterne-Balken richtig (1 Stern pro 100)",25]],"tip":"Mach das Array 7 Fächer groß und benutze nur die Fächer 1 bis 6 – dann passt die Augenzahl direkt als Index."},{"id":"c5","after":5,"level":"★★★ knifflig","title":"Schere, Stein, Papier","teaser":"Drei Runden gegen den Computer – mit Punktestand und Sieger.","uses":["Scanner","String-Array","Random","equals","&& ||"],"text":["Spiel drei Runden „Schere, Stein, Papier“ gegen den Computer. Der Spieler tippt `schere`, `stein` oder `papier`, der Computer wählt zufällig.","Schere schlägt Papier, Stein schlägt Schere, Papier schlägt Stein. Nach jeder Runde zeigt das Programm die Wahl des Computers und wer den Punkt bekommt. Am Ende: Endstand und Sieger."],"req":["Drei Runden mit einer Schleife","Computer wählt zufällig aus einem `String`-Array","Vergleich der Texte mit `equals`","Richtiger Punkt in jeder Runde (oder unentschieden)","Endstand und Gesamtsieger"],"example":"Runde 1 – schere, stein oder papier? stein\nComputer: schere\nPunkt für dich!\n…\nEndstand 2:1\nDu hast gewonnen!","lookup":["Lektion 3 · Strings vergleichen: immer `equals`, nie `==`","Lektion 5 · `String[] wahl = {\"schere\", \"stein\", \"papier\"};` und `wahl[zufall.nextInt(3)]`","Lektion 3 · `&&` und `||` kombinieren – Klammern helfen beim Lesen"],"starter":"import java.util.Random;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        Random zufall = new Random();\n        String[] wahl = {\"schere\", \"stein\", \"papier\"};\n        // Drei Runden spielen\n    }\n}\n","solution":"import java.util.Random;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        Random zufall = new Random();\n        String[] wahl = {\"schere\", \"stein\", \"papier\"};\n        int ich = 0, pc = 0;\n        for (int runde = 1; runde <= 3; runde++) {\n            System.out.print(\"Runde \" + runde + \" – schere, stein oder papier? \");\n            String du = sc.next();\n            String comp = wahl[zufall.nextInt(3)];\n            System.out.println(\"Computer: \" + comp);\n            if (du.equals(comp)) {\n                System.out.println(\"Unentschieden!\");\n            } else if ((du.equals(\"schere\") && comp.equals(\"papier\")) || (du.equals(\"stein\") && comp.equals(\"schere\")) || (du.equals(\"papier\") && comp.equals(\"stein\"))) {\n                System.out.println(\"Punkt für dich!\");\n                ich++;\n            } else {\n                System.out.println(\"Punkt für den Computer!\");\n                pc++;\n            }\n        }\n        System.out.println(\"Endstand \" + ich + \":\" + pc);\n        if (ich > pc) {\n            System.out.println(\"Du hast gewonnen!\");\n        } else if (pc > ich) {\n            System.out.println(\"Du hast verloren!\");\n        } else {\n            System.out.println(\"Unentschieden!\");\n        }\n    }\n}\n","tests":[{"name":"Drei Runden spielen","input":["stein","papier","schere"],"expect":[{"re":"(schere|stein|papier)","label":"Wahl des Computers wird angezeigt"},{"re":"gewonnen|verloren|unentschieden","label":"Ergebnis am Ende"},{"re":"\\d\\s*:\\s*\\d|\\d\\s+zu\\s+\\d","label":"Endstand"}]},{"name":"Nochmal (anderer Zufall)","input":["papier","papier","papier"],"expect":[{"re":"gewonnen|verloren|unentschieden","label":"Ergebnis am Ende"}]}],"codeChecks":[{"label":"Texte mit equals verglichen","re":"\\.equals\\s*\\("},{"label":"Zufall mit Random","re":"nextInt\\s*\\(\\s*3\\s*\\)"},{"label":"Schleife für die Runden","re":"\\bfor\\b|\\bwhile\\b"}],"rubric":[["Programm kompiliert und läuft",15],["Drei Runden mit Eingabe und Zufallswahl",20],["Gewinner jeder Runde richtig bestimmt (alle Kombinationen)",35],["Punkte gezählt, Endstand und Sieger richtig",20],["Verständliche Ausgabe",10]],"tip":"Schreib dir zuerst die drei Fälle auf, in denen DU gewinnst. Alles andere ist entweder unentschieden oder ein Punkt für den Computer."},{"id":"c6","after":5,"level":"★★★ knifflig","title":"Sternen-Pyramide","teaser":"Aus dem Dreieck aus Lektion 4 wird eine echte, mittige Pyramide – für jede Höhe.","uses":["Scanner","verschachtelte Schleifen","Muster rechnen"],"text":["Lies eine Höhe ein und zeichne eine **mittige Pyramide** aus Sternen. Bei Höhe 4 sieht sie so aus:","`   *` · `  ***` · ` *****` · `*******` – jede Zeile hat zwei Sterne mehr und ein Leerzeichen weniger davor."],"req":["Höhe mit dem Scanner einlesen","Jede Zeile: erst Leerzeichen, dann Sterne","Zeile z hat `h − z` Leerzeichen und `2·z − 1` Sterne","Funktioniert für jede Höhe"],"example":"Höhe: 4\n   *\n  ***\n *****\n*******","lookup":["Lektion 4 · Verschachtelte Schleifen: das Sternen-Dreieck","Tipp: Zähl bei Höhe 4 nach – wie viele Leerzeichen und Sterne hat Zeile 1, 2, 3, 4?","Lektion 1 · `print` bleibt in der Zeile, `println` beendet sie"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Höhe: \");\n        int h = sc.nextInt();\n        // Pyramide zeichnen\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Höhe: \");\n        int h = sc.nextInt();\n        for (int zeile = 1; zeile <= h; zeile++) {\n            for (int s = 0; s < h - zeile; s++) {\n                System.out.print(\" \");\n            }\n            for (int k = 0; k < 2 * zeile - 1; k++) {\n                System.out.print(\"*\");\n            }\n            System.out.println();\n        }\n    }\n}\n","tests":[{"name":"Höhe 3","input":["3"],"expect":[{"re":" {2}\\*[ \\t]*\\n \\*{3}[ \\t]*\\n\\*{5}[ \\t]*(\\n|$)","label":"Pyramide der Höhe 3"}]},{"name":"Höhe 5","input":["5"],"expect":[{"re":" {4}\\*[ \\t]*\\n {3}\\*{3}[ \\t]*\\n {2}\\*{5}[ \\t]*\\n \\*{7}[ \\t]*\\n\\*{9}[ \\t]*(\\n|$)","label":"Pyramide der Höhe 5"}]},{"name":"Höhe 1","input":["1"],"expect":[{"re":"(^|[^*])\\*[ \\t]*(\\n|$)","label":"ein einzelner Stern"},{"re":"\\*\\*","not":true,"label":"nicht mehr als ein Stern"}]}],"codeChecks":[{"label":"verschachtelte Schleifen","re":"for\\s*\\([^)]*\\)[\\s\\S]*for\\s*\\("}],"rubric":[["Programm kompiliert und läuft",15],["Eingabe der Höhe",10],["Richtige Anzahl Sterne pro Zeile",30],["Richtige Anzahl Leerzeichen (mittig)",30],["Funktioniert für beliebige Höhen",15]],"tip":"Zeichne erst nur die Sterne (2·z − 1), ohne Leerzeichen. Wenn das stimmt, kommen die Leerzeichen davor."},{"id":"c7","after":7,"level":"★★☆ mittel","title":"Palindrom-Prüfer","teaser":"„Lagerregal“ liest sich rückwärts gleich. Dein Programm erkennt solche Wörter und sogar ganze Sätze.","uses":["charAt","toLowerCase","Schleife","boolean"],"text":["Lies eine Zeile ein und prüfe, ob sie ein **Palindrom** ist – also vorwärts und rückwärts gleich gelesen wird. Groß- und Kleinschreibung und Leerzeichen zählen dabei nicht.","Gib „Palindrom!“ oder „Kein Palindrom.“ aus."],"req":["Eingabe mit `nextLine()`","Groß/klein und Leerzeichen ignorieren","Vergleich von vorne und hinten (Schleife oder StringBuilder)","Ausgabe „Palindrom!“ bzw. „Kein Palindrom.“"],"example":"Text: Trug Tim eine so helle Hose nie mit Gurt\nPalindrom!","lookup":["Lektion 7 · `replace(\" \", \"\")` und `toLowerCase()`","Lektion 7 · `charAt(i)` und `charAt(länge - 1 - i)` vergleichen","Lektion 7 · `new StringBuilder(text).reverse()`"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Text: \");\n        String text = sc.nextLine();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Text: \");\n        String text = sc.nextLine().replace(\" \", \"\").toLowerCase();\n        boolean palindrom = true;\n        for (int i = 0; i < text.length() / 2; i++) {\n            if (text.charAt(i) != text.charAt(text.length() - 1 - i)) {\n                palindrom = false;\n                break;\n            }\n        }\n        System.out.println(palindrom ? \"Palindrom!\" : \"Kein Palindrom.\");\n    }\n}\n","tests":[{"name":"Lagerregal","input":["Lagerregal"],"expect":[{"re":"palindrom!","label":"„Palindrom!“"},{"re":"kein","label":"nicht „Kein“","not":true}]},{"name":"Satz","input":["Trug Tim eine so helle Hose nie mit Gurt"],"expect":[{"re":"palindrom","label":"„Palindrom!“"},{"re":"kein","label":"nicht „Kein“","not":true}]},{"name":"Hallo","input":["Hallo"],"expect":[{"re":"kein palindrom","label":"„Kein Palindrom.“"}]}],"rubric":[["Programm kompiliert und läuft",15],["Leerzeichen und Groß/klein ignoriert",25],["Vergleich richtig",40],["Klare Ausgabe",10],["Lesbarer Code",10]],"tip":"Mach den Text zuerst „sauber“ (keine Leerzeichen, alles klein). Dann vergleichst du Zeichen i mit Zeichen länge − 1 − i."},{"id":"c8","after":7,"level":"★★☆ mittel","title":"Wort-Statistik","teaser":"Wie viele Wörter hat ein Satz, welches ist das längste – und wie lang sind die Wörter im Schnitt?","uses":["split","length()","Maximum","double"],"text":["Lies einen Satz ein (Wörter durch Leerzeichen getrennt). Gib aus: die Anzahl der Wörter, das **längste** Wort (bei Gleichstand das erste) und die durchschnittliche Wortlänge mit einer Nachkommastelle."],"req":["Satz mit `split(\" \")` zerlegen","Anzahl der Wörter","Längstes Wort (erstes bei Gleichstand)","Durchschnittliche Länge mit 1 Nachkommastelle"],"example":"Satz: Mario springt über drei grüne Röhren\nWörter: 6\nLängstes: springt\nSchnitt: 5,3","lookup":["Lektion 7 · `split` zerlegt Text in ein Array","Lektion 5 · Maximum in einem Array suchen","Lektion 2 · `printf(\"%.1f\")` für eine Nachkommastelle"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Satz: \");\n        String satz = sc.nextLine();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Satz: \");\n        String[] woerter = sc.nextLine().split(\" \");\n        String laengstes = \"\";\n        int summe = 0;\n        for (String w : woerter) {\n            summe += w.length();\n            if (w.length() > laengstes.length()) {\n                laengstes = w;\n            }\n        }\n        System.out.println(\"Wörter: \" + woerter.length);\n        System.out.println(\"Längstes: \" + laengstes);\n        System.out.printf(\"Schnitt: %.1f%n\", (double) summe / woerter.length);\n    }\n}\n","tests":[{"name":"Mario","input":["Mario springt über drei grüne Röhren"],"expect":[{"re":"w(ö|oe)rter:?\\s*6","label":"6 Wörter"},{"re":"springt","label":"längstes: springt"},{"re":"5[.,]3","label":"Schnitt 5,3"}]},{"name":"Gleichstand","input":["ab cd ef"],"expect":[{"re":"l(ä|ae)ngstes:?\\s*ab","label":"erstes bei Gleichstand: ab"},{"re":"2[.,]0","label":"Schnitt 2,0"}]}],"rubric":[["Programm kompiliert und läuft",15],["Wörter richtig gezählt",20],["Längstes Wort richtig",30],["Durchschnitt richtig formatiert",25],["Lesbarer Code",10]],"tip":"Ein `>` statt `>=` beim Vergleich sorgt dafür, dass bei Gleichstand das erste Wort gewinnt."},{"id":"c9","after":9,"level":"★★☆ mittel","title":"Einkaufszettel","teaser":"Eine kleine Kassen-App: Artikel mit Preis und Menge, Gesamtsumme und der teuerste Posten.","uses":["Klasse","private + Getter","ArrayList","split","printf"],"text":["Schreib eine Klasse `Artikel` mit private-Feldern `name`, `preis` (double) und `menge` (int), Gettern und einer Methode `double summe()` (preis × menge).","Lies Zeilen wie „Milch 1.29 2“ ein, bis „fertig“ kommt. Gib dann jede Position mit ihrer Summe aus, danach „Gesamt: … €“ (2 Nachkommastellen) und „Teuerste Position: Name“."],"req":["Klasse `Artikel` mit private-Feldern, Gettern, `summe()`","`ArrayList<Artikel>`","Zeilen mit `split` und `parseDouble`/`parseInt` zerlegen","Gesamtsumme mit 2 Nachkommastellen","Teuerste Position"],"example":"Milch 1.29 2\nPizza 4.99 1\nÄpfel 0.45 6\nfertig\nMilch: 2,58 €\nPizza: 4,99 €\nÄpfel: 2,70 €\nGesamt: 10,27 €\nTeuerste Position: Pizza","lookup":["Lektion 9 · Listen von Objekten und Kapselung","Lektion 7 · `split` und `Double.parseDouble`","Lektion 9 · „bestes Objekt merken“ (Bestenliste)"],"starter":"import java.util.ArrayList;\nimport java.util.Scanner;\n\nclass Artikel {\n    // private Felder, Konstruktor, Getter, summe()\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<Artikel> zettel = new ArrayList<>();\n    }\n}\n","solution":"import java.util.ArrayList;\nimport java.util.Scanner;\n\nclass Artikel {\n    private String name;\n    private double preis;\n    private int menge;\n\n    Artikel(String name, double preis, int menge) {\n        this.name = name;\n        this.preis = preis;\n        this.menge = menge;\n    }\n\n    public String getName() { return name; }\n    public double getPreis() { return preis; }\n    public int getMenge() { return menge; }\n\n    double summe() {\n        return preis * menge;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        ArrayList<Artikel> zettel = new ArrayList<>();\n        while (true) {\n            String zeile = sc.nextLine();\n            if (zeile.equals(\"fertig\")) break;\n            String[] t = zeile.split(\" \");\n            zettel.add(new Artikel(t[0], Double.parseDouble(t[1]), Integer.parseInt(t[2])));\n        }\n        double gesamt = 0;\n        Artikel teuerste = null;\n        for (Artikel a : zettel) {\n            System.out.printf(\"%s: %.2f €%n\", a.getName(), a.summe());\n            gesamt += a.summe();\n            if (teuerste == null || a.summe() > teuerste.summe()) teuerste = a;\n        }\n        System.out.printf(\"Gesamt: %.2f €%n\", gesamt);\n        if (teuerste != null) System.out.println(\"Teuerste Position: \" + teuerste.getName());\n    }\n}\n","tests":[{"name":"drei Artikel","input":["Milch 1.29 2","Pizza 4.99 1","Äpfel 0.45 6","fertig"],"expect":[{"re":"gesamt:?\\s*10[.,]27","label":"Gesamt 10,27"},{"re":"teuerste[^\\n]*pizza","label":"teuerste: Pizza"},{"re":"2[.,]70","label":"Äpfel: 2,70"}]},{"name":"Menge zählt","input":["Kaugummi 0.99 10","Buch 8.50 1","fertig"],"expect":[{"re":"gesamt:?\\s*18[.,]40","label":"Gesamt 18,40"},{"re":"teuerste[^\\n]*kaugummi","label":"teuerste: Kaugummi (9,90)"}]}],"codeChecks":[{"label":"Klasse Artikel","re":"class\\s+Artikel"},{"label":"private Felder","re":"private\\s+\\w+\\s+\\w+\\s*;"},{"label":"Methode summe()","re":"double\\s+summe\\s*\\(\\s*\\)"}],"rubric":[["Programm kompiliert und läuft",15],["Klasse mit Kapselung und summe()",25],["Einlesen bis „fertig“",15],["Summen und Gesamt richtig formatiert",25],["Teuerste Position",20]],"tip":"`printf(\"%.2f\", wert)` gibt genau zwei Nachkommastellen aus. Die teuerste Position ist die mit der größten `summe()`, nicht dem größten Einzelpreis."},{"id":"c10","after":10,"level":"★★☆ mittel","title":"Rennstrecke","teaser":"Auto, Fahrrad und Rakete fahren um die Wette – jedes Fahrzeug rechnet seine Zeit selbst aus.","uses":["abstract","extends","@Override","Polymorphie","ArrayList"],"text":["Schreib eine abstrakte Klasse `Fahrzeug` mit `abstract double tempo()` (km/h) und `abstract String name()`. Unterklassen: `Fahrrad` (20 km/h), `Auto` (120 km/h), `Rakete` (3000 km/h).","Lies zuerst die Strecke in km (double), dann eine Zeile mit Kürzeln (f, a, r). Gib für jedes Fahrzeug die Zeit in Minuten mit 1 Nachkommastelle aus und am Ende den Sieger."],"req":["Abstrakte Klasse mit zwei abstrakten Methoden","Drei Unterklassen mit `@Override`","`ArrayList<Fahrzeug>` und Polymorphie","Zeit in Minuten = Strecke / Tempo × 60","Sieger ausgeben"],"example":"Strecke (km): 10\nFahrzeuge: f a\nFahrrad: 30,0 min\nAuto: 5,0 min\nSieger: Auto","lookup":["Lektion 10 · abstrakte Klassen und Power-ups","Lektion 9 · Liste von Objekten","Lektion 2 · `printf(\"%.1f\")`"],"starter":"import java.util.ArrayList;\nimport java.util.Scanner;\n\n// abstract class Fahrzeug { ... }\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Strecke (km): \");\n        double strecke = Double.parseDouble(sc.nextLine());\n        System.out.print(\"Fahrzeuge: \");\n        String[] kuerzel = sc.nextLine().split(\" \");\n    }\n}\n","solution":"import java.util.ArrayList;\nimport java.util.Scanner;\n\nabstract class Fahrzeug {\n    abstract double tempo();\n    abstract String name();\n}\n\nclass Fahrrad extends Fahrzeug {\n    @Override double tempo() { return 20; }\n    @Override String name() { return \"Fahrrad\"; }\n}\n\nclass Auto extends Fahrzeug {\n    @Override double tempo() { return 120; }\n    @Override String name() { return \"Auto\"; }\n}\n\nclass Rakete extends Fahrzeug {\n    @Override double tempo() { return 3000; }\n    @Override String name() { return \"Rakete\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Strecke (km): \");\n        double strecke = Double.parseDouble(sc.nextLine());\n        System.out.print(\"Fahrzeuge: \");\n        String[] kuerzel = sc.nextLine().split(\" \");\n        ArrayList<Fahrzeug> feld = new ArrayList<>();\n        for (String k : kuerzel) {\n            if (k.equals(\"f\")) feld.add(new Fahrrad());\n            else if (k.equals(\"a\")) feld.add(new Auto());\n            else if (k.equals(\"r\")) feld.add(new Rakete());\n        }\n        Fahrzeug sieger = null;\n        for (Fahrzeug f : feld) {\n            System.out.printf(\"%s: %.1f min%n\", f.name(), strecke / f.tempo() * 60);\n            if (sieger == null || f.tempo() > sieger.tempo()) sieger = f;\n        }\n        if (sieger != null) System.out.println(\"Sieger: \" + sieger.name());\n    }\n}\n","tests":[{"name":"10 km, f a","input":["10","f a"],"expect":[{"re":"30[.,]0","label":"Fahrrad 30,0 min"},{"re":"5[.,]0","label":"Auto 5,0 min"},{"re":"sieger:?\\s*auto","label":"Sieger: Auto"}]},{"name":"150 km, a r f","input":["150","a r f"],"expect":[{"re":"75[.,]0","label":"Auto 75,0 min"},{"re":"3[.,]0","label":"Rakete 3,0 min"},{"re":"450[.,]0","label":"Fahrrad 450,0 min"},{"re":"sieger:?\\s*rakete","label":"Sieger: Rakete"}]}],"codeChecks":[{"label":"abstract class Fahrzeug","re":"abstract\\s+class\\s+Fahrzeug"},{"label":"drei Unterklassen","re":"extends\\s+Fahrzeug[\\s\\S]*extends\\s+Fahrzeug[\\s\\S]*extends\\s+Fahrzeug"}],"rubric":[["Programm kompiliert und läuft",15],["Abstrakte Klasse und Unterklassen",30],["Polymorphe Liste",20],["Zeiten richtig berechnet und formatiert",20],["Sieger richtig",15]],"tip":"Die Zeit in Stunden ist Strecke durch Tempo. Mal 60 ergibt Minuten."},{"id":"c11","after":11,"level":"★★★ knifflig","title":"Minesweeper-Hinweise","teaser":"Kennst du Minesweeper? Berechne für jedes Feld, wie viele Minen rundherum liegen.","uses":["2D-Array","verschachtelte Schleifen","Nachbarn prüfen","Grenzen"],"text":["Lies zuerst die Anzahl der Zeilen ein, dann die Zeilen des Feldes: `*` ist eine Mine, `.` ist leer.","Gib das Feld wieder aus – aber jedes leere Feld wird durch die Anzahl der Minen in den **8 Nachbarfeldern** ersetzt. Minen bleiben `*`."],"req":["Feld als `char[][]` einlesen","Für jedes Feld alle 8 Nachbarn prüfen","Ränder des Feldes beachten","Ausgabe im gleichen Format"],"example":"Zeilen: 3\n*...\n..*.\n....\n*211\n12*1\n0111","lookup":["Lektion 11 · 2D-Arrays und Level aus Text","Lektion 11 · Grenzen prüfen, bevor man zugreift","Lektion 4 · verschachtelte Schleifen: dy und dx von −1 bis 1"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zeilen: \");\n        int n = Integer.parseInt(sc.nextLine());\n        char[][] feld = new char[n][];\n        for (int y = 0; y < n; y++) {\n            feld[y] = sc.nextLine().toCharArray();\n        }\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zeilen: \");\n        int n = Integer.parseInt(sc.nextLine());\n        char[][] feld = new char[n][];\n        for (int y = 0; y < n; y++) {\n            feld[y] = sc.nextLine().toCharArray();\n        }\n        for (int y = 0; y < n; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < feld[y].length; x++) {\n                if (feld[y][x] == '*') {\n                    sb.append('*');\n                    continue;\n                }\n                int minen = 0;\n                for (int dy = -1; dy <= 1; dy++) {\n                    for (int dx = -1; dx <= 1; dx++) {\n                        int ny = y + dy, nx = x + dx;\n                        if (ny >= 0 && ny < n && nx >= 0 && nx < feld[ny].length && feld[ny][nx] == '*') {\n                            minen++;\n                        }\n                    }\n                }\n                sb.append(minen);\n            }\n            System.out.println(sb);\n        }\n    }\n}\n","tests":[{"name":"3×4","input":["3","*...","..*.","...."],"expect":[{"re":"^\\*211$","flags":"m","label":"Zeile 1: *211"},{"re":"^12\\*1$","flags":"m","label":"Zeile 2: 12*1"},{"re":"^0111$","flags":"m","label":"Zeile 3: 0111"}]},{"name":"Ecken","input":["2",".*","*."],"expect":[{"re":"^2\\*$","flags":"m","label":"Zeile 1: 2*"},{"re":"^\\*2$","flags":"m","label":"Zeile 2: *2"}]}],"codeChecks":[{"label":"2D-Array","re":"char\\s*\\[\\s*\\]\\s*\\[\\s*\\]"}],"rubric":[["Programm kompiliert und läuft",15],["Feld richtig eingelesen",15],["Nachbarn richtig gezählt",35],["Ränder ohne Absturz",20],["Ausgabe im richtigen Format",15]],"tip":"Zwei kleine Schleifen `dy` und `dx` von −1 bis 1 laufen über alle 9 Felder rund um (x, y). Prüf vor dem Zugriff, ob ny und nx im Feld liegen."},{"id":"c12","after":11,"level":"★★☆ mittel","title":"Lücken-Detektor","teaser":"Level-Designer aufgepasst: Findet dein Programm die breiteste Lücke im Boden – und ist sie überhaupt springbar?","uses":["Level aus Text","Zählen in Folge","Maximum"],"text":["Lies die Anzahl der Zeilen und dann ein Level ein (`#` ist Boden). Untersuche die **unterste** Zeile: Eine Lücke ist eine Folge von Feldern, die **kein** `#` sind.","Gib die breiteste Lücke aus: „Breiteste Lücke: N Felder ab x=…“ (x ist das erste Feld der Lücke). Ist sie höchstens 3 Felder breit, gib „Springbar!“ aus, sonst „Zu breit!“. Gibt es keine Lücke: „Keine Lücke.“"],"req":["Level einlesen","Nur die unterste Zeile untersuchen","Längste Folge ohne `#` und ihren Anfang finden","Springbar-Bewertung"],"example":"Zeilen: 3\n#..........#\n#....##....#\n###..##^^^##\nBreiteste Lücke: 3 Felder ab x=7\nSpringbar!","lookup":["Lektion 11 · Level aus Text","Lektion 5 · Maximum suchen","Lektion 4 · Zähler, der bei # wieder auf 0 springt"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zeilen: \");\n        int n = Integer.parseInt(sc.nextLine());\n        String[] level = new String[n];\n        for (int i = 0; i < n; i++) {\n            level[i] = sc.nextLine();\n        }\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Zeilen: \");\n        int n = Integer.parseInt(sc.nextLine());\n        String[] level = new String[n];\n        for (int i = 0; i < n; i++) {\n            level[i] = sc.nextLine();\n        }\n        String boden = level[n - 1];\n        int best = 0, bestStart = -1, lauf = 0;\n        for (int x = 0; x < boden.length(); x++) {\n            if (boden.charAt(x) == '#') {\n                lauf = 0;\n            } else {\n                lauf++;\n                if (lauf > best) {\n                    best = lauf;\n                    bestStart = x - lauf + 1;\n                }\n            }\n        }\n        if (best == 0) {\n            System.out.println(\"Keine Lücke.\");\n        } else {\n            System.out.println(\"Breiteste Lücke: \" + best + \" Felder ab x=\" + bestStart);\n            System.out.println(best <= 3 ? \"Springbar!\" : \"Zu breit!\");\n        }\n    }\n}\n","tests":[{"name":"Stacheln","input":["3","#..........#","#....##....#","###..##^^^##"],"expect":[{"re":"3 felder ab x=7","label":"3 Felder ab x=7"},{"re":"springbar","label":"Springbar!"}]},{"name":"zu breit","input":["2","#........#","##.....###"],"expect":[{"re":"5 felder ab x=2","label":"5 Felder ab x=2"},{"re":"zu breit","label":"Zu breit!"}]},{"name":"keine","input":["1","######"],"expect":[{"re":"keine l(ü|ue)cke","label":"Keine Lücke."}]}],"rubric":[["Programm kompiliert und läuft",15],["Unterste Zeile richtig untersucht",15],["Breiteste Lücke richtig",35],["Startposition richtig",20],["Bewertung und Sonderfall",15]],"tip":"Ein Zähler `lauf` wächst bei jedem Nicht-#-Feld und springt bei # auf 0 zurück. Immer wenn er einen neuen Rekord erreicht, merkst du dir Länge und Anfang (x − lauf + 1)."}],"finale":[{"id":"f01","nr":1,"level":"★☆☆ Finale 1/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Richtige Werte für alle Zeilen",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Temperatur-Tabelle","teaser":"Eine saubere Umrechnungs-Tabelle von Celsius nach Fahrenheit.","uses":["for","printf"],"text":["Lies Start, Ende und Schrittweite (drei Zahlen, je eine Zeile) ein. Gib für jede Celsius-Temperatur von Start bis Ende eine Zeile „C °C = F °F“ aus, F mit einer Nachkommastelle. Formel: F = C × 9 / 5 + 32."],"example":"0\n30\n10\n0 °C = 32,0 °F\n10 °C = 50,0 °F\n20 °C = 68,0 °F\n30 °C = 86,0 °F","lookup":["Lektion 4 · for mit Schrittweite `i += schritt`","Lektion 2 · `printf(\"%.1f\")` und double-Rechnung"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int start = sc.nextInt();\n        int ende = sc.nextInt();\n        int schritt = sc.nextInt();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int start = sc.nextInt();\n        int ende = sc.nextInt();\n        int schritt = sc.nextInt();\n        for (int c = start; c <= ende; c += schritt) {\n            System.out.printf(\"%d °C = %.1f °F%n\", c, c * 9 / 5.0 + 32);\n        }\n    }\n}\n","tests":[{"name":"0 bis 30","input":["0","30","10"],"expect":[{"re":"0 °C = 32[.,]0","label":"0 °C = 32,0 °F"},{"re":"30 °C = 86[.,]0","label":"30 °C = 86,0 °F"}]},{"name":"-5 bis 5","input":["-5","5","5"],"expect":[{"re":"-5 °C = 23[.,]0","label":"−5 °C = 23,0 °F"},{"re":"5 °C = 41[.,]0","label":"5 °C = 41,0 °F"}]}],"main":"Richtige Werte für alle Zeilen","tip":"Achtung Ganzzahl-Falle: `c * 9 / 5` rechnet mit int. Schreib `5.0`."},{"id":"f02","nr":2,"level":"★☆☆ Finale 2/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["ggT richtig nach Euklid",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Größter gemeinsamer Teiler","teaser":"Der älteste Algorithmus der Welt – von Euklid, über 2300 Jahre alt.","uses":["while","%","Methode"],"text":["Schreib eine Methode `static int ggt(int a, int b)` nach dem Euklid-Verfahren: Solange b nicht 0 ist, wird (a, b) zu (b, a % b). Dann ist a der ggT.","Lies zwei Zahlen ein und gib „ggT = …“ aus. Bonus: gib auch das kleinste gemeinsame Vielfache aus (a × b / ggT)."],"example":"48\n18\nggT = 6\nkgV = 144","lookup":["Lektion 6 · Methoden mit Rückgabewert","Lektion 4 · while-Schleife","Lektion 2 · Modulo %"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    // static int ggt(int a, int b) { ... }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int a = sc.nextInt();\n        int b = sc.nextInt();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    static int ggt(int a, int b) {\n        while (b != 0) {\n            int rest = a % b;\n            a = b;\n            b = rest;\n        }\n        return a;\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int a = sc.nextInt();\n        int b = sc.nextInt();\n        int g = ggt(a, b);\n        System.out.println(\"ggT = \" + g);\n        System.out.println(\"kgV = \" + (a / g * b));\n    }\n}\n","tests":[{"name":"48, 18","input":["48","18"],"expect":[{"re":"ggt\\s*=\\s*6\\b","label":"ggT = 6"}]},{"name":"17, 5","input":["17","5"],"expect":[{"re":"ggt\\s*=\\s*1\\b","label":"ggT = 1"}]},{"name":"100, 75","input":["100","75"],"expect":[{"re":"ggt\\s*=\\s*25\\b","label":"ggT = 25"}]}],"codeChecks":[{"label":"Methode ggt(int, int)","re":"static\\s+int\\s+ggt\\s*\\(\\s*int\\s+\\w+\\s*,\\s*int"}],"main":"ggT richtig nach Euklid","tip":"Merk dir den Rest in einer Hilfsvariable, bevor du a und b überschreibst."},{"id":"f03","nr":3,"level":"★☆☆ Finale 3/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Folge, Schritte und Maximum richtig",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Collatz-Folge","teaser":"Ein ungelöstes Rätsel der Mathematik: Landet jede Zahl irgendwann bei 1?","uses":["while","if/else","Zähler"],"text":["Lies eine Zahl n ein. Solange n nicht 1 ist: Ist n gerade, halbiere sie, sonst rechne 3n + 1. Gib die ganze Folge in einer Zeile aus (mit Leerzeichen getrennt), danach „Schritte: …“ und „Höchster Wert: …“."],"example":"6\n6 3 10 5 16 8 4 2 1\nSchritte: 8\nHöchster Wert: 16","lookup":["Lektion 4 · while mit Bedingung","Lektion 3 · gerade/ungerade mit % 2"],"starter":"public class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"\");\n        int n = sc.nextInt();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int schritte = 0, max = n;\n        StringBuilder folge = new StringBuilder(\"\" + n);\n        while (n != 1) {\n            if (n % 2 == 0) n = n / 2;\n            else n = 3 * n + 1;\n            schritte++;\n            if (n > max) max = n;\n            folge.append(\" \").append(n);\n        }\n        System.out.println(folge);\n        System.out.println(\"Schritte: \" + schritte);\n        System.out.println(\"Höchster Wert: \" + max);\n    }\n}\n","tests":[{"name":"6","input":["6"],"expect":[{"has":"6 3 10 5 16 8 4 2 1","label":"Folge von 6"},{"re":"schritte:?\\s*8\\b","label":"Schritte: 8"},{"re":"wert:?\\s*16\\b","label":"Höchster Wert: 16"}]},{"name":"27","input":["27"],"expect":[{"re":"schritte:?\\s*111\\b","label":"Schritte: 111"},{"re":"wert:?\\s*9232\\b","label":"Höchster Wert: 9232"}]}],"main":"Folge, Schritte und Maximum richtig","tip":"Die 27 braucht 111 Schritte und klettert bis 9232 – ein guter Test für deine Schleife."},{"id":"f04","nr":4,"level":"★★☆ Finale 4/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Richtige Binärzahl und Anzahl der Einsen",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Binär-Umwandler","teaser":"Computer denken in Nullen und Einsen. Wandle Zahlen selbst ins Binärsystem um – ohne fertige Methode.","uses":["while","% 2","/ 2","StringBuilder"],"text":["Lies eine Zahl ≥ 0 ein und gib sie im Binärsystem aus. Benutze **nicht** `Integer.toBinaryString`: Teile immer wieder durch 2 und sammle die Reste – von hinten nach vorne gelesen ergeben sie die Binärzahl.","Gib außerdem aus, wie viele Einsen die Zahl hat."],"example":"13\nBinär: 1101\nEinsen: 3","lookup":["Lektion 4 · Quersumme-Muster: % und / in einer Schleife","Lektion 7 · StringBuilder `insert(0, …)` oder `reverse()`"],"starter":"public class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"\");\n        int n = sc.nextInt();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        StringBuilder sb = new StringBuilder();\n        int einsen = 0;\n        if (n == 0) sb.append(0);\n        while (n > 0) {\n            int bit = n % 2;\n            if (bit == 1) einsen++;\n            sb.insert(0, bit);\n            n = n / 2;\n        }\n        System.out.println(\"Binär: \" + sb);\n        System.out.println(\"Einsen: \" + einsen);\n    }\n}\n","tests":[{"name":"13","input":["13"],"expect":[{"re":"bin(ä|ae)r:?\\s*1101\\b","label":"1101"},{"re":"einsen:?\\s*3","label":"Einsen: 3"}]},{"name":"256","input":["256"],"expect":[{"re":"100000000\\b","label":"100000000"}]},{"name":"0","input":["0"],"expect":[{"re":"bin(ä|ae)r:?\\s*0\\b","label":"0 bleibt 0"}]}],"codeChecks":[{"label":"ohne Integer.toBinaryString","re":"^(?![\\s\\S]*toBinaryString)"}],"main":"Richtige Binärzahl und Anzahl der Einsen","tip":"Die Reste kommen in umgekehrter Reihenfolge heraus. `sb.insert(0, bit)` setzt jedes neue Bit vorne an."},{"id":"f05","nr":5,"level":"★★☆ Finale 5/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Anagramme richtig erkannt",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Anagramm-Check","teaser":"„Lampe“ und „Palme“ bestehen aus denselben Buchstaben. Erkennt dein Programm das?","uses":["toCharArray","Arrays.sort","equals"],"text":["Lies zwei Wörter ein. Sie sind **Anagramme**, wenn sie genau dieselben Buchstaben in anderer Reihenfolge enthalten (Groß/klein egal). Gib „Anagramm!“ oder „Kein Anagramm.“ aus."],"example":"Lampe\nPalme\nAnagramm!","lookup":["Lektion 7 · `toLowerCase` und `toCharArray`","Lektion 5 · `Arrays.sort` und `Arrays.equals` (oder ein Zähl-Array mit 26 Plätzen)"],"starter":"import java.util.Arrays;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String a = sc.nextLine();\n        String b = sc.nextLine();\n    }\n}\n","solution":"import java.util.Arrays;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        char[] a = sc.nextLine().toLowerCase().toCharArray();\n        char[] b = sc.nextLine().toLowerCase().toCharArray();\n        Arrays.sort(a);\n        Arrays.sort(b);\n        System.out.println(Arrays.equals(a, b) ? \"Anagramm!\" : \"Kein Anagramm.\");\n    }\n}\n","tests":[{"name":"Lampe/Palme","input":["Lampe","Palme"],"expect":[{"re":"(^|\\s)anagramm!","label":"Anagramm!"},{"re":"kein","label":"nicht „Kein“","not":true}]},{"name":"Regen/Gerne","input":["Regen","Gerne"],"expect":[{"re":"anagramm!","label":"Anagramm!"},{"re":"kein","not":true,"label":"nicht „Kein“"}]},{"name":"Haus/Maus","input":["Haus","Maus"],"expect":[{"re":"kein anagramm","label":"Kein Anagramm."}]},{"name":"Länge","input":["abc","abcc"],"expect":[{"re":"kein anagramm","label":"unterschiedliche Länge"}]}],"main":"Anagramme richtig erkannt","tip":"Sortiert man die Buchstaben beider Wörter, müssen bei Anagrammen genau gleiche Arrays herauskommen."},{"id":"f06","nr":6,"level":"★★☆ Finale 6/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Richtige römische Zahl auch bei 4, 9, 40, 90 …",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Römische Zahlen","teaser":"Aus 2026 wird MMXXVI. Bau den Umwandler, den schon die Römer gebraucht hätten.","uses":["Arrays","while","StringBuilder"],"text":["Lies eine Zahl von 1 bis 3999 ein und gib sie als römische Zahl aus. Tipp: Zwei parallele Arrays helfen – `{1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1}` und `{\"M\", \"CM\", \"D\", \"CD\", \"C\", \"XC\", \"L\", \"XL\", \"X\", \"IX\", \"V\", \"IV\", \"I\"}`."],"example":"2026\nMMXXVI","lookup":["Lektion 5 · zwei Arrays mit gleichem Index","Lektion 4 · while: so lange abziehen, wie es passt"],"starter":"public class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"\");\n        int n = sc.nextInt();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int[] werte = {1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1};\n        String[] zeichen = {\"M\", \"CM\", \"D\", \"CD\", \"C\", \"XC\", \"L\", \"XL\", \"X\", \"IX\", \"V\", \"IV\", \"I\"};\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < werte.length; i++) {\n            while (n >= werte[i]) {\n                sb.append(zeichen[i]);\n                n -= werte[i];\n            }\n        }\n        System.out.println(sb);\n    }\n}\n","tests":[{"name":"2026","input":["2026"],"expect":[{"re":"\\bMMXXVI\\b","flags":"","label":"MMXXVI"}]},{"name":"1994","input":["1994"],"expect":[{"re":"\\bMCMXCIV\\b","flags":"","label":"MCMXCIV"}]},{"name":"4","input":["4"],"expect":[{"re":"\\bIV\\b","flags":"","label":"IV"}]}],"main":"Richtige römische Zahl auch bei 4, 9, 40, 90 …","tip":"Geh die Werte von groß nach klein durch und zieh jeden so oft ab, wie er hineinpasst."},{"id":"f07","nr":7,"level":"★★☆ Finale 7/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Richtig gezählt und das häufigste Wort gefunden",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Häufigstes Wort","teaser":"Welches Wort kommt in einem Text am öftesten vor? Mit einer HashMap ein Klacks.","uses":["HashMap","split","Maximum"],"text":["Lies eine Zeile Text ein (Wörter durch Leerzeichen getrennt, Groß/klein egal). Zähle mit einer `HashMap<String, Integer>`, wie oft jedes Wort vorkommt. Gib aus: „Verschiedene Wörter: …“ und „Häufigstes: Wort (N×)“. Bei Gleichstand gewinnt das Wort, das **zuerst** im Text stand."],"example":"der hund und der ball und der baum\nVerschiedene Wörter: 5\nHäufigstes: der (3×)","lookup":["HashMap: `map.put(wort, map.getOrDefault(wort, 0) + 1)` und `map.get(wort)`","Lektion 7 · split und toLowerCase","Lektion 9 · bestes Element merken"],"starter":"import java.util.HashMap;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String[] woerter = sc.nextLine().toLowerCase().split(\" \");\n        HashMap<String, Integer> zaehler = new HashMap<>();\n    }\n}\n","solution":"import java.util.HashMap;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String[] woerter = sc.nextLine().toLowerCase().split(\" \");\n        HashMap<String, Integer> zaehler = new HashMap<>();\n        for (String w : woerter) {\n            zaehler.put(w, zaehler.getOrDefault(w, 0) + 1);\n        }\n        String best = woerter[0];\n        for (String w : woerter) {\n            if (zaehler.get(w) > zaehler.get(best)) best = w;\n        }\n        System.out.println(\"Verschiedene Wörter: \" + zaehler.size());\n        System.out.println(\"Häufigstes: \" + best + \" (\" + zaehler.get(best) + \"×)\");\n    }\n}\n","tests":[{"name":"der","input":["der hund und der ball und der baum"],"expect":[{"re":"verschiedene w(ö|oe)rter:?\\s*5","label":"5 verschiedene"},{"re":"h(ä|ae)ufigstes:?\\s*der\\b[^\\n]*3","label":"der (3×)"}]},{"name":"Gleichstand","input":["Rot Blau rot blau Gelb"],"expect":[{"re":"h(ä|ae)ufigstes:?\\s*rot\\b[^\\n]*2","label":"rot (2×), weil zuerst"}]}],"codeChecks":[{"label":"HashMap verwendet","re":"HashMap\\s*<\\s*String\\s*,\\s*Integer\\s*>"}],"main":"Richtig gezählt und das häufigste Wort gefunden","tip":"Für den Gleichstand: Geh beim Suchen des Maximums die Wörter in der **Text-Reihenfolge** durch, nicht die HashMap."},{"id":"f08","nr":8,"level":"★★☆ Finale 8/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["pack und unpack richtig",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Lauflängen-Kodierung","teaser":"So sparten alte Spiele Speicher: „aaabcc“ wird zu „a3b1c2“. Und zurück!","uses":["charAt","Zähler","StringBuilder"],"text":["Lies einen Befehl und einen Text ein. Bei „pack“ fasst du gleiche Zeichen in Folge zusammen: „aaabcc“ → „a3b1c2“. Bei „unpack“ machst du das Gegenteil: „a3b1c2“ → „aaabcc“ (die Zahlen sind einstellig)."],"example":"pack\nwwwwbbbw\nw4b3w1","lookup":["Lektion 7 · Zeichen vergleichen mit charAt(i) und charAt(i + 1)","Lektion 7 · `repeat` und `Character.getNumericValue` bzw. `c - '0'`"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String befehl = sc.nextLine();\n        String text = sc.nextLine();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String befehl = sc.nextLine();\n        String text = sc.nextLine();\n        StringBuilder sb = new StringBuilder();\n        if (befehl.equals(\"pack\")) {\n            int i = 0;\n            while (i < text.length()) {\n                char c = text.charAt(i);\n                int n = 0;\n                while (i < text.length() && text.charAt(i) == c) {\n                    n++;\n                    i++;\n                }\n                sb.append(c).append(n);\n            }\n        } else {\n            for (int i = 0; i < text.length(); i += 2) {\n                char c = text.charAt(i);\n                int n = text.charAt(i + 1) - '0';\n                sb.append(String.valueOf(c).repeat(n));\n            }\n        }\n        System.out.println(sb);\n    }\n}\n","tests":[{"name":"pack","input":["pack","wwwwbbbw"],"expect":[{"re":"^w4b3w1$","flags":"m","label":"w4b3w1"}]},{"name":"pack 2","input":["pack","aaabcc"],"expect":[{"re":"^a3b1c2$","flags":"m","label":"a3b1c2"}]},{"name":"unpack","input":["unpack","#5.3#2"],"expect":[{"re":"^#####\\.\\.\\.##$","flags":"m","label":"#####...##"}]}],"main":"pack und unpack richtig","tip":"Beim Packen: Zähl in einer inneren while-Schleife, solange dasselbe Zeichen kommt."},{"id":"f09","nr":9,"level":"★★☆ Finale 9/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Gitter richtig gedreht",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Matrix drehen","teaser":"Tetris-Steine drehen sich um 90°. Dreh ein ganzes Zeichen-Gitter im Uhrzeigersinn.","uses":["2D-Array","Index-Rechnung"],"text":["Lies die Anzahl der Zeilen und dann die Zeilen eines rechteckigen Gitters ein. Gib es um **90° im Uhrzeigersinn** gedreht aus. Aus einem Gitter mit h Zeilen und b Spalten wird eins mit b Zeilen und h Spalten."],"example":"2\nabc\ndef\nda\neb\nfc","lookup":["Lektion 11 · 2D-Arrays","Überleg mit Papier: Welches alte Feld landet in neuer Zeile y, Spalte x?"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int h = Integer.parseInt(sc.nextLine());\n        char[][] g = new char[h][];\n        for (int y = 0; y < h; y++) g[y] = sc.nextLine().toCharArray();\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int h = Integer.parseInt(sc.nextLine());\n        char[][] g = new char[h][];\n        for (int y = 0; y < h; y++) g[y] = sc.nextLine().toCharArray();\n        int b = g[0].length;\n        for (int y = 0; y < b; y++) {\n            StringBuilder sb = new StringBuilder();\n            for (int x = 0; x < h; x++) {\n                sb.append(g[h - 1 - x][y]);\n            }\n            System.out.println(sb);\n        }\n    }\n}\n","tests":[{"name":"2×3","input":["2","abc","def"],"expect":[{"re":"^da\\neb\\nfc$","flags":"m","label":"da / eb / fc"}]},{"name":"Tetris-L","input":["3","#.","#.","##"],"expect":[{"re":"^###\\n#\\.\\.$","flags":"m","label":"### / #.."}]}],"main":"Gitter richtig gedreht","tip":"Neue Zeile y, Spalte x kommt aus der alten Zeile h − 1 − x, Spalte y."},{"id":"f10","nr":10,"level":"★★☆ Finale 10/20","req":["Ausgabe genau wie im Beispiel","Alle Tests bestehen","Lösung mit den Mitteln aus dem Kurs"],"rubric":[["Programm kompiliert und läuft",15],["Richtig sortiert und Tausche gezählt",45],["Passende Mittel (Schleifen, Methoden, Klassen) sinnvoll eingesetzt",25],["Lesbarer Code: gute Namen, saubere Einrückung",15]],"title":"Bubble Sort selbst gebaut","teaser":"Sortieren ohne Arrays.sort – und mitzählen, wie viele Tausche es braucht.","uses":["Arrays","verschachtelte Schleifen","Tauschen"],"text":["Lies eine Zeile mit Zahlen ein (Leerzeichen getrennt). Sortiere sie aufsteigend mit **Bubble Sort**: Geh immer wieder durch das Array und tausche benachbarte Zahlen, die falsch herum stehen. Benutze kein `Arrays.sort`.","Gib das sortierte Array aus und „Tausche: …“."],"example":"5 1 4 2 8\n1 2 4 5 8\nTausche: 4","lookup":["Lektion 5 · Tauschen mit Hilfsvariable","Lektion 4 · verschachtelte Schleifen","Lektion 7 · split + parseInt"],"starter":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String[] teile = sc.nextLine().split(\" \");\n        int[] a = new int[teile.length];\n        for (int i = 0; i < a.length; i++) a[i] = Integer.parseInt(teile[i]);\n    }\n}\n","solution":"import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String[] teile = sc.nextLine().split(\" \");\n        int[] a = new int[teile.length];\n        for (int i = 0; i < a.length; i++) a[i] = Integer.parseInt(teile[i]);\n        int tausche = 0;\n        for (int runde = 0; runde < a.length - 1; runde++) {\n            for (int i = 0; i < a.length - 1 - runde; i++) {\n                if (a[i] > a[i + 1]) {\n                    int tmp = a[i];\n                    a[i] = a[i + 1];\n                    a[i + 1] = tmp;\n                    tausche++;\n                }\n            }\n        }\n        StringBuilder sb = new StringBuilder();\n        for (int x : a) sb.append(x).append(\" \");\n        System.out.println(sb.toString().trim());\n        System.out.println(\"Tausche: \" + tausche);\n    }\n}\n","tests":[{"name":"5 1 4 2 8","input":["5 1 4 2 8"],"expect":[{"re":"^1 2 4 5 8$","flags":"m","label":"1 2 4 5 8"},{"re":"tausche:?\\s*4\\b","label":"Tausche: 4"}]},{"name":"rückwärts","input":["4 3 2 1"],"expect":[{"re":"^1 2 3 4$","flags":"m","label":"1 2 3 4"},{"re":"tausche:?\\s*6\\b","label":"Tausche: 6"}]}],"codeChecks":[{"label":"ohne Arrays.sort","re":"^(?![\\s\\S]*Arrays\\.sort)"}],"main":"Richtig sortiert und Tausche gezählt","tip":"Nach jeder Runde steht die größte Zahl ganz hinten – die innere Schleife darf deshalb jedes Mal einen Schritt kürzer werden."},{"id":"f11","nr":11,"level":"★★☆ Finale 11/20","req":["Ausgabe genau wie im Beispiel","Alle
